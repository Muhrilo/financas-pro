        if (!categoryKeyOrName) return { key: 'outros', name: 'Outros', label: 'Outros', emoji: '📌', color: 'slate', subcategories: [] };
        const list = Array.isArray(customCategories) && customCategories.length > 0 ? customCategories : DEFAULT_CATEGORIES;
        const target = String(categoryKeyOrName).trim().toLowerCase();
        const found = list.find((c) =>
          (c.key && c.key.toLowerCase() === target) ||

          (c.name && c.name.toLowerCase() === target) ||
          (c.label && c.label.toLowerCase() === target)
        );
        if (found) {
          return {
            key: found.key || found.id,

            color: found.color || 'slate',
            subcategories: found.subcategories || [],
          };
        }
        const legacyKey = CAT_KEY_MAP[target];
        if (legacyKey) {
          const legacyFound = list.find((c) => c.key === legacyKey);
          if (legacyFound) {
            return {
              key: legacyFound.key || legacyFound.id,
              name: legacyFound.name || legacyFound.label,

              emoji: legacyFound.emoji || '📁',

            };
          }
        }
        return {
          key: target,

        };

      const normalizeCategoryKey = (k = '') => {

      const CAT_RULES = [
        ['moradia', /aluguel|condom|energia|luz\b|água|agua|internet|casa/i],
        ['alimentacao', /mercado|comida|ifood|restaurante|lanche|padaria|feira/i],

        ['lazer', /cinema|viagem|bar\b|show|jogo|lazer/i],

      const guessCategory = (d = '') => (CAT_RULES.find(([, re]) => re.test(d)) || ['outros'])[0];

      const roundMoney = (v) => Math.round((Number(v) || 0) * 100) / 100;
      // Interpreta entradas BR ("1.234,56"), US ("1234.56") e simples ("10,5") sem erro de 100x/1000x
      const parseMoneyInput = (v) => {
        if (typeof v === 'number') return Number.isFinite(v) ? roundMoney(v) : 0;
        let t = String(v ?? '').replace(/[^\d.,-]/g, '');
        const neg = t.startsWith('-') || t.endsWith('-');
        t = t.replace(/-/g, '');
        const lc = t.lastIndexOf(',');
        const ld = t.lastIndexOf('.');
        if (lc >= 0 && ld >= 0) {
          const dec = lc > ld ? ',' : '.';
          const thou = dec === ',' ? '.' : ',';
          t = t.split(thou).join('').replace(dec, '.');
        } else if (lc >= 0) {
          t = (t.match(/,/g) || []).length > 1 ? t.split(',').join('') : t.replace(',', '.');
        } else if (ld >= 0) {
          const parts = t.split('.');
          if (parts.length > 2 || (parts.length === 2 && parts[1].length === 3 && parts[0] !== '' && parts[0] !== '0')) t = parts.join('');
        }
        const n = parseFloat(t);
        return Number.isFinite(n) ? roundMoney(neg ? -n : n) : 0;
      };

      const brlFormatter = new Intl.NumberFormat('pt-BR', {

      const formatMonthYear = (m, y) =>

      const formatDateBR = (dateStr) => {
        if (!dateStr) return '';
        const parts = String(dateStr).split('-');
        if (parts.length !== 3) return dateStr;
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      };

      const formatDateShortBR = (dateStr) => {
        if (!dateStr) return '';
        const parts = String(dateStr).split('-');
        if (parts.length !== 3) return dateStr;
        return `${parts[2]}/${parts[1]}`;

      const getExpenseDueInfo = (item, paymentMethods, currentMonthIndex, currentYear, cards = []) => {
        if (item.status === 'Pago') {
          return {
            isPaid: true,
            text: item.paidDate ? `Pago em ${formatDateShortBR(item.paidDate)}` : 'Já Pago',
            fullText: item.paidDate ? `Pago em ${formatDateBR(item.paidDate)}` : 'Pago',
            tone: 'success',
            dueDay: null,
          };
        }
        let dueDay = null;
        if (item.dueDate) {
          const parts = item.dueDate.split('-');
          if (parts.length === 3) {
            dueDay = parseInt(parts[2], 10);
          }
        }
        if (!dueDay && item.cardId && Array.isArray(cards)) {
          const card = cards.find((c) => c.id === item.cardId);
          if (card?.dueDay) dueDay = card.dueDay;
        }
        if (!dueDay && paymentMethods) {
          const pm = paymentMethods.find((p) => (item.cardId && p.id === item.cardId) || p.name === item.paymentMethod);
          if (pm?.dueDay) dueDay = pm.dueDay;
        }

        if (!dueDay) {
          const isUnspecified = item.paymentMode === 'unspecified' || item.paymentMethod === 'A definir';
          return {
            isPaid: false,
            text: isUnspecified ? 'A definir' : 'Sem vencimento',
            fullText: isUnspecified ? 'Forma e vencimento a definir' : 'Sem vencimento definido',
            tone: 'muted',
            dueDay: null,
          };
        }

        const now = new Date();
        const isCurrentRealMonth =
          now.getMonth() === currentMonthIndex && now.getFullYear() === currentYear;

        if (!isCurrentRealMonth) {
          return {
            isPaid: false,
            text: `Vence dia ${dueDay}`,
            fullText: `Vencimento dia ${dueDay}`,
            tone: 'neutral',
            dueDay,
          };
        }

        const diff = dueDay - now.getDate();
        if (diff < 0) {
          return {
            isPaid: false,
            text: `Venceu dia ${dueDay} (${Math.abs(diff)}d)`,
            fullText: `Atrasada há ${Math.abs(diff)} dia(s)`,
            tone: 'danger',
            dueDay,
          };
        }
        if (diff === 0) {
          return {
            isPaid: false,
            text: 'Vence hoje!',
            fullText: 'Vence hoje!',
            tone: 'urgent',
            dueDay,
          };
        }
        if (diff === 1) {
          return {
            isPaid: false,
            text: `Vence amanhã (${dueDay})`,
            fullText: 'Vence amanhã',
            tone: 'warn',
            dueDay,
          };
        }
        if (diff <= 5) {
          return {
            isPaid: false,
            text: `Vence em ${diff}d (${dueDay})`,
            fullText: `Vence em ${diff} dias`,
            tone: 'warn',
            dueDay,
          };
        }
        return {
          isPaid: false,
          text: `Vence dia ${dueDay}`,
          fullText: `Vencimento dia ${dueDay}`,
          tone: 'neutral',
          dueDay,
        };

      const getNextMonthYear = (m, y, offset = 1) => {
        const total = y * 12 + m + offset;

      const DEFAULT_ACCOUNTS = [

      function buildPaymentMethodsView(accounts, cards) {
        const list = [];

      const DEFAULT_PAYMENT_METHODS = buildPaymentMethodsView(DEFAULT_ACCOUNTS, DEFAULT_CARDS);

      function normalizeFinancialEntities(raw) {
        let accounts = [];

        if (Array.isArray(raw?.accounts) && raw.accounts.length > 0) {
          accounts = raw.accounts.map((a) => ({

        if (Array.isArray(raw?.cards) && raw.cards.length > 0) {

            closingDay: c.closingDay ? Math.min(31, Math.max(1, parseInt(c.closingDay, 10) || 1)) : 3,

            linkedAccountId: c.linkedAccountId || null,
            color: c.color || 'slate',
            isSettled: Boolean(c.isSettled),
            isArchived: Boolean(c.isArchived),
          }));
        }

        if (accounts.length === 0 && cards.length === 0) {
          const legacy = Array.isArray(raw?.paymentMethods) && raw.paymentMethods.length > 0
            ? raw.paymentMethods
            : DEFAULT_PAYMENT_METHODS;

          legacy.filter((pm) => pm.isCard === false).forEach((pm) => {
            accounts.push({
              id: pm.id?.startsWith('acc-') ? pm.id : `acc-${pm.id || generateId('acc')}`,
              name: pm.name,
              type: pm.name.toLowerCase().includes('dinheiro') ? 'carteira' : 'corrente',
              initialBalance: Number(pm.initialBalance) || 0,
              color: pm.color || 'slate',
              isArchived: false,
            });
          });

          if (accounts.length === 0) {
            accounts = DEFAULT_ACCOUNTS.map((a) => ({ ...a }));
          }

          legacy.filter((pm) => pm.isCard !== false).forEach((pm) => {
            let linkedId = null;
            if (pm.linkedAccountId) {
              linkedId = pm.linkedAccountId;
            } else if (pm.linkedAccount) {
              const f = accounts.find((a) => a.name.toLowerCase() === pm.linkedAccount.toLowerCase());
              if (f) linkedId = f.id;
            }
            if (!linkedId && accounts.length > 0) {
              if (pm.name.toLowerCase().includes('nubank')) {
                linkedId = accounts.find((a) => a.name.toLowerCase().includes('nubank'))?.id || accounts[0].id;
              } else if (pm.name.toLowerCase().includes('mercado') || pm.name.toLowerCase().includes('inter')) {
                linkedId = accounts.find((a) => a.name.toLowerCase().includes('mercado') || a.name.toLowerCase().includes('inter'))?.id || accounts[0].id;
              } else {
                linkedId = accounts[0].id;
              }
            }

            cards.push({
              id: pm.id?.startsWith('card-') ? pm.id : `card-${pm.id || generateId('card')}`,
              name: pm.name,
              limit: Number(pm.limit) || 0,
              closingDay: pm.closingDay || 3,
              dueDay: pm.dueDay || 10,
              linkedAccountId: linkedId,
              color: pm.color || 'slate',
              isSettled: Boolean(pm.isSettled),
              isArchived: false,
            });
          });

          if (cards.length === 0) {
            cards = DEFAULT_CARDS.map((c) => ({ ...c }));
          }
        }

        const paymentMethods = buildPaymentMethodsView(accounts, cards);
        return { accounts, cards, paymentMethods };
      }

      function normalizePaymentMethods(list) {
        if (!Array.isArray(list) || list.length === 0) {
          return buildPaymentMethodsView(DEFAULT_ACCOUNTS, DEFAULT_CARDS);
        }
        const { paymentMethods } = normalizeFinancialEntities({ paymentMethods: list });
        return paymentMethods;

      function isExpenseForCard(e, card, allCards = []) {
        if (!card || !e) return false;
        if (e.cardId && e.cardId === card.id) return true;
        if (e.paidCardId && e.paidCardId === card.id) return true;
        
        const cardName = (card.name || '').trim();
        const pm = (e.paymentMethod || '').trim();
        const acc = (e.account || '').trim();
        const paidAcc = (e.paidAccount || '').trim();

        if (pm && (pm === cardName || pm === `Cartão ${cardName}`)) return true;
        if (acc && (acc === cardName || acc === `Cartão ${cardName}`)) return true;
        if (paidAcc && (paidAcc === cardName || paidAcc === `Cartão ${cardName}`)) return true;

        const pmLower = pm.toLowerCase();
        const cardLower = cardName.toLowerCase();

        if (pmLower && (pmLower === cardLower || pmLower === `cartão ${cardLower}` || cardLower.includes(pmLower) || pmLower.includes(cardLower))) {
          if (e.paymentMode !== 'account') return true;
        }

        if (e.paymentMode === 'card') {
          if (allCards.length === 1) return true;
          if (pmLower && cardLower && (cardLower.includes(pmLower) || pmLower.includes(cardLower))) return true;
          const kwList = ['mercado', 'nubank', 'inter', 'itau', 'itaú', 'bradesco', 'santander', 'c6'];
          for (const kw of kwList) {
            if (cardLower.includes(kw) && (pmLower.includes(kw) || (e.description || '').toLowerCase().includes(kw))) {
              return true;
            }
          }
        }
        return false;
      }

      function isExpenseForAccount(e, acc, allAccounts = []) {
        if (!acc || !e) return false;
        if (e.accountId && e.accountId === acc.id) return true;
        if (e.paidAccountId && e.paidAccountId === acc.id) return true;

        const accName = (acc.name || '').trim();
        const pm = (e.paymentMethod || '').trim();
        const accountField = (e.account || '').trim();
        const paidAcc = (e.paidAccount || '').trim();

        if (pm && (pm === accName || pm.startsWith(`${accName} `))) return true;
        if (accountField && (accountField === accName || accountField.startsWith(`${accName} `))) return true;
        if (paidAcc && (paidAcc === accName || paidAcc.startsWith(`${accName} `))) return true;

        const pmLower = pm.toLowerCase();
        const accLower = accName.toLowerCase();

        if (acc.type === 'carteira' && (e.paidSource === 'dinheiro_fisico' || pmLower.includes('dinheiro'))) {
          return true;
        }

        if (pmLower && (pmLower === accLower || pmLower.startsWith(accLower) || accLower.startsWith(pmLower))) {
          if (e.paymentMode !== 'card') return true;
        }

        if (e.paymentMode === 'account') {
          if (allAccounts.length === 1) return true;
          if (pmLower && accLower && (accLower.includes(pmLower) || pmLower.includes(accLower))) return true;
          const kwList = ['mercado', 'nubank', 'inter', 'itau', 'itaú', 'bradesco', 'santander', 'carteira'];
          for (const kw of kwList) {
            if (accLower.includes(kw) && (pmLower.includes(kw) || (e.description || '').toLowerCase().includes(kw))) {
              return true;
            }
          }
        }
        return false;
      }

      function normalizeExpenseEntity(e, accounts = [], cards = []) {
        let paymentMode = e.paymentMode;
        let cardId = e.cardId || null;
        let accountId = e.accountId || null;

        // Auto-heal card association
        if (paymentMode === 'card') {
          if (cardId && !cards.some((c) => c.id === cardId)) {
            cardId = null;
          }
          if (!cardId) {
            const matchedCard = cards.find((c) => isExpenseForCard(e, c, cards)) || cards[0];
            if (matchedCard) cardId = matchedCard.id;
          }
        } else if (paymentMode === 'account') {
          if (accountId && !accounts.some((a) => a.id === accountId)) {
            accountId = null;
          }
          if (!accountId) {
            const matchedAcc = accounts.find((a) => isExpenseForAccount(e, a, accounts)) || accounts[0];
            if (matchedAcc) accountId = matchedAcc.id;
          }
        } else {
          // If paymentMode is not set or unspecified, check if it matches a card or account
          const matchedCard = cards.find((c) => isExpenseForCard(e, c, cards));
          if (matchedCard && (e.paymentMethod === matchedCard.name || e.paymentMethod === `Cartão ${matchedCard.name}`)) {
            paymentMode = 'card';
            cardId = matchedCard.id;
          } else {
            const matchedAcc = accounts.find((a) => isExpenseForAccount(e, a, accounts));
            if (matchedAcc && (e.paymentMethod === matchedAcc.name || e.paidAccount === matchedAcc.name)) {
              paymentMode = 'account';
              accountId = matchedAcc.id;
            } else {
              paymentMode = (e.paymentMethod === 'A definir' || !e.paymentMethod) ? 'unspecified' : 'unspecified';
            }
          }
        }

        let paidAccountId = e.paidAccountId || null;
        let paidCardId = e.paidCardId || null;
        if (e.status === 'Pago') {
          if (e.paidSource === 'cartao' || paymentMode === 'card') {
            paidCardId = paidCardId || cardId || (cards[0]?.id || null);
          } else {
            if (!paidAccountId && e.paidAccount) {
              const acc = accounts.find((a) => a.name === e.paidAccount || a.id === accountId);
              if (acc) paidAccountId = acc.id;
            }
            if (!paidAccountId && accountId) {
              paidAccountId = accountId;
            }
            if (!paidAccountId && accounts.length > 0) {
              const acc = accounts.find((a) => isExpenseForAccount(e, a, accounts)) || accounts[0];
              if (acc) paidAccountId = acc.id;
            }
          }
        }

        const cardObj = cardId ? cards.find((c) => c.id === cardId) : null;
        const accObj = accountId ? accounts.find((a) => a.id === accountId) : null;
        const paymentMethod =
          paymentMode === 'card'
            ? (cardObj ? cardObj.name : e.paymentMethod || 'Cartão')
            : paymentMode === 'account'
            ? (accObj ? accObj.name : e.paymentMethod || 'Conta')
            : 'A definir';

        return {
          ...e,
          paymentMode: paymentMode || 'unspecified',
          cardId,
          accountId,
          paidAccountId,
          paidCardId,
          paymentMethod,
          account: paymentMethod,
          isInvoicePaid: Boolean(e.isInvoicePaid),
          reconciled: Boolean(e.reconciled),
          createdAt: e.createdAt || 0,
          invoiceName: (e.invoiceName || '').trim(),
          legend: (e.legend || e.notes || '').trim(),
          notes: (e.notes || e.legend || '').trim(),
          subcategory: e.subcategory || '',
          tags: Array.isArray(e.tags) ? e.tags : (typeof e.tags === 'string' && e.tags.trim() ? e.tags.split(',').map((t) => t.trim()).filter(Boolean) : (e.tag ? [e.tag] : [])),
        };
      }

      function getDueBadgeInfo(dueDay, currentMonthIndex, currentYear) {
        if (!dueDay) return null;
        const now = new Date();
        const isCurrentRealMonth =
          now.getMonth() === currentMonthIndex && now.getFullYear() === currentYear;
        if (!isCurrentRealMonth) {
          return { text: `Vence dia ${dueDay}`, tone: 'neutral' };
        }
        const diff = dueDay - now.getDate();
        if (diff < 0) return { text: `Venceu dia ${dueDay}`, tone: 'danger' };
        if (diff === 0) return { text: 'Vence hoje!', tone: 'danger' };
        if (diff <= 3) return { text: `Vence em ${diff}d (dia ${dueDay})`, tone: 'warn' };
        return { text: `Vence dia ${dueDay}`, tone: 'neutral' };
      }

            function getExpenseBaseAbs(item, defaultMonthIndex, defaultYear) {
        if (item.dueDate) {
          const parts = String(item.dueDate).split('-');
          if (parts.length >= 2) {
            const y = parseInt(parts[0], 10);
            const m = parseInt(parts[1], 10) - 1;
            if (!Number.isNaN(y) && !Number.isNaN(m)) {
              return y * 12 + m;
            }
          }
        }
        if (item.targetYear !== undefined && item.targetMonthIndex !== undefined) {
          return item.targetYear * 12 + item.targetMonthIndex;
        }
        if (item.baseAbs !== undefined) {
          return item.baseAbs;
        }
        return defaultYear * 12 + defaultMonthIndex;
      }

      const activeIn = (e, abs) =>
        !(e.skip || []).includes(abs) && !(e.endAbs !== undefined && abs > e.endAbs);

      function generate12MonthProjection(expenses, startMonth, startYear) {
        const points = [];
        for (let offset = 0; offset < 12; offset++) {
          const { monthIndex, year } = getNextMonthYear(startMonth, startYear, offset);
          const targetAbs = year * 12 + monthIndex;
          let fixedTotal = 0;
          let installmentTotal = 0;
          let sporadicTotal = 0;
          let overdueTotal = 0;
          let activeInstallmentsCount = 0;
          const itemsInMonth = [];

          for (const item of expenses) {
            if (!activeIn(item, targetAbs)) continue;
            const baseAbs = getExpenseBaseAbs(item, startMonth, startYear);

            if (item.type === 'Fixo') {
              if (targetAbs >= baseAbs) {
                fixedTotal += item.amount;
                const currentDueDay = item.dueDate ? item.dueDate.split('-')[2] : '10';
                const ym = `${year}-${String(monthIndex + 1).padStart(2, '0')}`;
                const thisDueDate = `${ym}-${String(currentDueDay).padStart(2, '0')}`;
                itemsInMonth.push({ ...item, dueDate: thisDueDate, typeLabel: 'Fixo' });
              }
            } else if (item.type === 'Parcelado') {
              const currentInst = Number(item.currentInstallment) || 1;
              const totalInst = Number(item.totalInstallments) || 1;
              // Nunca projeta para trás em meses anteriores ao vencimento/base (evita fantasmas no mês atual)
              if (targetAbs >= baseAbs) {
                const delta = targetAbs - baseAbs;
                const instInView = currentInst + delta;
                if (instInView <= totalInst) {
                  installmentTotal += item.amount;
                  activeInstallmentsCount += 1;
                  const currentDueDay = item.dueDate ? item.dueDate.split('-')[2] : '10';
                  const ym = `${year}-${String(monthIndex + 1).padStart(2, '0')}`;
                  const thisDueDate = `${ym}-${String(currentDueDay).padStart(2, '0')}`;
                  itemsInMonth.push({
                    ...item,
                    currentInstallment: instInView,
                    dueDate: thisDueDate,
                    typeLabel: `Parcela ${instInView}/${totalInst}`,
                  });
                }
              }
            } else if (item.type === 'Esporádico') {
              if (baseAbs === targetAbs) {
                sporadicTotal += item.amount;
                itemsInMonth.push({ ...item, typeLabel: 'Pontual' });
              } else if (targetAbs > baseAbs && item.status === 'Pendente') {
                overdueTotal += item.amount;
                itemsInMonth.push({
                  ...item,
                  typeLabel: `Atrasado desde ${MONTHS_SHORT[baseAbs % 12]}/${Math.floor(baseAbs / 12)}`,
                  isOverdue: true,
                });
              }
            }
          }

          const total = fixedTotal + installmentTotal + sporadicTotal + overdueTotal;
          const baseTotal = points.length === 0 ? total : points[0].total;

          points.push({
            monthOffset: offset,
            monthIndex,
            year,
            label: `${MONTHS_FULL[monthIndex]} ${year}`,
            shortLabel: `${MONTHS_SHORT[monthIndex]}/${String(year).slice(-2)}`,
            fixedTotal,
            installmentTotal,
            sporadicTotal,
            overdueTotal,
            total,
            freedComparedToCurrent: Math.max(0, baseTotal - total),
            activeInstallmentsCount,
            itemsInMonth,
          });
        }
        return points;
      }

      function calculateAccountBalances(accounts = [], expenses = [], invoiceSettlements = [], currentMonthIndex = 0, currentYear = 2026) {
        const map = {};
        (accounts || []).forEach((acc) => {
          map[acc.id] = {
            account: acc,
            initialBalance: Number(acc.initialBalance) || 0,
            directExpensesPaid: 0,
            invoiceSettlementsPaid: 0,
            totalOutflows: 0,
            pendingExpenses: 0,
            pendingCount: 0,
            currentBalance: Number(acc.initialBalance) || 0,
          };
        });

        // Expenses linked to accounts (paid and pending)
        (expenses || []).forEach((e) => {
          if (e.paidSource !== 'cartao' && e.paymentMode !== 'card') {
            let accId = e.paidAccountId;
            if (!accId && e.paidAccount) {
              const found = (accounts || []).find((a) => a.name === e.paidAccount);
              if (found) accId = found.id;
            }
            if (!accId && e.accountId) accId = e.accountId;
            if (!accId) {
              const matched = (accounts || []).find((a) => isExpenseForAccount(e, a, accounts || []));
              if (matched) accId = matched.id;
            }
            if (accId && map[accId]) {
              if (e.status === 'Pago') {
                map[accId].directExpensesPaid += e.amount;
              } else if (e.status === 'Pendente') {
                map[accId].pendingExpenses += e.amount;
                map[accId].pendingCount += 1;
              }
            }
          }
        });

        // Invoice settlements paid in this month
        (invoiceSettlements || []).forEach((s) => {
          if (s.monthIndex === currentMonthIndex && s.year === currentYear) {
            if (map[s.paidAccountId]) {
              map[s.paidAccountId].invoiceSettlementsPaid += s.amount;
            }
          }
        });

        Object.values(map).forEach((item) => {
          item.totalOutflows = item.directExpensesPaid + item.invoiceSettlementsPaid;
          item.currentBalance = item.initialBalance - item.totalOutflows;
        });

        return map;
      }

      function advanceOneMonthState(s) {
        const curAbs = s.currentYear * 12 + s.currentMonthIndex;
        const currentLabel = formatMonthYear(s.currentMonthIndex, s.currentYear);
        const next = getNextMonthYear(s.currentMonthIndex, s.currentYear, 1);

        const activeExpenses = (s.expenses || []).filter((e) => {
          if (!activeIn(e, curAbs)) return false;
          const baseAbs = getExpenseBaseAbs(e, s.currentMonthIndex, s.currentYear);
          return curAbs >= baseAbs;
        });
        const activeIncomes = (s.incomes || []).filter((i) => activeIn(i, curAbs));

        const totalInc = activeIncomes.reduce((a, i) => a + (Number(i.realizedAmount) || 0), 0);
        const totalExp = activeExpenses.reduce((a, e) => a + (Number(e.amount) || 0), 0);
        const completed = activeExpenses.filter(
          (e) => e.type === 'Parcelado' && (Number(e.currentInstallment) || 1) >= (Number(e.totalInstallments) || 1)
        ).length;

        const snap = {
          id: generateId('h'),
          referenceLabel: currentLabel,
          totalIncomes: totalInc,
          totalExpenses: totalExp,
          freeBalance: totalInc - totalExp,
          completedInstallmentsCount: completed,
        };

        const nextExpenses = [];
        const isOpenCardPurchase = (x) =>
          x.status === 'Pago' && (x.paymentMode === 'card' || x.paidSource === 'cartao') && !x.isInvoicePaid;
        const nextDay = (x) => {
          const d = parseInt(String(x.dueDate || '').split('-')[2], 10) || 10;
          return Math.min(d, new Date(next.year, next.monthIndex + 1, 0).getDate());
        };

        for (const e of (s.expenses || [])) {
          const baseAbs = getExpenseBaseAbs(e, s.currentMonthIndex, s.currentYear);

          // Vencidos já carregados: permanecem como pendência única (nunca regeram recorrência)
          if (baseAbs <= curAbs && e.isOverdueCarryover && !isOpenCardPurchase(e)) {
            if (e.status === 'Pendente') nextExpenses.push({ ...e });
            continue;
          }
          // Compra no cartão com fatura em aberto: a dívida acompanha o mês seguinte
          if (baseAbs <= curAbs && isOpenCardPurchase(e)) {
            nextExpenses.push({
              ...e,
              id: generateId('exp'),
              type: 'Esporádico',
              currentInstallment: 1,
              totalInstallments: 1,
              skip: [],
              endAbs: undefined,
              isOverdueCarryover: false,
              description: /fatura anterior/i.test(e.description) ? e.description : `${e.description} (fatura anterior)`,
              originalDueDate: e.originalDueDate || e.dueDate || null,
              dueDate: `${next.year}-${String(next.monthIndex + 1).padStart(2, '0')}-${String(nextDay(e)).padStart(2, '0')}`,
              baseAbs: next.year * 12 + next.monthIndex,
              targetMonthIndex: next.monthIndex,
              targetYear: next.year,
            });
            if (e.type === 'Esporádico' || e.isOverdueCarryover) continue;
          }

          if (baseAbs > curAbs + 1) {
            nextExpenses.push({ ...e });
            continue;
          }

          if (baseAbs === curAbs + 1) {
            nextExpenses.push({
              ...e,
              status: 'Pendente',
              reconciled: false,
              paidDate: null,
              paidSource: null,
              paidAccountId: null,
              paidCardId: null,
              isInvoicePaid: false,
            });
            continue;
          }

          if (!activeIn(e, curAbs + 1)) continue;

          let nextDueDate = e.dueDate || null;
          if (e.dueDate) {
            const parts = e.dueDate.split('-');
            if (parts.length === 3) {
              const maxDayInNext = new Date(next.year, next.monthIndex + 1, 0).getDate();
              const safeDay = Math.min(parseInt(parts[2], 10) || 10, maxDayInNext);
              nextDueDate = `${next.year}-${String(next.monthIndex + 1).padStart(2, '0')}-${String(safeDay).padStart(2, '0')}`;
            }
          }
          const nextBaseAbs = next.year * 12 + next.monthIndex;
          if (e.type === 'Fixo') {
            if (e.status === 'Pendente') {
              const originLabel = formatMonthYear(s.currentMonthIndex, s.currentYear);
              nextExpenses.push({
                ...e,
                id: `${e.id}-overdue-${curAbs}`,
                description: `${e.description} (Vencido - ${originLabel})`,
                type: 'Esporádico',
                isOverdueCarryover: true,
                status: 'Pendente',
                baseAbs: curAbs,
              });
            }
            nextExpenses.push({
              ...e,
              id: generateId('exp'),
              status: 'Pendente',
              reconciled: false,
              paidDate: null,
              paidSource: null,
              paidAccountId: null,
              paidCardId: null,
              isInvoicePaid: false,
              dueDate: nextDueDate,
              baseAbs: nextBaseAbs,
              targetMonthIndex: next.monthIndex,
              targetYear: next.year,
            });
          } else if (e.type === 'Parcelado') {
            const nextInst = (Number(e.currentInstallment) || 1) + 1;
            if (e.status === 'Pendente') {
              const originLabel = formatMonthYear(s.currentMonthIndex, s.currentYear);
              nextExpenses.push({
                ...e,
                id: `${e.id}-overdue-${curAbs}`,
                description: `${e.description} (Parc. ${e.currentInstallment}/${e.totalInstallments} em Atraso - ${originLabel})`,
                type: 'Esporádico',
                isOverdueCarryover: true,
                status: 'Pendente',
                baseAbs: curAbs,
              });
            }
            if (nextInst <= (Number(e.totalInstallments) || 1)) {
              nextExpenses.push({
                ...e,
                currentInstallment: nextInst,
                status: 'Pendente',
                reconciled: false,
                paidDate: null,
                paidSource: null,
                paidAccountId: null,
                paidCardId: null,
                isInvoicePaid: false,
                dueDate: nextDueDate,
                baseAbs: nextBaseAbs,
                targetMonthIndex: next.monthIndex,
                targetYear: next.year,
              });
            }
          } else if (e.type === 'Esporádico') {
            if (e.status === 'Pendente' || baseAbs > curAbs) {
              nextExpenses.push({ ...e });
            }
          }
        }

        const accBalances = calculateAccountBalances(s.accounts || [], activeExpenses, s.invoiceSettlements || [], s.currentMonthIndex, s.currentYear);
        const nextAccounts = (s.accounts || []).map((acc) => {
          const currentBal = accBalances[acc.id]?.currentBalance;
          return {
            ...acc,
            initialBalance: typeof currentBal === 'number' && !isNaN(currentBal) ? roundMoney(currentBal) : (Number(acc.initialBalance) || 0),
          };
        });

        const nextIds = new Set(nextExpenses.map((x) => x.id));
        const archived = (s.expenses || [])
          .filter((x) => x.status === 'Pago' && !nextIds.has(x.id) && !isOpenCardPurchase(x))
          .map((x) => ({ ...x, archivedMonth: currentLabel }));

        return {
          ...s,
          archive: [...(s.archive || []), ...archived],
          currentMonthIndex: next.monthIndex,
          currentYear: next.year,
          accounts: nextAccounts,
          expenses: nextExpenses,
          incomes: (s.incomes || []).map((i) => ({ ...i, realizedAmount: i.expectedAmount })),
          investments: (s.investments || []).map((inv) => ({ ...inv, contributedThisMonth: false })),
          history: [snap, ...(s.history || [])],
        };
      }

      function batchAdvanceMonthsState(initialState, count = 1) {
        let currentState = initialState;
        const numCycles = Math.max(1, Math.min(Number(count) || 1, 60));
        for (let i = 0; i < numCycles; i++) {
          currentState = advanceOneMonthState(currentState);
        }
        return currentState;
      }

      function triggerDownload(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

        const blob = new Blob(
          [JSON.stringify({ app: 'FinancasPro', version: 3, data: state }, null, 2)],
          { type: 'application/json;charset=utf-8' }
        );
        triggerDownload(blob, `financaspro-backup-${new Date().toISOString().slice(0, 10)}.json`);
      }

      function exportCSV(state) {
        const escapeCSV = (v) => {
          let s = String(v ?? '').replace(/"/g, '""');
          if (/^[=+\-@\t\r]/.test(s)) {
            s = `'` + s;
          }
          return `"${s}"`;
        };
        const esc = escapeCSV;
        const lines = [
          [
            'Seção',
            'Descrição / Nome',
            'Categoria',
            'Subcategoria',
            'Tags',
            'Tipo',
            'Parcela',
            'Valor / Realizado',
            'Previsto / Saldo Devedor',
            'Status / Obs',
            'Vencimento',
            'Data Pagamento',
            'Forma Pagamento',
            'Conta Debitada',
          ]
            .map(esc)
            .join(';'),
        ];
        state.incomes.forEach((i) =>
          lines.push(
            [
              'Renda',
              i.name,
              i.category || '-',
              i.subcategory || '-',
              (i.tags || []).join(', ') || '-',
              'Entrada',
              '-',
              (i.realizedAmount ?? 0).toFixed(2).replace('.', ','),
              (i.expectedAmount ?? 0).toFixed(2).replace('.', ','),
              i.notes || '-',
              '-',
              '-',
              '-',
              '-',
            ]
              .map(esc)
              .join(';')
          )
        );
        state.expenses.forEach((e) => {
          const d = calculateRemainingDebt(e);
          lines.push(
            [
              'Saída',
              e.description,
              e.category || '-',
              e.subcategory || '-',
              (e.tags || []).join(', ') || '-',
              e.type,
              formatInstallmentBadge(e),
              (e.amount ?? 0).toFixed(2).replace('.', ','),
              d !== null ? d.toFixed(2).replace('.', ',') : '-',
              e.status,
              e.dueDate ? formatDateBR(e.dueDate) : '-',
              e.paidDate ? formatDateBR(e.paidDate) : '-',
              e.paidSource === 'dinheiro_fisico' ? 'Dinheiro Físico' : e.paidSource === 'em_conta' ? 'Em Conta' : '-',
              e.paidAccount || e.account || e.paymentMethod || '-',
            ]
              .map(esc)
              .join(';')
          );
        });
        state.investments.forEach((inv) =>
          lines.push(
            [
              'Investimento',
              inv.institution,
              inv.type || '-',
              '-',
              '-',
              'Patrimônio',
              '-',
              (inv.currentBalance ?? 0).toFixed(2).replace('.', ','),
              (inv.plannedContribution ?? 0).toFixed(2).replace('.', ','),
              inv.contributedThisMonth ? 'Aportado no mês' : 'Aporte pendente',
              '-',
              '-',
              '-',
              '-',
            ]
              .map(esc)
              .join(';')
          )
        );
        const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
        triggerDownload(blob, `financaspro-relatorio-${new Date().toISOString().slice(0, 10)}.csv`);
      }

      /* ------------------------------------------------------------------ */
      /* Gráfico SVG de Projeção 12 Meses                                   */
      /* ------------------------------------------------------------------ */
      function ProjectionChart({ data, onNavigateToMonth }) {
        const [selectedIdx, setSelectedIdx] = useState(0);
        const maxTotal = Math.max(...data.map((d) => d.total), 100);
        const currentTotal = data[0]?.total ?? 0;
        const lastMonth = data[data.length - 1];
        const maxRelief = Math.max(...data.map((d) => d.freedComparedToCurrent), 0);
        const firstRelief = data.find((d) => d.freedComparedToCurrent > 0);
        const active = data[selectedIdx] || data[0];

        const svgW = 760;
        const svgH = 240;
        const padL = 62;
        const padR = 20;
        const padT = 24;
        const padB = 36;
        const chartW = svgW - padL - padR;
        const chartH = svgH - padT - padB;
        const slotW = chartW / Math.max(data.length, 1);
        const barW = Math.min(36, slotW * 0.62);
        const ticks = [0, 0.25, 0.5, 0.75, 1];

        const diffFromCurrent = (active?.total || 0) - currentTotal;

        return (
          <div className="rounded-2xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-[#18181B] p-4 sm:p-6 shadow-sm space-y-5">

                <h3 className="text-base sm:text-lg font-bold flex items-center gap-2">
                  <span className="w-8 h-8 rounded-xl bg-sky-500/10 text-sky-600 dark:text-sky-400 flex items-center justify-center">
                    <Icons.Calendar className="w-4 h-4" />
                  </span>
                  <span>Projeção de Comprometimento & Quitação — Próximos 12 Meses</span>
                </h3>
                <p className="text-xs sm:text-sm text-slate-500 dark:text-zinc-400 mt-1">

              </div>
              <div className="flex flex-wrap items-center gap-3 text-xs text-slate-600 dark:text-zinc-300 font-medium">
                <span className="inline-flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm bg-sky-500" />Fixos</span>
                <span className="inline-flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm bg-rose-500" />Parcelados</span>
                <span className="inline-flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm bg-violet-500" />Pontuais / Futuros</span>
                <span className="inline-flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm bg-amber-500" />Atrasos</span>
              </div>
            </div>

            {/* 3 Cards de Métricas em Destaque */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              {/* Card 1: Mês Selecionado */}
              <div className="rounded-xl border border-slate-200/80 dark:border-zinc-800 bg-slate-50/80 dark:bg-zinc-900/60 p-3.5 space-y-1">
                <div className="flex items-center justify-between">
                  <p className="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-zinc-400">
                    Mês em Foco ({active?.label})
                  </p>
                  <span className="text-[10px] px-2 py-0.5 rounded-full font-bold bg-slate-200/80 dark:bg-zinc-800 text-slate-700 dark:text-zinc-300">
                    {active?.itemsInMonth?.length || 0} contas
                  </span>
                </div>
                <p className="text-xl font-bold tabular-nums text-slate-900 dark:text-zinc-100">{formatBRL(active?.total || 0)}</p>
                <p className="text-[11px] text-slate-500 dark:text-zinc-400 tabular-nums">
                  Fixos {formatBRL(active?.fixedTotal || 0)} • Parc. {formatBRL(active?.installmentTotal || 0)} • Pontuais {formatBRL(active?.sporadicTotal || 0)}
                  {active?.overdueTotal > 0 ? ` • ⚠️ Atrasos ${formatBRL(active.overdueTotal)}` : ''}
                </p>
              </div>

              {/* Card 2: Alívio / Impacto */}
              <div className={`rounded-xl border p-3.5 space-y-1 ${
                diffFromCurrent < 0
                  ? 'border-emerald-200/80 dark:border-emerald-900/40 bg-emerald-50/70 dark:bg-emerald-950/20'
                  : diffFromCurrent > 0
                  ? 'border-amber-200/80 dark:border-amber-900/40 bg-amber-50/70 dark:bg-amber-950/20'
                  : 'border-slate-200/80 dark:border-zinc-800 bg-slate-50/80 dark:bg-zinc-900/60'
              }`}>
                <p className={`text-[11px] font-bold uppercase tracking-wider flex items-center gap-1 ${
                  diffFromCurrent < 0 ? 'text-emerald-700 dark:text-emerald-400' : diffFromCurrent > 0 ? 'text-amber-700 dark:text-amber-400' : 'text-slate-500'

                  <Icons.TrendingDown className="w-3.5 h-3.5" />

            {/* Gráfico SVG com Colunas */}
            <div className="w-full overflow-x-auto pb-1">
              <div className="min-w-[560px]">
                <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full h-auto select-none">

                    const y = padT + chartH * (1 - r);
                    const val = maxTotal * r;
                    return (
                      <g key={r}>
                        <line x1={padL} y1={y} x2={svgW - padR} y2={y} className="stroke-slate-200 dark:stroke-zinc-800" strokeDasharray={r === 0 ? undefined : '4 4'} />
                        <text x={padL - 8} y={y + 4} textAnchor="end" className="fill-slate-400 dark:fill-zinc-500 text-[10px] tabular-nums">

                      </g>

                  {data.map((pt, idx) => {
                    const cx = padL + slotW * idx + slotW / 2;
                    const x = cx - barW / 2;
                    const fH = (pt.fixedTotal / maxTotal) * chartH;
                    const iH = (pt.installmentTotal / maxTotal) * chartH;
                    const sH = (pt.sporadicTotal / maxTotal) * chartH;
                    const oH = ((pt.overdueTotal || 0) / maxTotal) * chartH;

                    const baseY = padT + chartH;
                    const fY = baseY - fH;
                    const iY = fY - iH;
                    const sY = iY - sH;
                    const oY = sY - oH;
                    const topY = Math.min(fY, iY, sY, oY);

                    const isSel = idx === selectedIdx;

                    return (
                      <g key={pt.shortLabel} className="cursor-pointer" onMouseEnter={() => setSelectedIdx(idx)} onClick={() => setSelectedIdx(idx)}>
                        {/* Indicador de coluna ativa */}
                        <rect
                          x={x - 4}
                          y={padT - 6}
                          width={barW + 8}
                          height={chartH + 12}
                          rx={10}
                          className={isSel ? 'fill-slate-100 dark:fill-zinc-800/80' : 'fill-transparent hover:fill-slate-50/50 dark:hover:fill-zinc-900/50'}
                        />

                        {/* Linha/Marcador zero se o mês não tiver gastos */}
                        {pt.total === 0 && (
                          <circle cx={cx} cy={baseY} r={3} className={isSel ? 'fill-slate-400 dark:fill-zinc-400' : 'fill-slate-300 dark:fill-zinc-700'} />
                        )}

                        {/* Barras Empilhadas */}
                        {fH > 0 && <rect x={x} y={fY} width={barW} height={fH} rx={iH === 0 && sH === 0 && oH === 0 ? 4 : 0} className="fill-sky-500" opacity={isSel ? 1 : 0.85} />}
                        {iH > 0 && <rect x={x} y={iY} width={barW} height={iH} rx={sH === 0 && oH === 0 ? 4 : 0} className="fill-rose-500" opacity={isSel ? 1 : 0.85} />}
                        {sH > 0 && <rect x={x} y={sY} width={barW} height={sH} rx={oH === 0 ? 4 : 0} className="fill-violet-500" opacity={isSel ? 1 : 0.85} />}
                        {oH > 0 && <rect x={x} y={oY} width={barW} height={oH} rx={4} className="fill-amber-500" opacity={isSel ? 1 : 0.85} />}

                        {/* Valor acima da barra */}
                        {(isSel || pt.total > 0) && (
                          <text
                            x={cx}
                            y={pt.total > 0 ? Math.max(14, topY - 6) : baseY - 8}
                            textAnchor="middle"
                            className={`${isSel ? 'fill-slate-900 dark:fill-zinc-100 font-bold text-[10px]' : 'fill-slate-500 dark:fill-zinc-400 text-[9px]'} tabular-nums`}
                          >
                            {pt.total > 0
                              ? pt.total >= 1000 ? `R$${(pt.total / 1000).toFixed(1).replace('.', ',')}k` : `R$${Math.round(pt.total)}`
                              : isSel ? 'R$ 0' : ''}
                          </text>
                        )}

                        {/* Nome do Mês */}
                        <text
                          x={cx}
                          y={baseY + 18}
                          textAnchor="middle"
                          className={isSel ? 'fill-slate-900 dark:fill-zinc-100 text-[11px] font-bold' : 'fill-slate-500 dark:fill-zinc-400 text-[10px]'}
                        >
                          {pt.shortLabel}
                        </text>
                      </g>
                    );
                  })}
                </svg>
              </div>
            </div>

            {/* Painel Interativo de Visão Futura: Lançamentos Detalhados do Mês Selecionado */}
            <div className="pt-4 border-t border-[#E2E8F0] dark:border-[#27272A] space-y-3">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div>
                  <h4 className="text-xs sm:text-sm font-bold flex items-center gap-2 text-slate-800 dark:text-zinc-100">
                    <Icons.Receipt className="w-4 h-4 text-sky-500" />
                    <span>Lançamentos Previstos para {active?.label}</span>
                    <span className="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-zinc-300">
                      {active?.itemsInMonth?.length || 0} conta(s) • Total: {formatBRL(active?.total || 0)}
                    </span>
                  </h4>
                  <p className="text-[11px] text-slate-500 dark:text-zinc-400 mt-0.5">
                    Passe o mouse ou clique nas barras acima para navegar e inspecionar os gastos de cada mês futuro.
                  </p>
                </div>

                {onNavigateToMonth && active?.monthOffset !== undefined && (
                  <button
                    type="button"
                    onClick={() => onNavigateToMonth(active.monthOffset)}
                    className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-sky-500/10 hover:bg-sky-500/20 text-sky-700 dark:text-sky-300 text-xs font-bold transition-all shrink-0 border border-sky-500/30"
                  >
                    <span>Abrir {active?.shortLabel} no sistema</span>
                    <Icons.ArrowUpRight className="w-3.5 h-3.5" />

                )}
              </div>

              {active?.itemsInMonth && active.itemsInMonth.length > 0 ? (
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5 max-h-60 overflow-y-auto no-scrollbar pt-1">
                  {active.itemsInMonth.map((item, idx) => (
                    <div
                      key={`${item.id}-${idx}`}
                      className={`p-3 rounded-xl border flex items-center justify-between gap-2 text-xs transition-all ${
                        item.isOverdue
                          ? 'border-amber-500/30 bg-amber-500/5 dark:bg-amber-950/20'
                          : 'border-[#E2E8F0] dark:border-[#27272A] bg-slate-50/70 dark:bg-zinc-900/60'
                      }`}
                    >
                      <div className="min-w-0">
                        <p className="font-bold truncate text-slate-800 dark:text-zinc-100">{item.description}</p>
                        <div className="flex flex-wrap items-center gap-1.5 text-[10px] mt-0.5 text-slate-500 dark:text-zinc-400">
                          <span>💳 {item.paymentMethod}</span>
                          <span>•</span>
                          <span className={`font-semibold ${item.isOverdue ? 'text-amber-600 dark:text-amber-400' : 'text-sky-600 dark:text-sky-400'}`}>
                            {item.typeLabel}

                        </div>
                      </div>
                      <div className="text-right shrink-0">
                        <span className="font-bold tabular-nums text-slate-900 dark:text-zinc-100 block">

      function ModalShell({ isOpen, onClose, title, subtitle, maxWidth = 'max-w-lg', children }) {
        const dialogRef = useRef(null);
        useEffect(() => {
          if (!isOpen) return undefined;
          const previouslyFocused = document.activeElement;
          const node = dialogRef.current;
          if (node && !node.contains(document.activeElement)) node.focus();
          const onKey = (ev) => {
            if (ev.key === 'Escape' && onClose) onClose();
          };
          document.addEventListener('keydown', onKey);
          return () => {
            document.removeEventListener('keydown', onKey);
            if (previouslyFocused && previouslyFocused.focus) previouslyFocused.focus();
          };
        }, [isOpen]);
        if (!isOpen) return null;
        return (
          <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-950/60 backdrop-blur-sm" onClick={onClose}>
            <div ref={dialogRef} role="dialog" aria-modal="true" aria-label={typeof title === 'string' ? title : 'Janela'} tabIndex={-1} className={`w-full ${maxWidth} rounded-t-2xl sm:rounded-2xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-[#18181B] shadow-2xl max-h-[92vh] flex flex-col overflow-hidden outline-none`} onClick={(e) => e.stopPropagation()}>
              <div className="flex items-start justify-between gap-3 px-5 py-4 border-b border-[#E2E8F0] dark:border-[#27272A]">
                <div>
                  <h2 className="text-base sm:text-lg font-semibold">{title}</h2>
                  {subtitle && <p className="text-xs text-slate-500 dark:text-zinc-400 mt-0.5">{subtitle}</p>}
                </div>
                <button type="button" onClick={onClose} aria-label="Fechar" className="p-2 rounded-xl text-slate-400 hover:bg-slate-100 dark:hover:bg-zinc-800">
                  <Icons.X className="w-5 h-5" />
                </button>
              </div>
              <div className="p-5 overflow-y-auto">{children}</div>
            </div>
          </div>
        );
      }

          setCardLinkedAccountId('');
          setCardColor('sky');
          setCardIsSettled(false);
          setCardFormError('');
        };

        const startEditAccount = (acc) => {
          setActiveTab('accounts');
          setEditingAccId(acc.id);
          setAccName(acc.name);
          setAccType(acc.type || 'corrente');
          setAccInitialBalance(acc.initialBalance ? String(acc.initialBalance) : '');
          setAccColor(acc.color || 'slate');
          setAccFormError('');
          setDeletingAcc(null);
        };

        const startEditCard = (c) => {
          setActiveTab('cards');
          setEditingCardId(c.id);
          setCardName(c.name);
          setCardLimit(c.limit ? String(c.limit) : '');
          setCardClosingDay(c.closingDay ? String(c.closingDay) : '');
          setCardDueDay(c.dueDay ? String(c.dueDay) : '');
          setCardLinkedAccountId(c.linkedAccountId || '');
          setCardColor(c.color || 'slate');
          setCardIsSettled(Boolean(c.isSettled));
          setCardFormError('');
          setDeletingCard(null);
        };

        const handleSaveAccount = (e) => {
          e.preventDefault();
          const trimmed = accName.trim();
          if (!trimmed) {
            setAccFormError('Digite um nome para a conta.');
            return;
          }
          const duplicate = (accounts || []).find(
            (a) => a.name.toLowerCase() === trimmed.toLowerCase() && a.id !== editingAccId
          );
          if (duplicate) {
            setAccFormError('Já existe uma conta bancária com esse nome.');
            return;
          }
          const payload = {
            name: trimmed,
            type: accType,
            initialBalance: Math.max(0, parseMoneyInput(accInitialBalance) || 0),
            color: accColor,
          };
          if (editingAccId) {
            if (onUpdateAccount) onUpdateAccount(editingAccId, payload);
          } else {
            if (onCreateAccount) onCreateAccount(payload);
          }
          resetAccountForm();
        };

        const handleSaveCard = (e) => {
          e.preventDefault();
          const trimmed = cardName.trim();
          if (!trimmed) {
            setCardFormError('Digite um nome para o cartão.');
            return;
          }
          const duplicate = (cards || []).find(
            (c) => c.name.toLowerCase() === trimmed.toLowerCase() && c.id !== editingCardId
          );
          if (duplicate) {
            setCardFormError('Já existe um cartão de crédito com esse nome.');
            return;
          }
          const parsedDue = cardDueDay ? Math.min(31, Math.max(1, parseInt(cardDueDay, 10) || 10)) : 10;
          const parsedClose = cardClosingDay ? Math.min(31, Math.max(1, parseInt(cardClosingDay, 10) || 3)) : 3;
          const payload = {
            name: trimmed,
            limit: Math.max(0, parseMoneyInput(cardLimit) || 0),
            closingDay: parsedClose,
            dueDay: parsedDue,
            linkedAccountId: cardLinkedAccountId || null,
            color: cardColor,
            isSettled: cardIsSettled,
          };
          if (editingCardId) {
            if (onUpdateCard) onUpdateCard(editingCardId, payload);
          } else {
            if (onCreateCard) onCreateCard(payload);
          }
          resetCardForm();
        };

        const requestDeleteAccount = (acc) => {
          if (accounts.length <= 1) {
            setAccFormError('Você precisa manter pelo menos 1 conta cadastrada.');
            return;
          }
          const linkedCount = expenses.filter((e) => e.accountId === acc.id || e.paidAccountId === acc.id || e.paymentMethod === acc.name).length;
          const linkedCardsCount = cards.filter((c) => c.linkedAccountId === acc.id).length;
          const fallback = accounts.find((x) => x.id !== acc.id);
          setDeletingAcc({ ...acc, linkedCount, linkedCardsCount });
          setMigrateAccToId(fallback ? fallback.id : '');
          setAccFormError('');
        };

        const confirmDeleteAccount = () => {
          if (!deletingAcc) return;
          if (onDeleteAccount) onDeleteAccount(deletingAcc.id, migrateAccToId || null);
          if (editingAccId === deletingAcc.id) resetAccountForm();
          setDeletingAcc(null);
        };

        const requestDeleteCard = (c) => {
          if (cards.length <= 1) {
            setCardFormError('Você precisa manter pelo menos 1 cartão cadastrado.');
            return;
          }
          const linkedCount = expenses.filter((e) => e.cardId === c.id || e.paymentMethod === c.name).length;
          const fallback = cards.find((x) => x.id !== c.id);
          setDeletingCard({ ...c, linkedCount });
          setMigrateCardToId(fallback ? fallback.id : '');
          setCardFormError('');
        };

        const confirmDeleteCard = () => {
          if (!deletingCard) return;
          if (onDeleteCard) onDeleteCard(deletingCard.id, migrateCardToId || null);
          if (editingCardId === deletingCard.id) resetCardForm();
          setDeletingCard(null);
        };

        return (
          <ModalShell
            isOpen={isOpen}
            onClose={onClose}
            title="Gerenciar Contas e Cartões de Crédito"
            subtitle="Estrutura financeira separada: organize suas contas reais de saldo e seus instrumentos de crédito."
            maxWidth="max-w-2xl"
          >
            <div className="space-y-5">
              {/* Top Navigation Tabs */}
              <div className="flex border-b border-[#E2E8F0] dark:border-[#27272A] gap-2">
                <button
                  type="button"
                  onClick={() => setActiveTab('accounts')}
                  className={`pb-3 px-3 text-xs sm:text-sm font-bold flex items-center gap-2 border-b-2 transition-all ${
                    activeTab === 'accounts'
                      ? 'border-emerald-600 text-emerald-700 dark:text-emerald-400'
                      : 'border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-zinc-300'
                  }`}
                >
                  <span className="text-base">🏦</span>
                  <span>Contas Bancárias & Carteiras ({accounts.length})</span>
                </button>
                <button
                  type="button"
                  onClick={() => setActiveTab('cards')}
                  className={`pb-3 px-3 text-xs sm:text-sm font-bold flex items-center gap-2 border-b-2 transition-all ${
                    activeTab === 'cards'
                      ? 'border-violet-600 text-violet-700 dark:text-violet-400'
                      : 'border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-zinc-300'
                  }`}
                >
                  <span className="text-base">💳</span>
                  <span>Cartões de Crédito ({cards.length})</span>
                </button>
              </div>

              {/* TAB 1: CONTAS BANCÁRIAS E CARTEIRAS */}
              {activeTab === 'accounts' && (
                <div className="space-y-4 animate-fadeIn">
                  <form
                    onSubmit={handleSaveAccount}
                    className="rounded-2xl border border-emerald-500/20 bg-emerald-500/5 dark:bg-emerald-950/10 p-4 sm:p-5 space-y-4 shadow-xs"
                  >
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold uppercase tracking-wider text-emerald-800 dark:text-emerald-300 flex items-center gap-2">
                        <span className="w-2 h-2 rounded-full bg-emerald-500" />
                        {editingAccId ? 'Editando Conta Bancária / Carteira' : 'Cadastrar Nova Conta'}
                      </span>
                      {editingAccId && (
                        <button
                          type="button"
                          onClick={resetAccountForm}
                          className="text-xs font-semibold text-rose-600 dark:text-rose-400 hover:underline"
                        >
                          Cancelar edição
                        </button>
                      )}
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 items-start">
                      <div>
                        <label className="block text-xs font-semibold mb-1 text-slate-700 dark:text-zinc-300">
                          Nome da Conta ou Carteira
                        </label>
                        <input
                          type="text"
                          required
                          value={accName}
                          onChange={(e) => {
                            setAccName(e.target.value);
                            if (accFormError) setAccFormError('');
                          }}
                          placeholder="Ex.: Mercado Pago, Nubank, Itaú, Carteira Física..."
                          className="w-full rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-zinc-950 px-3.5 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500/20"
                        />
                        <p className="text-[11px] text-slate-400 mt-1">
                          Pode ter o mesmo nome de um cartão (ex: Mercado Pago).
                        </p>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold mb-1 text-slate-700 dark:text-zinc-300">
                          Tipo de Conta
                        </label>
                        <select
                          value={accType}
                          onChange={(e) => setAccType(e.target.value)}
                          className="w-full rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-zinc-950 px-3.5 py-2.5 text-sm font-medium"
                        >
                          <option value="corrente">Conta Corrente / Pagamento</option>
                          <option value="carteira">Carteira Física (Dinheiro em Espécie)</option>
                          <option value="poupanca">Conta Poupança</option>
                          <option value="investimento">Conta Investimento</option>
                          <option value="outros">Outro Tipo</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 items-start">
                      <div>
                        <label className="block text-xs font-semibold mb-1 text-slate-700 dark:text-zinc-300">
                          Saldo Inicial / Atual (R$)
                        </label>
                        <input
                          type="number"
                          step="0.01"
                          min="0"
                          inputMode="decimal"
                          value={accInitialBalance}
                          onChange={(e) => setAccInitialBalance(e.target.value)}
                          placeholder="0,00"
                          className="w-full rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-zinc-950 px-3.5 py-2.5 text-sm font-bold tabular-nums"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold mb-1.5 text-slate-700 dark:text-zinc-300">
                          Cor de Identificação
                        </label>
                        <div className="flex flex-wrap gap-2">
                          {COLOR_OPTIONS.map((c) => {
                            const cls = getPaymentColorClasses(c.key);
                            const active = accColor === c.key;
                            return (
                              <button
                                key={c.key}
                                type="button"
                                title={c.label}
                                onClick={() => setAccColor(c.key)}
                                className={`w-7 h-7 rounded-full flex items-center justify-center transition-transform ${cls.dot} ${
                                  active ? 'ring-2 ring-offset-2 ring-slate-900 dark:ring-white scale-110' : 'opacity-70 hover:opacity-100'
                                }`}
                              >
                                {active && <Icons.Check className="w-3.5 h-3.5 text-white" />}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </div>

                    {accFormError && (
                      <p className="text-xs font-semibold text-rose-600 dark:text-rose-400">{accFormError}</p>
                    )}

                    <div className="flex justify-end pt-1">
                      <button
                        type="submit"
                        className="rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 text-xs sm:text-sm font-semibold shadow-sm flex items-center gap-1.5"
                      >
                        <Icons.Check className="w-4 h-4" />
                        {editingAccId ? 'Salvar Conta' : '+ Cadastrar Conta'}
                      </button>
                    </div>
                  </form>

                  {/* Deletar Conta Modal / Aviso */}
                  {deletingAcc && (
                    <div className="rounded-2xl border border-rose-500/30 bg-rose-500/5 p-4 space-y-3">
                      <div className="flex items-start gap-2.5">
                        <Icons.Alert className="w-5 h-5 text-rose-600 shrink-0 mt-0.5" />
                        <div className="space-y-1 text-xs">
                          <p className="font-bold text-rose-700 dark:text-rose-300 text-sm">
                            Excluir conta "{deletingAcc.name}"?
                          </p>
                          {deletingAcc.linkedCount > 0 ? (
                            <p className="text-slate-600 dark:text-zinc-300">
                              Existem <strong>{deletingAcc.linkedCount} lançamento(s)</strong> vinculados a esta conta. Escolha para onde transferi-los:
                            </p>
                          ) : (
                            <p className="text-slate-600 dark:text-zinc-300">
                              Nenhum lançamento está vinculado a esta conta no momento.
                            </p>
                          )}
                        </div>
                      </div>

                      {deletingAcc.linkedCount > 0 && (
                        <div>
                          <label className="block text-xs font-medium mb-1">Mover lançamentos para:</label>
                          <select
                            value={migrateAccToId}
                            onChange={(e) => setMigrateAccToId(e.target.value)}
                            className="w-full rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-zinc-900 px-3 py-2 text-sm"
                          >
                            {accounts
                              .filter((x) => x.id !== deletingAcc.id)
                              .map((x) => (
                                <option key={x.id} value={x.id}>
                                  {x.name} ({x.type})
                                </option>
                              ))}
                          </select>
                        </div>
                      )}

                      <div className="flex justify-end gap-2">
                        <button
                          type="button"
                          onClick={() => setDeletingAcc(null)}
                          className="rounded-xl border border-[#E2E8F0] dark:border-[#27272A] px-3.5 py-2 text-xs font-medium"
                        >
                          Cancelar
                        </button>
                        <button
                          type="button"
                          onClick={confirmDeleteAccount}
                          className="rounded-xl bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 text-xs font-semibold"
                        >
                          Confirmar Exclusão
                        </button>
                      </div>
                    </div>
                  )}

                  {/* Lista de Contas */}
                  <div className="space-y-2">
                    <span className="text-xs font-bold uppercase tracking-wider text-slate-500">
                      Contas e Carteiras Cadastradas ({accounts.length})
                    </span>
                    <div className="divide-y divide-[#E2E8F0] dark:divide-[#27272A] rounded-2xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-zinc-950 overflow-hidden shadow-xs">
                      {accounts.map((acc) => {
                        const cls = getPaymentColorClasses(acc.color);
                        const linkedCards = cards.filter((c) => c.linkedAccountId === acc.id);
                        const isBeingEdited = editingAccId === acc.id;
                        return (
                          <div
                            key={acc.id}
                            className={`flex items-center justify-between gap-3 px-4 py-3.5 transition-colors ${
                              isBeingEdited ? 'bg-emerald-500/10' : 'hover:bg-slate-50 dark:hover:bg-zinc-900/40'
                            }`}
                          >
                            <div className="flex items-center gap-3 min-w-0">
                              <span className={`w-3.5 h-3.5 rounded-full shrink-0 ${cls.dot}`} />
                              <div className="min-w-0">
                                <div className="flex flex-wrap items-center gap-2">
                                  <p className="text-sm font-bold text-slate-900 dark:text-zinc-100 truncate">
                                    {acc.name}
                                  </p>
                                  <span className="text-[10px] px-2 py-0.5 rounded-md font-semibold bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-zinc-400">
                                    {acc.type === 'carteira' ? '💵 Carteira Física' : '🏦 Conta Bancária'}
                                  </span>
                                  {acc.initialBalance > 0 && (
                                    <span className="text-[11px] font-semibold text-emerald-600 dark:text-emerald-400 tabular-nums">
                                      Saldo: {formatBRL(acc.initialBalance)}
                                    </span>
                                  )}
                                </div>
                                {linkedCards.length > 0 && (
                                  <p className="text-[11px] text-sky-600 dark:text-sky-400 mt-0.5">
                                    💳 Débito padrão de: {linkedCards.map((c) => c.name).join(', ')}
                                  </p>
                                )}
                              </div>
                            </div>

                            <div className="flex items-center gap-1 shrink-0">
                              <button
                                type="button"
                                onClick={() => startEditAccount(acc)}
                                title="Editar"
                                className="p-2 rounded-lg text-slate-500 hover:text-sky-600 hover:bg-slate-100 dark:hover:bg-zinc-800"
                              >
                                <Icons.Edit className="w-4 h-4" />
                              </button>
                              <button
                                type="button"
                                onClick={() => requestDeleteAccount(acc)}
                                title="Excluir"
                                className="p-2 rounded-lg text-slate-500 hover:text-rose-600 hover:bg-slate-100 dark:hover:bg-zinc-800"
                              >
                                <Icons.Trash className="w-4 h-4" />
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 2: CARTÕES DE CRÉDITO */}
              {activeTab === 'cards' && (
                <div className="space-y-4 animate-fadeIn">
                  <form
                    onSubmit={handleSaveCard}
                    className="rounded-2xl border border-violet-500/20 bg-violet-500/5 dark:bg-violet-950/10 p-4 sm:p-5 space-y-4 shadow-xs"
                  >
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold uppercase tracking-wider text-violet-800 dark:text-violet-300 flex items-center gap-2">
                        <span className="w-2 h-2 rounded-full bg-violet-500" />
                        {editingCardId ? 'Editando Cartão de Crédito' : 'Cadastrar Novo Cartão'}
                      </span>
                      {editingCardId && (
                        <button
                          type="button"
                          onClick={resetCardForm}
                          className="text-xs font-semibold text-rose-600 dark:text-rose-400 hover:underline"
                        >
                          Cancelar edição
                        </button>
                      )}
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 items-start">
                      <div>
                        <label className="block text-xs font-semibold mb-1 text-slate-700 dark:text-zinc-300">
                          Nome do Cartão de Crédito
                        </label>
                        <input
                          type="text"
                          required
                          value={cardName}
                          onChange={(e) => {
                            setCardName(e.target.value);
                            if (cardFormError) setCardFormError('');
                          }}
                          placeholder="Ex.: Mercado Pago, Nubank Ultravioleta, Inter..."
                          className="w-full rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-zinc-950 px-3.5 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-violet-500/20"
                        />
                        <p className="text-[11px] text-slate-400 mt-1">
                          Pode ter o mesmo nome de uma conta (ex: Mercado Pago).
                        </p>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold mb-1 text-slate-700 dark:text-zinc-300">
                          Limite Total de Crédito (R$)
                        </label>
                        <input
                          type="number"
                          min="0"
                          step="0.01"
                          inputMode="decimal"
                          value={cardLimit}
                          onChange={(e) => setCardLimit(e.target.value)}
                          placeholder="Ex.: 3000"
                          className="w-full rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-zinc-950 px-3.5 py-2.5 text-sm font-bold tabular-nums"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div>
                        <label className="block text-xs font-semibold mb-1">Dia de Fechamento</label>
                        <input
                          type="number"
                          min="1"
                          max="31"
                          inputMode="numeric"
                          value={cardClosingDay}
                          onChange={(e) => setCardClosingDay(e.target.value)}
                          placeholder="Ex.: 3"
                          className="w-full rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-zinc-950 px-3 py-2 text-sm tabular-nums"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold mb-1">Dia de Vencimento</label>
                        <input
                          type="number"
                          min="1"
                          max="31"
                          inputMode="numeric"
                          value={cardDueDay}
                          onChange={(e) => setCardDueDay(e.target.value)}
                          placeholder="Ex.: 10"
                          className="w-full rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-zinc-950 px-3 py-2 text-sm tabular-nums"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold mb-1.5 text-slate-700 dark:text-zinc-300">
                          Cor do Cartão
                        </label>
                        <div className="flex flex-wrap gap-2">
                          {COLOR_OPTIONS.map((c) => {
                            const cls = getPaymentColorClasses(c.key);
                            const active = cardColor === c.key;
                            return (
                              <button
                                key={c.key}
                                type="button"
                                title={c.label}
                                onClick={() => setCardColor(c.key)}
                                className={`w-7 h-7 rounded-full flex items-center justify-center transition-transform ${cls.dot} ${
                                  active ? 'ring-2 ring-offset-2 ring-slate-900 dark:ring-white scale-110' : 'opacity-70 hover:opacity-100'
                                }`}
                              >
                                {active && <Icons.Check className="w-3.5 h-3.5 text-white" />}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </div>

                    <div className="space-y-1 pt-1 border-t border-violet-500/15">
                      <label className="block text-xs font-bold text-slate-800 dark:text-zinc-200 flex items-center justify-between">
                        <span className="flex items-center gap-1.5">
                          <span>🏦</span> Conta Bancária Vinculada Padrão (Débito da Fatura)
                        </span>
                        <span className="text-[10px] text-violet-600 dark:text-violet-400 font-semibold">
                          Sugerida ao pagar a fatura
                        </span>
                      </label>
                      <select
                        value={cardLinkedAccountId}
                        onChange={(e) => setCardLinkedAccountId(e.target.value)}
                        className="w-full rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-zinc-950 px-3.5 py-2.5 text-sm font-semibold"
                      >
                        <option value="">Nenhuma / Escolher na hora de pagar fatura</option>
                        {accounts.map((acc) => (
                          <option key={acc.id} value={acc.id}>
                            🏦 {acc.name} ({acc.type})
                          </option>
                        ))}
                      </select>
                      <p className="text-[11px] text-slate-500 dark:text-zinc-400">
                        O vínculo é feito pelo ID da conta bancária. Renomear a conta nunca quebrará o vínculo!
                      </p>
                    </div>

                    {editingCardId && (
                      <label className="flex items-center gap-2 pt-1 cursor-pointer select-none text-xs font-medium">
                        <input
                          type="checkbox"
                          checked={cardIsSettled}
                          onChange={(e) => setCardIsSettled(e.target.checked)}
