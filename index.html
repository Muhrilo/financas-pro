                      {batchDelTarget.items.slice(0, 10).map((it) => (
                        <div key={it.id} className="flex justify-between py-0.5">
                          <span className="truncate pr-2">{it.description}</span>
                          <span className="font-semibold tabular-nums shrink-0">{formatBRL(it.amount)}</span>
                        </div>
                      ))}
                      {batchDelTarget.items.length > 10 && (
                        <p className="text-[10px] text-slate-400 italic pt-1">
                          + {batchDelTarget.items.length - 10} outros itens selecionados...
                        </p>
                      )}
                    </div>
                  </div>

                  <div className="space-y-2">
                    <button
                      type="button"
                      onClick={() => applyBatchDelete(batchDelTarget.items, 'one')}
                      className="w-full text-left rounded-xl border border-[#E2E8F0] dark:border-[#27272A] p-3.5 hover:border-sky-500 hover:bg-sky-50/20 dark:hover:bg-sky-950/20 transition-all group"
                    >
                      <div className="flex items-center gap-2">
                        <span className="text-base">📅</span>
                        <strong className="block text-slate-900 dark:text-zinc-100 group-hover:text-sky-600">
                          Só neste mês ({formatMonthYear(state.currentMonthIndex, state.currentYear)})
                        </strong>
                      </div>
                      <p className="text-xs text-slate-500 dark:text-zinc-400 mt-1 pl-6">
                        Remove as {batchDelTarget.items.length} despesas apenas neste mês. Nos meses anteriores e seguintes elas continuarão ativas.
                      </p>
                    </button>

                    <button
                      type="button"
                      onClick={() => applyBatchDelete(batchDelTarget.items, 'from')}
                      className="w-full text-left rounded-xl border border-amber-500/30 bg-amber-500/5 p-3.5 hover:border-amber-500 hover:bg-amber-500/10 transition-all group"
                    >
                      <div className="flex items-center gap-2">
                        <span className="text-base">⏩</span>
                        <strong className="block text-amber-700 dark:text-amber-300">
                          Neste mês e em todos os seguintes
                        </strong>
                      </div>
                      <p className="text-xs text-slate-500 dark:text-zinc-400 mt-1 pl-6">
                        Encerra todas as despesas selecionadas a partir deste mês. O histórico passado permanece gravado.
                      </p>
                    </button>

                    <button
                      type="button"
                      onClick={() => applyBatchDelete(batchDelTarget.items, 'all')}
                      className="w-full text-left rounded-xl border border-rose-500/40 bg-rose-500/5 p-3.5 hover:border-rose-500 hover:bg-rose-500/10 transition-all group"
                    >
                      <div className="flex items-center gap-2">
                        <span className="text-base">🗑️</span>
                        <strong className="block text-rose-700 dark:text-rose-300">
                          Em TODOS os meses (Passados, Presente e Futuros) — Definitivo
                        </strong>
                      </div>
                      <p className="text-xs text-slate-500 dark:text-zinc-400 mt-1 pl-6">
                        Exclusão permanente de todas as {batchDelTarget.items.length} despesas selecionadas de qualquer competência.
                      </p>
                    </button>
                  </div>

                  <div className="flex justify-end pt-1">
                    <button
                      type="button"
                      onClick={() => setBatchDelTarget(null)}
                      className="rounded-xl border border-[#E2E8F0] dark:border-[#27272A] px-4 py-2 text-xs font-semibold text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800"
                    >
                      Cancelar
                    </button>
                  </div>
                </div>
              )}
            </ModalShell>

            {/* MODAL 3: EXCLUSÃO DE TODOS OS LANÇAMENTOS DE UM CARTÃO OU CANAL */}
            <ModalShell
              isOpen={!!channelDelTarget}
              onClose={() => setChannelDelTarget(null)}
              title={channelDelTarget ? `Excluir Lançamentos: "${channelDelTarget.name}"` : 'Excluir do Cartão'}
              subtitle="Limpeza direcionada: escolha o escopo para remover os lançamentos deste cartão ou canal."
            >
              {channelDelTarget && (() => {
                const isCard = channelDelTarget.isCard !== false;
                const isMatch = (e) => isCard ? isExpenseForCard(e, channelDelTarget, rawState.cards || []) : isExpenseForAccount(e, channelDelTarget, rawState.accounts || []);
                const inMonthExpenses = (state.expenses || []).filter(isMatch);
                const inMonthTotal = inMonthExpenses.reduce((a, b) => a + (Number(b.amount) || 0), 0);
                const allExpenses = (rawState.expenses || []).filter(isMatch);
                const allTotal = allExpenses.reduce((a, b) => a + (Number(b.amount) || 0), 0);

                return (
                  <div className="space-y-3.5 text-sm">
                    <div className="rounded-xl border border-slate-200 dark:border-zinc-700 bg-slate-50 dark:bg-zinc-900/60 p-3.5 space-y-2">
                      <div className="flex items-center gap-2">
                        <span className="text-lg">{isCard ? '💳' : '🏦'}</span>
                        <div>
                          <strong className="block text-sm sm:text-base text-slate-900 dark:text-zinc-100">{channelDelTarget.name}</strong>
                          <span className="text-xs text-slate-500">{isCard ? 'Cartão de Crédito' : 'Conta Bancária / Meio'}</span>
                        </div>
                      </div>
                      <div className="grid grid-cols-2 gap-2 pt-2 border-t border-slate-200 dark:border-zinc-700/60 text-xs">
                        <div className="bg-white dark:bg-zinc-900 p-2.5 rounded-lg border border-slate-100 dark:border-zinc-800">
                          <span className="text-[11px] text-slate-500 block">Fatura deste Mês ({formatMonthYear(state.currentMonthIndex, state.currentYear)})</span>
                          <strong className="text-sm font-bold text-slate-800 dark:text-zinc-200 tabular-nums">{inMonthExpenses.length} itens</strong>
                          <span className="text-xs text-slate-500 block font-semibold">{formatBRL(inMonthTotal)}</span>
                        </div>
                        <div className="bg-white dark:bg-zinc-900 p-2.5 rounded-lg border border-slate-100 dark:border-zinc-800">
                          <span className="text-[11px] text-slate-500 block">Cadastrados no Total</span>
                          <strong className="text-sm font-bold text-slate-800 dark:text-zinc-200 tabular-nums">{allExpenses.length} itens</strong>
                          <span className="text-xs text-slate-500 block font-semibold">{formatBRL(allTotal)}</span>
                        </div>
                      </div>
                    </div>

                    <div className="space-y-2">
                      <button
                        type="button"
                        onClick={() => applyChannelDelete(channelDelTarget, 'one')}
                        className="w-full text-left rounded-xl border border-[#E2E8F0] dark:border-[#27272A] p-3.5 hover:border-sky-500 hover:bg-sky-50/20 dark:hover:bg-sky-950/20 transition-all group"
                      >
                        <div className="flex items-center gap-2">
                          <span className="text-base">📅</span>
                          <strong className="block text-slate-900 dark:text-zinc-100 group-hover:text-sky-600">
                            Só neste mês ({formatMonthYear(state.currentMonthIndex, state.currentYear)}) — Limpar Fatura Atual
                          </strong>
                        </div>
                        <p className="text-xs text-slate-500 dark:text-zinc-400 mt-1 pl-6">
                          Remove todos os {inMonthExpenses.length} lançamentos deste cartão na fatura deste mês. Os meses anteriores e os próximos continuam normais.
                        </p>
                      </button>

                      <button
                        type="button"
                        onClick={() => applyChannelDelete(channelDelTarget, 'from')}
                        className="w-full text-left rounded-xl border border-amber-500/30 bg-amber-500/5 p-3.5 hover:border-amber-500 hover:bg-amber-500/10 transition-all group"
                      >
                        <div className="flex items-center gap-2">
                          <span className="text-base">⏩</span>
                          <strong className="block text-amber-700 dark:text-amber-300">
                            Neste mês e em todos os seguintes
                          </strong>
                        </div>
                        <p className="text-xs text-slate-500 dark:text-zinc-400 mt-1 pl-6">
                          Encerra todos os lançamentos vinculados a este cartão a partir deste mês. O histórico passado permanece intacto.
                        </p>
                      </button>

                      <button
                        type="button"
                        onClick={() => applyChannelDelete(channelDelTarget, 'all')}
                        className="w-full text-left rounded-xl border border-rose-500/40 bg-rose-500/5 p-3.5 hover:border-rose-500 hover:bg-rose-500/10 transition-all group"
                      >
                        <div className="flex items-center gap-2">
                          <span className="text-base">🗑️</span>
                          <strong className="block text-rose-700 dark:text-rose-300">
                            Em TODOS os meses (Passados, Presente e Futuros) — Limpeza Completa
                          </strong>
                        </div>
                        <p className="text-xs text-slate-500 dark:text-zinc-400 mt-1 pl-6">
                          Exclui definitivamente todos os {allExpenses.length} lançamentos vinculados a este cartão em todo o histórico.
                        </p>
                      </button>
                    </div>

                    <div className="flex justify-end pt-1">
                      <button
                        type="button"
                        onClick={() => setChannelDelTarget(null)}
                        className="rounded-xl border border-[#E2E8F0] dark:border-[#27272A] px-4 py-2 text-xs font-semibold text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800"
                      >
                        Cancelar
                      </button>
                    </div>
                  </div>
                );
              })()}
            </ModalShell>

            <ModalShell isOpen={turnMonthOpen} onClose={() => setTurnMonthOpen(false)} title="Virar Mês — Automação de Ciclo">
              <div className="space-y-4 text-sm">
                <p className="text-slate-600 dark:text-zinc-300">
                  Resumo do que vai acontecer ao fechar <strong>{formatMonthYear(rawState.currentMonthIndex, rawState.currentYear)}</strong>:
                </p>
                <div className="rounded-xl bg-slate-50 dark:bg-zinc-900/70 border border-[#E2E8F0] dark:border-[#27272A] p-3.5 space-y-2 text-xs">
                  <div className="flex justify-between"><span>Gastos Fixos mantidos (voltam p/ Pendente):</span><strong>{turnMonthSummary.fixedCount}</strong></div>
                  <div className="flex justify-between"><span>Parcelas que avançam (+1):</span><strong>{turnMonthSummary.advancingCount}</strong></div>
                  <div className="flex justify-between text-emerald-600 dark:text-emerald-400"><span>Parcelas concluídas neste mês (serão encerradas):</span><strong>{turnMonthSummary.finishingCount}</strong></div>
                  <div className="flex justify-between"><span>Gastos Esporádicos limpos:</span><strong>{turnMonthSummary.sporadicCount}</strong></div>
                </div>

                {calendarDeltaMonths > 1 && (
                  <div className="rounded-xl bg-indigo-50 dark:bg-indigo-950/30 border border-indigo-200 dark:border-indigo-800/50 p-3.5 space-y-2.5">
                    <div className="flex items-center justify-between text-xs font-bold text-indigo-700 dark:text-indigo-300">
                      <span>Deseja pular direto para o mês atual ({formatMonthYear(new Date().getMonth(), new Date().getFullYear())})?</span>
                      <span className="px-2 py-0.5 rounded-full bg-indigo-100 dark:bg-indigo-900 text-indigo-800 dark:text-indigo-200 font-bold text-[11px]">+{calendarDeltaMonths} meses</span>
                    </div>
                    <p className="text-[11px] text-slate-600 dark:text-zinc-400 leading-relaxed">
                      Avança os {calendarDeltaMonths} meses decorridos em lote contínuo, acumulando as despesas fixas e parcelas pendentes como passivos vencidos identificados mês a mês.
                    </p>
                    <button
                      type="button"
                      onClick={() => {
                        setTurnMonthOpen(false);
                        handleBatchSyncToToday();
                      }}
                      className="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-sm transition-all"
                    >
                      <Icons.Check className="w-3.5 h-3.5" />
                      Avançar Todos os {calendarDeltaMonths} Meses em 1 Clique
                    </button>
                  </div>
                )}

                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setTurnMonthOpen(false)} className="rounded-xl border border-[#E2E8F0] dark:border-[#27272A] px-4 py-2">Cancelar</button>
                  <button type="button" onClick={handleTurnMonth} className="rounded-xl bg-emerald-600 text-white px-5 py-2 font-semibold">Confirmar Virada (1 Mês)</button>
                </div>
              </div>
            </ModalShell>

            <ModalShell isOpen={resetOpen} onClose={() => setResetOpen(false)} title="Restaurar Exemplos Iniciais">
              <div className="space-y-4 text-sm">
                <div className="flex items-start gap-2.5 rounded-xl bg-amber-500/10 border border-amber-500/20 p-3 text-amber-800 dark:text-amber-300">
                  <Icons.Alert className="w-5 h-5 shrink-0" />
                  <p>Isso substituirá seus dados atuais pelos exemplos iniciais de demonstração. Exporte um backup (.JSON) antes se quiser guardar suas informações.</p>
                </div>
                <div className="flex justify-end gap-2">
                  <button type="button" onClick={() => setResetOpen(false)} className="rounded-xl border border-[#E2E8F0] dark:border-[#27272A] px-4 py-2">Cancelar</button>
                  <button type="button" onClick={handleRestoreExamples} className="rounded-xl bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 font-semibold">Sim, restaurar</button>
                </div>
              </div>
            </ModalShell>

            <ModalShell isOpen={clearAllOpen} onClose={() => setClearAllOpen(false)} title="Zerar Tudo e Começar do Zero">
              <div className="space-y-4 text-sm">
                <div className="flex items-start gap-2.5 rounded-xl bg-rose-500/10 border border-rose-500/20 p-3 text-rose-700 dark:text-rose-300">
                  <Icons.Alert className="w-5 h-5 shrink-0 mt-0.5" />
                  <div className="space-y-1">
                    <p className="font-semibold">Atenção: esta ação limpa todos os lançamentos!</p>
                    <p className="text-xs leading-relaxed">
                      Todas as suas fontes de renda, gastos, parcelas, investimentos e o histórico serão apagados para você começar com tudo zerado (seus cartões e meios cadastrados continuarão disponíveis). Exporte um backup (.JSON) antes se quiser guardar o que tem agora.
                    </p>
                  </div>
                </div>
                <div className="flex justify-end gap-2">
                  <button type="button" onClick={() => setClearAllOpen(false)} className="rounded-xl border border-[#E2E8F0] dark:border-[#27272A] px-4 py-2">Cancelar</button>
                  <button type="button" onClick={handleClearAll} className="rounded-xl bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 font-semibold">Sim, zerar tudo</button>
                </div>
              </div>
            </ModalShell>

            <ModalShell isOpen={historyOpen} onClose={() => setHistoryOpen(false)} title="Histórico de Meses Encerrados">
              {rawState.history.length === 0 ? (
                <p className="text-sm text-slate-500 text-center py-6">Nenhum mês encerrado ainda.</p>
              ) : (
                <div className="space-y-2.5 max-h-80 overflow-y-auto">
                  {rawState.history.map((h) => (
                    <div key={h.id} className="rounded-xl border border-[#E2E8F0] dark:border-[#27272A] p-3 text-xs tabular-nums">
                      <div className="flex justify-between font-bold mb-1"><span>{h.referenceLabel}</span><span>{h.completedInstallmentsCount} parc. concluída(s)</span></div>
                      <div className="grid grid-cols-3 gap-2">
                        <div>Entradas: <strong className="text-emerald-600">{formatBRL(h.totalIncomes)}</strong></div>
                        <div>Saídas: <strong className="text-rose-600">{formatBRL(h.totalExpenses)}</strong></div>
                        <div>Saldo: <strong>{formatBRL(h.freeBalance)}</strong></div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </ModalShell>

            <ModalShell isOpen={shortcutsHelpOpen} onClose={() => setShortcutsHelpOpen(false)} title="Atalhos de Teclado">
              <div className="space-y-3 text-sm">
                <p className="text-xs text-slate-500 dark:text-zinc-400">Pressione qualquer tecla fora de campos de digitação para acionar instantaneamente:</p>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                  <div className="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800">
                    <span className="font-medium">Nova Despesa</span>
                    <kbd className="px-2 py-0.5 rounded bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 font-mono font-bold text-slate-700 dark:text-zinc-200">N ou D</kbd>
                  </div>
                  <div className="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800">
                    <span className="font-medium">Nova Renda</span>
                    <kbd className="px-2 py-0.5 rounded bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 font-mono font-bold text-slate-700 dark:text-zinc-200">R</kbd>
                  </div>
                  <div className="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800">
                    <span className="font-medium">Virar Mês</span>
                    <kbd className="px-2 py-0.5 rounded bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 font-mono font-bold text-slate-700 dark:text-zinc-200">V</kbd>
                  </div>
                  <div className="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800">
                    <span className="font-medium">Fechar Qualquer Janela</span>
                    <kbd className="px-2 py-0.5 rounded bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 font-mono font-bold text-slate-700 dark:text-zinc-200">ESC</kbd>
                  </div>
                  <div className="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800">
                    <span className="font-medium">Ir para Visão Geral</span>
                    <kbd className="px-2 py-0.5 rounded bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 font-mono font-bold text-slate-700 dark:text-zinc-200">1</kbd>
                  </div>
                  <div className="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800">
                    <span className="font-medium">Ir para Lançamentos</span>
                    <kbd className="px-2 py-0.5 rounded bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 font-mono font-bold text-slate-700 dark:text-zinc-200">2</kbd>
                  </div>
                  <div className="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800">
                    <span className="font-medium">Ir para Rendas</span>
                    <kbd className="px-2 py-0.5 rounded bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 font-mono font-bold text-slate-700 dark:text-zinc-200">3</kbd>
                  </div>
                  <div className="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800">
                    <span className="font-medium">Ir para Orçamento</span>
                    <kbd className="px-2 py-0.5 rounded bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 font-mono font-bold text-slate-700 dark:text-zinc-200">4</kbd>
                  </div>
                  <div className="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800">
                    <span className="font-medium">Rolar Página / Janela</span>
                    <kbd className="px-2 py-0.5 rounded bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 font-mono font-bold text-slate-700 dark:text-zinc-200">↑ / ↓</kbd>
                  </div>
                  <div className="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800">
                    <span className="font-medium">Mês Anterior / Seguinte</span>
                    <kbd className="px-2 py-0.5 rounded bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 font-mono font-bold text-slate-700 dark:text-zinc-200">← / →</kbd>
                  </div>
                </div>
                <div className="flex justify-end pt-2">
                  <button type="button" onClick={() => setShortcutsHelpOpen(false)} className="rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 text-xs font-semibold">Entendido</button>
                </div>
              </div>
            </ModalShell>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('./sw.js')
            .then(function (reg) {
              console.log('FinançasPro PWA ServiceWorker registrado com sucesso:', reg.scope);
            })
            .catch(function (err) {
              console.warn('Falha ao registrar ServiceWorker do FinançasPro:', err);
            });
        });
      }
    </script>
  </body>
</html>
