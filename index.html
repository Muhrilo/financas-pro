      function ExpenseModal({
        isOpen,
        onClose,
        editingItem,
        initialDueDate,
        initialCardId,
        accounts = [],
        cards = [],
        paymentMethods = [],
        categories = DEFAULT_CATEGORIES,
        availableTags = DEFAULT_TAGS,
        currentMonthIndex,
        currentYear,
        onSave,
        onOpenPaymentManager,
        onOpenCategoryManager,
      }) {
        const [description, setDescription] = useState('');
        const [invoiceName, setInvoiceName] = useState('');
        const [legend, setLegend] = useState('');
        const [paymentMode, setPaymentMode] = useState('unspecified'); // 'unspecified' | 'card' | 'account'
        const [cardId, setCardId] = useState('');
        const [accountId, setAccountId] = useState('');
        const [type, setType] = useState('Parcelado');
        const [amount, setAmount] = useState('');
        const [amountMode, setAmountMode] = useState('installment'); // 'installment' | 'total'
        const [totalPurchaseAmount, setTotalPurchaseAmount] = useState('');
        const [currInst, setCurrInst] = useState('1');
        const [totalInst, setTotalInst] = useState('1');
        const [status, setStatus] = useState('Pendente');
        const [category, setCategory] = useState('');
        const [subcategory, setSubcategory] = useState('');
        const [customSubcategory, setCustomSubcategory] = useState('');
        const [tags, setTags] = useState([]);
        const [tagInput, setTagInput] = useState('');
        const [dueDate, setDueDate] = useState('');
        const [paidDate, setPaidDate] = useState('');
        const [paidSource, setPaidSource] = useState('em_conta');
        const descInputRef = useRef(null);

        const QUICK_SUGGESTIONS = [
          { label: 'Mercado', icon: '🛒', cat: 'alimentacao' },
          { label: 'Combustível', icon: '⛽', cat: 'transporte' },
          { label: 'Restaurante / Lanche', icon: '🍕', cat: 'alimentacao' },
          { label: 'Farmácia', icon: '💊', cat: 'saude' },
          { label: 'Internet / Wi-Fi', icon: '🌐', cat: 'moradia' },
          { label: 'Energia / Luz', icon: '💡', cat: 'moradia' },
          { label: 'Água / Saneamento', icon: '💧', cat: 'moradia' },
          { label: 'Aluguel', icon: '🏠', cat: 'moradia' },
          { label: 'Academia', icon: '🏋️', cat: 'saude' },
          { label: 'Streaming', icon: '🍿', cat: 'assinaturas' },
        ];

        useEffect(() => {
          if (!isOpen) return;
          if (editingItem) {
            setCategory(editingItem.category ? normalizeCategoryKey(editingItem.category) : '');
            setSubcategory(editingItem.subcategory || '');
            setCustomSubcategory('');
            setTags(Array.isArray(editingItem.tags) ? editingItem.tags : (editingItem.tags ? [editingItem.tags] : []));
            setTagInput('');
            const cleanDesc = (editingItem.description || '').replace(/ \((Parc\. \d+\/\d+ em Atraso|Vencido)\)$/, '');
            setDescription(cleanDesc);
            setInvoiceName(editingItem.invoiceName || '');
            setLegend(editingItem.legend || editingItem.notes || '');

            // Determine paymentMode and IDs
            let pMode = editingItem.paymentMode;
            let cId = editingItem.cardId || '';
            let aId = editingItem.accountId || '';

            if (!pMode) {
              if (editingItem.paymentMethod === 'A definir' || !editingItem.paymentMethod) {
                pMode = 'unspecified';
              } else {
                const foundCard = cards.find((c) => c.id === cId || isExpenseForCard(editingItem, c, cards));
                if (foundCard) {
                  pMode = 'card';
                  cId = foundCard.id;
                } else {
                  const foundAcc = accounts.find((a) => a.id === aId || isExpenseForAccount(editingItem, a, accounts));
                  if (foundAcc) {
                    pMode = 'account';
                    aId = foundAcc.id;
                  } else {
                    pMode = 'unspecified';
                  }
                }
              }
            }
            if (pMode === 'card') {
              if (!cId || !cards.some((c) => c.id === cId)) {
                const foundCard = cards.find((c) => isExpenseForCard(editingItem, c, cards)) || cards[0];
                cId = foundCard ? foundCard.id : '';
              }
            }
            if (pMode === 'account') {
              if (!aId || !accounts.some((a) => a.id === aId)) {
                const foundAcc = accounts.find((a) => isExpenseForAccount(editingItem, a, accounts)) || accounts[0];
                aId = foundAcc ? foundAcc.id : '';
              }
            }
            if (!cId && cards.length > 0) cId = cards[0].id;
            if (!aId && accounts.length > 0) aId = accounts[0].id;

            setPaymentMode(pMode);
            setCardId(cId);
            setAccountId(aId);
            setType(editingItem.type || 'Parcelado');
            setAmount(String(editingItem.amount || ''));
            setCurrInst(String(editingItem.currentInstallment || '1'));
            setTotalInst(String(editingItem.totalInstallments || '1'));
            setStatus(editingItem.status || 'Pendente');
            setDueDate(editingItem.dueDate || '');
            setPaidDate(editingItem.paidDate || '');
            setPaidSource(editingItem.paidSource || (pMode === 'card' ? 'cartao' : 'em_conta'));
            setAmountMode('installment');
            if (editingItem.type === 'Parcelado' && editingItem.totalInstallments) {
              setTotalPurchaseAmount((editingItem.amount * editingItem.totalInstallments).toFixed(2));
            } else {
              setTotalPurchaseAmount('');
            }
          } else {
            setDescription('');
            setInvoiceName('');
            setLegend('');
            if (initialCardId) {
              setPaymentMode('card');
              setCardId(initialCardId);
            } else {
              setPaymentMode('unspecified');
              setCardId(cards[0]?.id || '');
            }
            setAccountId(accounts[0]?.id || '');
            setType('Parcelado');
            setAmount('');
            setTotalPurchaseAmount('');
            setAmountMode('installment');
            setCurrInst('1');
            setTotalInst('1');
            setStatus('Pendente');
            setCategory('');
            setSubcategory('');
            setCustomSubcategory('');
            setTags([]);
            setTagInput('');
            setPaidSource('em_conta');
            if (initialDueDate) {
              setDueDate(initialDueDate);
            } else {
              const ym = `${currentYear}-${String(currentMonthIndex + 1).padStart(2, '0')}`;
              setDueDate(`${ym}-10`);
            }
            setPaidDate('');
          }
        }, [isOpen, editingItem, initialDueDate, accounts, cards, currentMonthIndex, currentYear]);

        const selectedCard = cards.find((c) => c.id === cardId) || cards[0];
        const selectedAccount = accounts.find((a) => a.id === accountId) || accounts[0];
        const selectedCardLinkedAcc = selectedCard ? accounts.find((a) => a.id === selectedCard.linkedAccountId) : null;

        const handleStatusChange = (st) => {
          setStatus(st);
          if (st === 'Pago' && !paidDate) {
            setPaidDate(new Date().toISOString().slice(0, 10));
          }
        };

        const parsedAmount = parseMoneyInput(amount) || 0;
        const parsedCurr = Math.max(1, parseInt(currInst, 10) || 1);
        const parsedTotal = Math.max(parsedCurr, parseInt(totalInst, 10) || 1);
        const paidOffset = status === 'Pago' ? 0 : 1;
        const remainingPreview =
          type === 'Parcelado' && parsedAmount > 0
            ? Math.max(0, parsedTotal - parsedCurr + paidOffset) * parsedAmount
            : 0;
        const endPreview =
          type === 'Parcelado'
            ? getInstallmentEndLabel(
                { type: 'Parcelado', currentInstallment: parsedCurr, totalInstallments: parsedTotal },
                currentMonthIndex,
                currentYear
              )
            : null;

        const detectedCategory = guessCategory(description);

        const applySuggestion = (sug) => {
          setDescription(sug.label);
          setCategory(sug.cat);
        };

        const handleSubmit = (e, andNew = false) => {
          if (e && e.preventDefault) e.preventDefault();
          const t = type === 'Parcelado' ? Math.max(1, parseInt(totalInst, 10) || 1) : 1;
          const c = type === 'Parcelado' ? Math.min(t, Math.max(1, parseInt(currInst, 10) || 1)) : 1;
          
          let num = parseMoneyInput(amount);
          if (type === 'Parcelado' && amountMode === 'total') {
            const tot = parseMoneyInput(totalPurchaseAmount);
            if (!Number.isNaN(tot) && tot > 0) {
              num = roundMoney(tot / t);
            }
          }

          if (!description.trim() || Number.isNaN(num) || num <= 0) return;

          let bAbs = currentYear * 12 + currentMonthIndex;
          let targetM = currentMonthIndex;
          let targetY = currentYear;
          if (dueDate) {
            const parts = dueDate.split('-');
            if (parts.length >= 2) {
              const y = parseInt(parts[0], 10);
              const m = parseInt(parts[1], 10) - 1;
              if (!Number.isNaN(y) && !Number.isNaN(m)) {
                bAbs = y * 12 + m;
                targetY = y;
                targetM = m;
              }
            }
          }

          const targetCard = paymentMode === 'card'
            ? (cards.find((c) => c.id === cardId) || cards[0] || null)
            : null;
          const targetAcc = paymentMode === 'account'
            ? (accounts.find((a) => a.id === accountId) || accounts[0] || null)
            : null;
          const payMethodLabel =
            paymentMode === 'card'
              ? (targetCard ? targetCard.name : 'Cartão')
              : paymentMode === 'account'
              ? (targetAcc ? targetAcc.name : 'Conta')
              : 'A definir';

          let effectiveDueDate = dueDate;
          if (paymentMode === 'card' && targetCard?.dueDay) {
            const ym = `${targetY}-${String(targetM + 1).padStart(2, '0')}`;
            effectiveDueDate = `${ym}-${String(targetCard.dueDay).padStart(2, '0')}`;
          }

          onSave(
            {
              description: description.trim(),
              invoiceName: invoiceName.trim(),
              legend: legend.trim(),
              notes: legend.trim(),
              amount: num,
              type,
              currentInstallment: c,
              totalInstallments: t,
              status,
              category: category || detectedCategory,
              subcategory: (subcategory === '__custom__' ? customSubcategory : subcategory).trim(),
              tags: tags.map((t) => t.trim()).filter(Boolean),
              dueDate: effectiveDueDate || null,
              paymentMode,
              cardId: paymentMode === 'card' ? (targetCard?.id || null) : null,
              accountId: paymentMode === 'account' ? (targetAcc?.id || null) : null,
              paymentMethod: payMethodLabel,
              account: payMethodLabel,
              paidDate: status === 'Pago' ? (paidDate || new Date().toISOString().slice(0, 10)) : null,
              paidSource:
                status === 'Pago'
                  ? paymentMode === 'card'
                    ? 'cartao'
                    : paidSource
                  : null,
              paidAccountId:
                status === 'Pago' && paymentMode === 'account'
                  ? (targetAcc?.id || accountId || null)
                  : null,
              paidCardId:
                status === 'Pago' && paymentMode === 'card'
                  ? (targetCard?.id || cardId || null)
                  : null,
              paidAccount:
                status === 'Pago'
                  ? paymentMode === 'card'
                    ? payMethodLabel
                    : paidSource === 'dinheiro_fisico'
                    ? 'Dinheiro Físico'
                    : (targetAcc?.name || payMethodLabel)
                  : null,
              isInvoicePaid: status === 'Pago' && paymentMode === 'card' ? Boolean(editingItem?.isInvoicePaid) : false,
              targetMonthIndex: targetM,
              targetYear: targetY,
              baseAbs: bAbs,
            },
            editingItem?.id
          );

          if (!editingItem && andNew) {
            setDescription('');
            setInvoiceName('');
            setLegend('');
            setAmount('');
            setTotalPurchaseAmount('');
            setCategory('');
            setSubcategory('');
            setCustomSubcategory('');
            setTags([]);
            setTagInput('');
            setStatus('Pendente');
            setPaidDate('');
            setCurrInst('1');
            setTotalInst('1');
            setAmountMode('installment');
            if (descInputRef.current) descInputRef.current.focus();
          } else {
            onClose();
          }
        };

        return (
          <ModalShell
            isOpen={isOpen}
            onClose={onClose}
            maxWidth="max-w-2xl"
            title={editingItem ? 'Editar Lançamento' : 'Novo Gasto / Parcela'}
            subtitle="Preencha os dados da despesa ou use os atalhos rápidos abaixo."
          >
            <form onSubmit={(e) => handleSubmit(e, false)} className="space-y-4">
              {/* Descrição, Nome na Fatura & Legenda */}
              <div className="space-y-3">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 items-start">
                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <label className="block text-xs font-bold text-slate-700 dark:text-zinc-200">
                        Descrição / Nome Amigável <span className="text-rose-500">*</span>
                      </label>
                      {description && (
                        <span className="text-[10px] text-slate-400">
                          <strong className="text-emerald-600 dark:text-emerald-400">{detectedCategory}</strong>
                        </span>
                      )}
                    </div>
                    <div className="relative">
                      <input
                        ref={descInputRef}
                        type="text"
                        autoFocus
                        required
                        value={description}
                        onChange={(e) => setDescription(e.target.value)}
                        placeholder="Ex.: Curso Botox, Aluguel Studio..."
                        className="w-full rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-slate-50 dark:bg-zinc-900 px-3.5 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500/20"
                      />
                      {description && (
                        <button
                          type="button"
                          onClick={() => setDescription('')}
                          className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs"
                        >
                          ✕
                        </button>
                      )}
                    </div>
                  </div>

                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <label className="block text-xs font-bold text-slate-700 dark:text-zinc-200">
                        Nome na Fatura (como impresso)
                      </label>
                      <span className="text-[10px] text-slate-400">Opcional</span>
                    </div>
                    <div className="relative">
                      <input
                        type="text"
                        value={invoiceName}
                        onChange={(e) => setInvoiceName(e.target.value)}
                        placeholder="Ex.: PAG*JANSEN, MP*MELIMAIS..."
                        className="w-full rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-slate-50 dark:bg-zinc-900 px-3.5 py-2.5 text-sm font-mono text-indigo-700 dark:text-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                      />
                      {invoiceName && (
                        <button
                          type="button"
                          onClick={() => setInvoiceName('')}
                          className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs"
                        >
                          ✕
                        </button>
                      )}
                    </div>
                  </div>
                </div>

                {/* Legenda / Identificador / Observações */}
                <div>
                  <div className="flex items-center justify-between mb-1">
                    <label className="block text-xs font-bold text-slate-700 dark:text-zinc-200">
                      Legenda / Observação para Identificação
                    </label>
                    <span className="text-[10px] text-slate-400">Opcional</span>
                  </div>
                  <input
                    type="text"
                    value={legend}
                    onChange={(e) => setLegend(e.target.value)}
                    placeholder="Ex.: Turma Dezembro - Dra. Paula, Reembolsável pela clínica..."
                    className="w-full rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-slate-50 dark:bg-zinc-900 px-3.5 py-2 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500/20"
                  />
                  <p className="text-[10px] text-slate-400 dark:text-zinc-500 mt-1">
                    Use o nome na fatura e a legenda para bater e identificar rapidamente seus lançamentos físicos e digitais.
                  </p>
                </div>

                {/* Quick suggestion chips */}
                <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1 text-[11px]">
                  <span className="text-[10px] uppercase font-bold text-slate-400 shrink-0">Atalhos:</span>
                  {QUICK_SUGGESTIONS.map((sug) => (
                    <button
                      key={sug.label}
                      type="button"
                      onClick={() => applySuggestion(sug)}
                      className="shrink-0 px-2.5 py-1 rounded-full bg-slate-100 hover:bg-slate-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-slate-700 dark:text-zinc-300 font-medium transition-colors"
                    >
                      {sug.icon} {sug.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* Tipo de Gasto */}
              <div>
                <label className="block text-xs font-bold text-slate-700 dark:text-zinc-200 mb-1.5">
                  Tipo de Gasto
                </label>
                <div className="grid grid-cols-3 gap-2">
                  {[
                    { id: 'Fixo', label: 'Fixo', icon: '🔁', hint: 'Todo mês' },
                    { id: 'Parcelado', label: 'Parcelado', icon: '🔢', hint: 'Cartão / Carnê' },
                    { id: 'Esporádico', label: 'Esporádico', icon: '⚡', hint: 'Só este mês' },
                  ].map((opt) => {
                    const active = type === opt.id;
                    return (
                      <button
                        key={opt.id}
                        type="button"
                        onClick={() => setType(opt.id)}
                        className={`rounded-xl border p-2.5 text-left transition-all relative overflow-hidden ${
                          active
                            ? 'border-emerald-600 bg-emerald-500/10 text-emerald-800 dark:text-emerald-200 ring-2 ring-emerald-500/30 font-semibold'
                            : 'border-[#E2E8F0] dark:border-[#27272A] bg-slate-50 dark:bg-zinc-900 text-slate-600 dark:text-zinc-400 hover:bg-slate-100 dark:hover:bg-zinc-800'
                        }`}
                      >
                        <div className="flex items-center gap-1.5">
                          <span>{opt.icon}</span>
                          <span className="block text-xs font-bold">{opt.label}</span>
                        </div>
                        <span className="block text-[10px] opacity-75 mt-0.5">{opt.hint}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Forma de Pagamento e Valor */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5 items-start">
                {/* Onde será pago? */}
                <div className="space-y-2">
                  <div className="flex items-center justify-between">
                    <label className="block text-xs font-bold text-slate-700 dark:text-zinc-200">
                      Forma / Origem do Pagamento
                    </label>
                    <button
                      type="button"
                      onClick={onOpenPaymentManager}
                      className="text-[11px] font-semibold text-emerald-600 dark:text-emerald-400 hover:underline flex items-center gap-0.5"
                    >
                      <Icons.Plus className="w-3 h-3" /> Gerenciar
                    </button>
                  </div>

                  {/* Segmented Switch: A definir | Cartão | Conta */}
                  <div className="grid grid-cols-3 gap-1 p-1 bg-slate-100 dark:bg-zinc-800 rounded-xl text-xs font-semibold">
                    <button
                      type="button"
                      onClick={() => setPaymentMode('unspecified')}
                      className={`py-1.5 px-2 rounded-lg text-center transition-all ${
                        paymentMode === 'unspecified'
                          ? 'bg-white dark:bg-zinc-900 text-amber-700 dark:text-amber-300 shadow-xs'
                          : 'text-slate-500 hover:text-slate-800'
                      }`}
                    >
                      ⏳ A definir
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setPaymentMode('card');
                        const targetCard = cardId ? cards.find((c) => c.id === cardId) : cards[0];
                        if (!cardId && cards.length > 0) setCardId(cards[0].id);
                        if (targetCard?.dueDay) {
                          const ym = `${currentYear}-${String(currentMonthIndex + 1).padStart(2, '0')}`;
                          setDueDate(`${ym}-${String(targetCard.dueDay).padStart(2, '0')}`);
                        }
                      }}
                      className={`py-1.5 px-2 rounded-lg text-center transition-all ${
                        paymentMode === 'card'
                          ? 'bg-white dark:bg-zinc-900 text-violet-700 dark:text-violet-300 shadow-xs'
                          : 'text-slate-500 hover:text-slate-800'
                      }`}
                    >
                      💳 Cartão
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setPaymentMode('account');
                        if (!accountId && accounts.length > 0) setAccountId(accounts[0].id);
                      }}
                      className={`py-1.5 px-2 rounded-lg text-center transition-all ${
                        paymentMode === 'account'
                          ? 'bg-white dark:bg-zinc-900 text-emerald-700 dark:text-emerald-300 shadow-xs'
                          : 'text-slate-500 hover:text-slate-800'
                      }`}
                    >
                      🏦 Conta
                    </button>
                  </div>

                  {paymentMode === 'unspecified' && (
                    <div className="rounded-xl border border-amber-500/20 bg-amber-500/10 p-2.5 text-xs text-amber-800 dark:text-amber-300 space-y-1">
                      <p className="font-semibold flex items-center gap-1">
                        <span>⏳</span> Salvo sem conta nem cartão vinculados
                      </p>
                      <p className="text-[11px] opacity-90 leading-tight">
                        Você poderá cadastrar esta obrigação e definir se paga por Pix, Dinheiro ou Cartão quando for quitar.
                      </p>
                    </div>
                  )}

                  {paymentMode === 'card' && (
                    <div className="space-y-1.5 animate-fadeIn">
                      <select
                        value={cardId}
                        onChange={(e) => {
                          const cid = e.target.value;
                          setCardId(cid);
                          const chosen = cards.find((c) => c.id === cid);
                          if (chosen?.dueDay) {
                            const ym = `${currentYear}-${String(currentMonthIndex + 1).padStart(2, '0')}`;
                            setDueDate(`${ym}-${String(chosen.dueDay).padStart(2, '0')}`);
                          }
                        }}
                        className="w-full rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-zinc-900 px-3 py-2 text-sm font-semibold text-slate-800 dark:text-zinc-100 focus:outline-none focus:ring-2 focus:ring-violet-500/20"
                      >
                        {cards.map((c) => (
                          <option key={c.id} value={c.id}>
                            💳 {c.name} {c.dueDay ? `(Vence dia ${c.dueDay})` : ''}
                          </option>
                        ))}
                      </select>
                      {selectedCard && (
                        <div className="rounded-xl p-2 bg-violet-500/10 border border-violet-500/20 text-violet-900 dark:text-violet-200 text-xs flex items-center justify-between">
                          <span>Entra na fatura com limite: <strong>{formatBRL(selectedCard.limit)}</strong></span>
                          {selectedCardLinkedAcc && (
                            <span className="text-[10px] opacity-80">🏦 Débito: {selectedCardLinkedAcc.name}</span>
                          )}
                        </div>
                      )}
                    </div>
                  )}

                  {paymentMode === 'account' && (
                    <div className="space-y-1.5 animate-fadeIn">
                      <select
                        value={accountId}
                        onChange={(e) => setAccountId(e.target.value)}
                        className="w-full rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-zinc-900 px-3 py-2 text-sm font-semibold text-slate-800 dark:text-zinc-100 focus:outline-none focus:ring-2 focus:ring-emerald-500/20"
                      >
                        {accounts.map((a) => (
                          <option key={a.id} value={a.id}>
                            {a.type === 'carteira' ? '💵' : '🏦'} {a.name} ({a.type})
                          </option>
                        ))}
                      </select>
                      {selectedAccount && (
                        <div className="rounded-xl p-2 bg-emerald-500/10 border border-emerald-500/20 text-emerald-900 dark:text-emerald-200 text-xs">
                          <span>Origem do débito: <strong>{selectedAccount.name}</strong> ({selectedAccount.type})</span>
                        </div>
                      )}
                    </div>
                  )}
                </div>

                {/* Valor */}
                <div>
                  <div className="flex items-center justify-between mb-1.5">
                    <label className="block text-xs font-bold text-slate-700 dark:text-zinc-200">
                      {type === 'Parcelado' ? 'Valor por Parcela (R$)' : 'Valor da Despesa (R$)'}
                    </label>
                    {type === 'Parcelado' && (
                      <span className="text-[10px] text-amber-600 dark:text-amber-400 font-semibold">
                        {amountMode === 'total' ? 'Modo Total' : 'Modo Parcela'}
                      </span>
                    )}
                  </div>
                  <div className="relative">
                    <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-sm font-bold text-slate-400">
                      R$
                    </span>
                    <input
                      type="number"
                      step="0.01"
                      min="0.01"
                      inputMode="decimal"
                      required
                      value={amount}
                      onChange={(e) => {
                        setAmount(e.target.value);
                        if (amountMode === 'total') setAmountMode('installment');
                      }}
                      placeholder="0,00"
                      className="w-full rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-slate-50 dark:bg-zinc-900 pl-11 pr-3.5 py-2.5 text-base font-bold tabular-nums text-slate-800 dark:text-zinc-100 focus:outline-none focus:ring-2 focus:ring-emerald-500/20"
                    />
                  </div>
                  <p className="text-[11px] text-slate-400 mt-1">
                    {type === 'Parcelado'
                      ? 'Valor mensal cobrado a cada mês.'
                      : 'Valor total desta despesa.'}
                  </p>
                </div>
              </div>

              {/* Se for Parcelado: Painel Inteligente */}
              {type === 'Parcelado' && (
                <div className="rounded-2xl border border-amber-500/30 bg-amber-500/5 dark:bg-amber-950/20 p-3.5 space-y-3">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <span className="text-xs font-bold text-amber-900 dark:text-amber-200 flex items-center gap-1.5">
                      <span>🔢</span> Configuração do Parcelamento
                    </span>
                    <div className="flex items-center bg-white dark:bg-zinc-900 rounded-lg p-0.5 border border-amber-500/20 text-[11px]">
                      <button
                        type="button"
                        onClick={() => setAmountMode('installment')}
                        className={`px-2.5 py-1 rounded-md font-medium transition-all ${
                          amountMode === 'installment'
                            ? 'bg-amber-600 text-white shadow-sm'
                            : 'text-slate-600 dark:text-zinc-400 hover:text-slate-900'
                        }`}
                      >
                        Valor por Parcela
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          setAmountMode('total');
                          if (parsedAmount > 0 && !totalPurchaseAmount) {
                            setTotalPurchaseAmount(String((parsedAmount * parsedTotal).toFixed(2)));
                          }
                        }}
                        className={`px-2.5 py-1 rounded-md font-medium transition-all ${
                          amountMode === 'total'
                            ? 'bg-amber-600 text-white shadow-sm'
                            : 'text-slate-600 dark:text-zinc-400 hover:text-slate-900'
                        }`}
                      >
                        Valor Total da Compra
                      </button>
                    </div>
                  </div>

                  {amountMode === 'total' && (
                    <div className="bg-white dark:bg-zinc-900 rounded-xl p-3 border border-amber-500/30 space-y-1">
                      <label className="block text-xs font-bold text-slate-700 dark:text-zinc-300">
                        Valor Total da Compra (R$)
                      </label>
                      <input
                        type="number"
                        step="0.01"
                        min="0.01"
                        inputMode="decimal"
                        value={totalPurchaseAmount}
                        onChange={(e) => {
                          setTotalPurchaseAmount(e.target.value);
                          const val = parseMoneyInput(e.target.value) || 0;
                          if (val > 0) {
                            const perInst = val / parsedTotal;
                            setAmount(perInst.toFixed(2));
                          }
                        }}
                        placeholder="Ex: 1200,00"
                        className="w-full rounded-lg border border-[#E2E8F0] dark:border-[#27272A] bg-slate-50 dark:bg-zinc-950 px-3 py-2 text-sm font-bold tabular-nums"
                      />
                      <p className="text-[11px] text-amber-800 dark:text-amber-300">
                        Dividido em {parsedTotal}x de <strong>{formatBRL(parsedAmount)}</strong> por mês
                      </p>
                    </div>
                  )}

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-medium text-slate-700 dark:text-zinc-300 mb-1">
                        Parcela Atual
                      </label>
                      <input
                        type="number"
                        min="1"
                        max={parsedTotal}
                        inputMode="numeric"
                        required
                        value={currInst}
                        onChange={(e) => setCurrInst(e.target.value)}
                        className="w-full rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-zinc-900 px-3 py-2 text-sm font-semibold tabular-nums text-center"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-slate-700 dark:text-zinc-300 mb-1">
                        Total de Parcelas
                      </label>
                      <input
                        type="number"
                        min="1"
                        inputMode="numeric"
                        required
                        value={totalInst}
                        onChange={(e) => {
                          setTotalInst(e.target.value);
                          const newTot = parseInt(e.target.value, 10) || 1;
                          if (amountMode === 'total' && totalPurchaseAmount) {
                            const val = parseMoneyInput(totalPurchaseAmount) || 0;
                            if (val > 0) setAmount((val / newTot).toFixed(2));
                          }
                        }}
                        className="w-full rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-zinc-900 px-3 py-2 text-sm font-semibold tabular-nums text-center"
                      />
                    </div>
                  </div>

                  {/* Quick parcel chips */}
                  <div>
                    <span className="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">
                      Atalhos rápidos:
                    </span>
                    <div className="flex flex-wrap gap-1.5">
                      {[1, 2, 3, 4, 5, 6, 10, 12, 18, 24].map((n) => (
                        <button
                          key={n}
                          type="button"
                          onClick={() => {
                            setTotalInst(String(n));
                            if (amountMode === 'total' && totalPurchaseAmount) {
                              const val = parseMoneyInput(totalPurchaseAmount) || 0;
                              if (val > 0) setAmount((val / n).toFixed(2));
                            }
                          }}
                          className={`px-2.5 py-1 rounded-lg text-xs font-semibold border transition-all ${
                            parsedTotal === n
                              ? 'bg-amber-600 text-white border-amber-600 shadow-sm'
                              : 'bg-white dark:bg-zinc-900 border-[#E2E8F0] dark:border-[#27272A] text-slate-700 dark:text-zinc-300 hover:border-amber-500'
                          }`}
                        >
                          {n}x
                        </button>
                      ))}
                    </div>
                  </div>

                  {parsedAmount > 0 && (

                        <span className="text-slate-500 dark:text-zinc-400 block text-[10px]">Saldo Restante:</span>

                      <div className="bg-white/70 dark:bg-zinc-900/70 p-2 rounded-xl col-span-2 sm:col-span-1">

                    </div>
                  )}

              {/* Categoria e Subcategoria */}
              {(() => {
                const activeCatObj = categories.find((c) =>

                  (c.id && c.id === category) ||
                  (c.name && c.name.toLowerCase() === (category || '').toLowerCase())

                const activeSubcategories = activeCatObj ? (activeCatObj.subcategories || []) : [];

                    <div>

                      </div>
                      <select

                      >
                        <option value="">
                          ✨ Sugerida: {(() => {

                            return detected ? `${detected.emoji} ${detected.name || detected.label}` : '📌 Outros';

                        {categories.map((c) => (
                          <option key={c.id || c.key} value={c.key || c.id}>

                    <div>

              {/* Tags / Marcadores */}

                  <input

                    value={tagInput}
                    onChange={(e) => setTagInput(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' || e.key === ',') {
                        e.preventDefault();
                        const t = tagInput.replace(/^[#,]+/, '').trim();
                        if (t && !tags.includes(t)) {
                          setTags([...tags, t]);
                        }
                        setTagInput('');
                      }
                    }}
                    onBlur={() => {
                      const t = tagInput.replace(/^[#,]+/, '').trim();
                      if (t && !tags.includes(t)) {
                        setTags([...tags, t]);
                      }
                      setTagInput('');
                    }}
                    placeholder={tags.length === 0 ? "Digite uma tag (ex: Essencial, Viagem) e dê Enter..." : "Adicionar outra tag..."}
                    className="flex-1 min-w-[140px] bg-transparent text-xs py-1 px-1 focus:outline-none placeholder:text-slate-400"

                {availableTags.filter((t) => !tags.includes(t)).length > 0 && (

              {/* Data de Vencimento com Calendário */}

                      <button

                        type="button"
                        onClick={() => {
                          const ym = `${currentYear}-${String(currentMonthIndex + 1).padStart(2, '0')}`;

                        className="px-2.5 py-1 rounded-md bg-white dark:bg-zinc-800 border border-[#E2E8F0] dark:border-[#27272A] hover:bg-slate-100 dark:hover:bg-zinc-700 font-medium"
                      >
                        Dia {d}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              <div className="flex items-center justify-between py-1">

                    Status neste mês
                  </label>
                  <span className="text-[11px] text-slate-400">
                    {status === 'Pago' ? 'Despesa quitada e conciliada' : 'Aguardando pagamento no vencimento'}
                  </span>
                </div>
                <div className="inline-flex p-1 bg-slate-100 dark:bg-zinc-800 rounded-xl text-xs font-semibold gap-1">
                  <button
                    type="button"
                    onClick={() => handleStatusChange('Pendente')}
                    className={`px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 ${
                      status === 'Pendente'

                        : 'text-slate-500 hover:text-slate-800 dark:hover:text-zinc-200'
                    }`}
                  >
                    <span>⏳</span> Pendente
                  </button>
                  <button
                    type="button"
                    onClick={() => handleStatusChange('Pago')}
                    className={`px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 ${
                      status === 'Pago'
                        ? 'bg-emerald-600 text-white font-bold shadow-xs'
                        : 'text-slate-500 hover:text-slate-800 dark:hover:text-zinc-200'
                    }`}
                  >
                    <span>✓</span> Já está Pago
                  </button>
                </div>
              </div>

              {/* Quando marcado como Pago */}
              {status === 'Pago' && (
                <div className="rounded-2xl border-2 border-emerald-500/30 bg-emerald-500/10 p-4 space-y-3.5 animate-fadeIn">
                  <div className="flex items-center justify-between border-b border-emerald-500/20 pb-2">
                    <div>
                      <h4 className="text-xs font-bold text-emerald-900 dark:text-emerald-200 flex items-center gap-1.5">
                        <Icons.CheckCircle className="w-4 h-4 text-emerald-600" />
                        Conciliação da Baixa Real
                      </h4>
                      <p className="text-[11px] text-emerald-800/80 dark:text-emerald-300/80">
                        {paymentMode === 'card'
                          ? 'Gasto registrado como compra no cartão (entrará na fatura sem débito bancário imediato).'
                          : 'Informe a conta ou carteira de onde saiu o valor para debitar o saldo real.'}
                      </p>
                    </div>
                    <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-600 text-white">
                      Liquidado
                    </span>
                  </div>

                  {paymentMode !== 'card' && (

                        De onde saiu o dinheiro?

                          type="button"
                          onClick={() => setPaidSource('em_conta')}
                          className={`rounded-xl border p-3 text-left transition-all ${
                            paidSource === 'em_conta'
                              ? 'border-emerald-600 bg-white dark:bg-zinc-900 shadow-sm text-emerald-800 dark:text-emerald-200 ring-2 ring-emerald-500'
                              : 'border-emerald-500/20 bg-emerald-500/5 text-emerald-800 dark:text-emerald-400 hover:bg-white/50'
                          }`}
                        >
                          <div className="flex items-center gap-1.5 font-bold text-xs">
                            <span>🏦</span> Saldo em Conta
                          </div>
                          <p className="text-[10px] opacity-75 mt-0.5">Pix, Débito em conta ou Transferência</p>
                        </button>

                        <button
                          type="button"
                          onClick={() => setPaidSource('dinheiro_fisico')}
                          className={`rounded-xl border p-3 text-left transition-all ${
                            paidSource === 'dinheiro_fisico'

                            <span>💵</span> Dinheiro Físico

                        </button>

                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <label className="block text-xs font-bold text-emerald-900 dark:text-emerald-200 flex items-center gap-1.5">
                        <Icons.Calendar className="w-3.5 h-3.5 text-emerald-600" />
                        Data em que você pagou:
                      </label>
                      <button
                        type="button"
                        onClick={() => setPaidDate(new Date().toISOString().slice(0, 10))}
                        className="text-[11px] font-bold text-emerald-700 dark:text-emerald-400 hover:underline"
                      >
                        Definir como Hoje
                      </button>
                    </div>
                    <input

                  <button

                    className="inline-flex items-center gap-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 text-xs sm:text-sm font-bold shadow-sm transition-all"

              </div>
            </form>
          </ModalShell>
        );
      }
      function IncomeModal({ isOpen, onClose, editingItem, onSave, currentMonthIndex, currentYear, availableTags = DEFAULT_TAGS }) {
        const [name, setName] = useState('');
        const [invoiceName, setInvoiceName] = useState('');
        const [legend, setLegend] = useState('');
        const [category, setCategory] = useState('Recorrente / Mensalidades');
        const [expected, setExpected] = useState('');
        const [realized, setRealized] = useState('');
        const [notes, setNotes] = useState('');
        const [tags, setTags] = useState([]);
        const [tagInput, setTagInput] = useState('');
        const nameInputRef = useRef(null);

        useEffect(() => {
          if (!isOpen) return;
          if (editingItem) {
            setName(editingItem.name);
            setInvoiceName(editingItem.invoiceName || '');
            setLegend(editingItem.legend || editingItem.notes || '');
            setCategory(editingItem.category);
            setExpected(String(editingItem.expectedAmount));
            setRealized(String(editingItem.realizedAmount));
            setNotes(editingItem.notes || '');
            setTags(Array.isArray(editingItem.tags) ? editingItem.tags : (editingItem.tags ? [editingItem.tags] : []));
            setTagInput('');
          } else {
            setName('');
            setInvoiceName('');
            setLegend('');
            setCategory('Recorrente / Mensalidades');
            setExpected('');
            setRealized('');
            setNotes('');
            setTags([]);
            setTagInput('');
          }
        }, [isOpen, editingItem]);

        const handleSubmit = (e, andNew = false) => {
          if (e && e.preventDefault) e.preventDefault();
          if (!name.trim()) return;
          const expVal = Math.max(0, parseMoneyInput(expected) || 0);
          const realVal =
            realized === ''
              ? expVal
              : Math.max(0, parseMoneyInput(realized) || 0);
          onSave(
            {
              name: name.trim(),
              invoiceName: invoiceName.trim(),
              legend: legend.trim(),
              notes: legend.trim() || notes.trim(),
              category,
              expectedAmount: expVal,
              realizedAmount: realVal,
              tags: tags.map((t) => t.trim()).filter(Boolean),
              targetMonthIndex: currentMonthIndex,
              targetYear: currentYear,
            },
            editingItem?.id
          );

          if (!editingItem && andNew) {
            setName('');
            setExpected('');
            setRealized('');
            setNotes('');
            setTags([]);
            setTagInput('');
            if (nameInputRef.current) nameInputRef.current.focus();
          } else {
            onClose();
          }
        };

        return (
          <ModalShell
            isOpen={isOpen}
            onClose={onClose}
            maxWidth="max-w-xl"
            title={editingItem ? 'Editar Fonte de Renda' : 'Nova Fonte de Renda'}
            subtitle="Adicione salários, atendimentos ou rendas extras para compor seu fluxo."
          >
            <form onSubmit={(e) => handleSubmit(e, false)} className="space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 items-start">
                <div>
                  <label className="block text-xs font-bold text-slate-700 dark:text-zinc-200 mb-1.5">
                    Nome da Fonte / Receita <span className="text-rose-500">*</span>
                  </label>
                  <input
                    ref={nameInputRef}
                    type="text"
                    autoFocus
                    required
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    placeholder="Ex.: Salário, Pilates, Consultoria..."
                    className="w-full rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-slate-50 dark:bg-zinc-900 px-3.5 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500/20"
                  />
                </div>
                <div>
                  <div className="flex items-center justify-between mb-1.5">
                    <label className="block text-xs font-bold text-slate-700 dark:text-zinc-200">
                      Nome no Comprovante / Extrato
                    </label>
                    <span className="text-[10px] text-slate-400">Opcional</span>
                  </div>
                  <input
                    type="text"
                    value={invoiceName}
                    onChange={(e) => setInvoiceName(e.target.value)}
                    placeholder="Ex.: PIX DRA MARIANA, TED CLINICA..."
                    className="w-full rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-slate-50 dark:bg-zinc-900 px-3.5 py-2.5 text-sm font-mono text-emerald-700 dark:text-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/20"
                  />
                </div>
              </div>

              <div>

      const GOOGLE_APPS_SCRIPT_TEMPLATE = `// ====================================================================
// FINANÇASPRO - SINCRONIZADOR GOOGLE SHEETS
// ====================================================================
// 1. Em sua planilha: Extensões > Apps Script.
// 2. Apague o conteúdo e cole este código completo.
// 3. Clique em "Salvar" (ícone disquete).
// 4. Clique em "Implantar" > "Nova implantação".
// 5. Tipo: "App da Web" | Quem pode acessar: "Qualquer pessoa" (Anyone).
// 6. Clique em "Implantar", autorize o acesso e copie a URL do App da Web (/exec).
// ====================================================================

function doPost(e) {
  try {
    var rawContent = e.postData.contents;
    var payload = JSON.parse(rawContent);
    var state = payload.data || payload.state || payload;
    var ss = SpreadsheetApp.getActiveSpreadsheet();

    // 1. Aba de Backup Completo JSON
    var backupSheet = getOrCreateSheet(ss, '💾 Backup_Dados');
    backupSheet.clear();
    backupSheet.appendRow(['Data da Sincronização', 'JSON Completo']);
    backupSheet.appendRow([new Date(), JSON.stringify(state)]);
    backupSheet.autoResizeColumns(1, 2);

    // 2. Aba de Resumo
    updateSummarySheet(ss, state);

    // 3. Aba de Despesas
    updateExpensesSheet(ss, state);

    // 4. Aba de Rendas
    updateIncomesSheet(ss, state);

    // 5. Aba de Investimentos
    updateInvestmentsSheet(ss, state);

    return ContentService.createTextOutput(JSON.stringify({
      status: 'success',
      message: 'Planilha sincronizada com sucesso!',
      updatedAt: new Date().toISOString()
    })).setMimeType(ContentService.MimeType.JSON);

  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({
      status: 'error',
      message: err.toString()
    })).setMimeType(ContentService.MimeType.JSON);
  }
}

function doGet(e) {
  try {
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var backupSheet = ss.getSheetByName('💾 Backup_Dados');
    if (!backupSheet) {
      return ContentService.createTextOutput(JSON.stringify({
        status: 'error',
        message: 'Nenhum dado salvo ainda nesta planilha.'
      })).setMimeType(ContentService.MimeType.JSON);
    }
    var raw = backupSheet.getRange(2, 2).getValue();
    var parsed = JSON.parse(raw);
    return ContentService.createTextOutput(JSON.stringify({
      status: 'success',
      data: parsed
    })).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({
      status: 'error',
      message: err.toString()
    })).setMimeType(ContentService.MimeType.JSON);
  }
}

function getOrCreateSheet(ss, name) {
  var s = ss.getSheetByName(name);
  if (!s) s = ss.insertSheet(name);
  return s;
}

function styleHeader(sheet, numCols) {
  var header = sheet.getRange(1, 1, 1, numCols);
  header.setBackground('#0F172A')
        .setFontColor('#FFFFFF')
        .setFontWeight('bold')
        .setFontFamily('Arial');
  sheet.setFrozenRows(1);
}

function updateSummarySheet(ss, state) {
  var s = getOrCreateSheet(ss, '📊 Resumo');
  s.clear();
  var months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  var comp = months[state.currentMonthIndex || 0] + ' / ' + (state.currentYear || new Date().getFullYear());
  
  var totalIncomes = (state.incomes || []).reduce(function(a, b){ return a + (b.realizedAmount || 0); }, 0);
  var totalExpenses = (state.expenses || []).reduce(function(a, b){ return a + (b.amount || 0); }, 0);
  var paidExpenses = (state.expenses || []).filter(function(e){ return e.status === 'Pago'; }).reduce(function(a, b){ return a + (b.amount || 0); }, 0);
  var pendingExpenses = Math.max(0, totalExpenses - paidExpenses);
  var freeBalance = totalIncomes - totalExpenses;
  var totalInvested = (state.investments || []).reduce(function(a, b){ return a + (b.currentBalance || 0); }, 0);

  s.appendRow(['Indicador', 'Valor']);
  s.appendRow(['Competência Atual', comp]);
  s.appendRow(['Entradas Realizadas', totalIncomes]);
  s.appendRow(['Saídas Totais', totalExpenses]);
  s.appendRow(['Já Pago', paidExpenses]);
  s.appendRow(['Pendente', pendingExpenses]);
  s.appendRow(['Saldo Livre Estimado', freeBalance]);
  s.appendRow(['Patrimônio Guardado', totalInvested]);
  s.appendRow(['Última Sincronização', new Date()]);

  styleHeader(s, 2);
  s.getRange(3, 2, 6, 1).setNumberFormat('R$ #,##0.00');
  s.autoResizeColumns(1, 2);
}

function updateExpensesSheet(ss, state) {
  var s = getOrCreateSheet(ss, '💳 Despesas');
  s.clear();
  var headers = [
    'Descrição', 'Valor (R$)', 'Status', 'Categoria', 'Forma / Cartão',
    'Conta de Débito', 'Tipo', 'Parcela', 'Vencimento', 'Data Pagamento', 'Meio Pagamento'
  ];
  s.appendRow(headers);

  var rows = (state.expenses || []).map(function(e) {
    var parcela = e.type === 'Parcelado' ? (e.currentInstallment + '/' + e.totalInstallments) : (e.type === 'Fixo' ? 'Mensal Fixo' : 'À vista');
    return [
      e.description || '',
      Number(e.amount) || 0,
      e.status || 'Pendente',
      e.category || '',
      e.paymentMethod || '',
      e.paidAccount || e.account || '',
      e.type || 'Esporádico',
      parcela,
      e.dueDate || '',
      e.paidDate || '',
      e.paidSource === 'dinheiro_fisico' ? 'Dinheiro Físico 💵' : (e.paidSource === 'em_conta' ? 'Em Conta 🏦' : '')
    ];
  });

  if (rows.length > 0) {
    s.getRange(2, 1, rows.length, headers.length).setValues(rows);
    s.getRange(2, 2, rows.length, 1).setNumberFormat('R$ #,##0.00');
  }
  styleHeader(s, headers.length);
  s.autoResizeColumns(1, headers.length);
}

function updateIncomesSheet(ss, state) {
  var s = getOrCreateSheet(ss, '💵 Rendas');
  s.clear();
  var headers = ['Fonte de Renda', 'Categoria', 'Valor Realizado (R$)', 'Valor Previsto (R$)', 'Observações'];
  s.appendRow(headers);

  var rows = (state.incomes || []).map(function(i) {
    return [
      i.name || '',
      i.category || '',
      Number(i.realizedAmount) || 0,
      Number(i.expectedAmount) || 0,
      i.notes || ''
    ];
  });

  if (rows.length > 0) {
    s.getRange(2, 1, rows.length, headers.length).setValues(rows);
    s.getRange(2, 3, rows.length, 2).setNumberFormat('R$ #,##0.00');
  }
  styleHeader(s, headers.length);
  s.autoResizeColumns(1, headers.length);
}

function updateInvestmentsSheet(ss, state) {
  var s = getOrCreateSheet(ss, '📈 Investimentos');
  s.clear();
  var headers = ['Instituição / Nome', 'Tipo / Aplicação', 'Saldo Atual (R$)', 'Aporte Mensal (R$)', 'Meta (R$)', 'Status Mês'];
  s.appendRow(headers);

  var rows = (state.investments || []).map(function(inv) {
    return [
      inv.institution || '',
      inv.type || '',
      Number(inv.currentBalance) || 0,
      Number(inv.plannedContribution) || 0,
      Number(inv.goal) || 0,
      inv.contributedThisMonth ? 'Aporte Realizado ✅' : 'Pendente'
    ];
  });

  if (rows.length > 0) {
    s.getRange(2, 1, rows.length, headers.length).setValues(rows);
    s.getRange(2, 3, rows.length, 3).setNumberFormat('R$ #,##0.00');
  }
  styleHeader(s, headers.length);
  s.autoResizeColumns(1, headers.length);
}`;

      /* ------------------------------------------------------------------ */
      /* Orçamento e Extras de Investimento                                 */
      /* ------------------------------------------------------------------ */
      function daysUntilDay(day) {
        const n = new Date();
        const t = new Date(n.getFullYear(), n.getMonth(), n.getDate());
        let d = new Date(n.getFullYear(), n.getMonth(), day);
        if (d < t) d = new Date(n.getFullYear(), n.getMonth() + 1, day);
        return Math.round((d - t) / 864e5);
      }
      const inDays = (n) => (n === 0 ? 'hoje' : n === 1 ? 'amanhã' : `em ${n} dias`);

      function Bar({ pct, over, warn }) {
        return (
          <div className="w-full h-2.5 rounded-full bg-slate-200 dark:bg-zinc-800 overflow-hidden">
            <div className={`h-full rounded-full ${over ? 'bg-rose-500' : warn ? 'bg-amber-500' : 'bg-emerald-500'}`} style={{ width: `${Math.min(100, Math.max(0, pct))}%` }} />
          </div>
        );
      }

      function MoneyInput({ value, onChange, placeholder = 'Sem limite' }) {
        const [v, setV] = useState(value ? String(value) : '');
        useEffect(() => setV(value ? String(value) : ''), [value]);
        return (
          <input type="number" min="0" inputMode="decimal" value={v} placeholder={placeholder}
            onChange={(e) => setV(e.target.value)}
            onBlur={() => onChange(Math.max(0, parseMoneyInput(v)))}
            onKeyDown={(e) => e.key === 'Enter' && e.currentTarget.blur()}
            className="w-28 rounded-lg border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-zinc-950 px-2.5 py-1.5 text-sm tabular-nums text-right" />
        );
      }

      function InvestExtras({ inv, onMove }) {
        const [v, setV] = useState('');
        const goal = inv.goal || 0;
        const pct = goal > 0 ? (inv.currentBalance / goal) * 100 : 0;
        const left = Math.max(0, goal - inv.currentBalance);
        const months = inv.plannedContribution > 0 ? Math.ceil(left / inv.plannedContribution) : null;
        const amt = parseMoneyInput(v) || 0;
        const go = (sign) => { if (amt <= 0) return; onMove(inv.id, sign * amt); setV(''); };
        return (
          <div className="space-y-3">
            {goal > 0 && (
              <div className="space-y-1.5">
                <div className="flex justify-between text-xs tabular-nums"><span className="font-semibold">Meta {formatBRL(goal)}</span><span>{formatPercent(Math.min(100, pct), 0)}</span></div>
                <Bar pct={pct} />
                <p className="text-[11px] opacity-70 tabular-nums">{left === 0 ? '🎉 Meta atingida!' : `Faltam ${formatBRL(left)}${months ? ` · cerca de ${months} ${months === 1 ? 'mês' : 'meses'} no ritmo do aporte mensal` : ''}`}</p>
              </div>
            )}
            <div className="flex gap-2">
              <input type="number" min="0" step="0.01" inputMode="decimal" value={v} onChange={(e) => setV(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && go(1)} placeholder="Valor (R$)" className="flex-1 min-w-0 rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-zinc-950 px-3 py-2 text-sm tabular-nums" />
              <button type="button" onClick={() => go(1)} className="rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 text-xs font-semibold">Guardar</button>
              <button type="button" onClick={() => go(-1)} className="rounded-xl border border-[#E2E8F0] dark:border-[#27272A] px-3.5 py-2 text-xs font-semibold">Retirar</button>
            </div>
            {inv.moves?.length > 0 && <p className="text-[11px] opacity-60 tabular-nums">Últimos: {inv.moves.slice(0, 3).map((m) => `${m.v > 0 ? '+' : '−'}${formatBRL(Math.abs(m.v))} (${m.d.slice(8)}/${m.d.slice(5, 7)})`).join(' · ')}</p>}
          </div>
        );
      }

      /* ------------------------------------------------------------------ */
      /* Aba: Calendário Financeiro de Vencimentos e Pagamentos            */
      /* ------------------------------------------------------------------ */
      function CalendarTab({
        state,
        paymentChannels,
        onOpenNewExpense,
        onEditExpense,
        toggleExpenseStatus,
      }) {
        const { currentMonthIndex, currentYear, expenses, paymentMethods } = state;
        const [selectedDay, setSelectedDay] = useState(null);

        const now = new Date();
        const isCurrentRealMonth =
          now.getMonth() === currentMonthIndex && now.getFullYear() === currentYear;
        const todayDay = now.getDate();

        const totalDaysInMonth = new Date(currentYear, currentMonthIndex + 1, 0).getDate();
        const firstDayOfWeek = new Date(currentYear, currentMonthIndex, 1).getDay();

        const getItemDueDay = (item) => {
          if (item.dueDate) {
            const parts = item.dueDate.split('-');
            if (parts.length === 3) {
              const itemY = parseInt(parts[0], 10);
              const itemM = parseInt(parts[1], 10) - 1;
              if (itemY === currentYear && itemM === currentMonthIndex) {
                return parseInt(parts[2], 10);
              }
            }
          }
          const pm = paymentMethods.find((p) => p.name === item.paymentMethod);
          return pm?.dueDay || null;
        };

        const getItemPaidDay = (item) => {
          if (item.status === 'Pago' && item.paidDate) {
            const parts = item.paidDate.split('-');
            if (parts.length === 3) {
              const itemY = parseInt(parts[0], 10);
              const itemM = parseInt(parts[1], 10) - 1;
              if (itemY === currentYear && itemM === currentMonthIndex) {
                return parseInt(parts[2], 10);
              }
            }
          }
          return null;
        };

        const daysMap = useMemo(() => {
          const map = {};
          for (let d = 1; d <= totalDaysInMonth; d++) {
            map[d] = { dueList: [], paidList: [] };
          }
          expenses.forEach((e) => {
            const d = getItemDueDay(e);
            if (d && map[d]) {
              map[d].dueList.push(e);
            }
            const p = getItemPaidDay(e);
            if (p && map[p]) {
              map[p].paidList.push(e);
            }
          });
          return map;
        }, [expenses, totalDaysInMonth, currentMonthIndex, currentYear, paymentMethods]);

        const stats = useMemo(() => {
          let pendingCount = 0;
          let pendingAmount = 0;
          let paidCount = 0;
          let paidAmount = 0;
          let overdueCount = 0;
          let overdueAmount = 0;
          let todayCount = 0;
          let todayAmount = 0;

          expenses.forEach((e) => {
            if (e.status === 'Pago') {
              paidCount++;
              paidAmount += e.amount;
            } else {
              pendingCount++;
              pendingAmount += e.amount;
              const d = getItemDueDay(e);
              if (isCurrentRealMonth && d) {
                if (d < todayDay) {
                  overdueCount++;
                  overdueAmount += e.amount;
                } else if (d === todayDay) {
                  todayCount++;
                  todayAmount += e.amount;
                }
              }
            }
          });

          return {
            pendingCount,
            pendingAmount,
            paidCount,
            paidAmount,
            overdueCount,
            overdueAmount,
            todayCount,
            todayAmount,
            totalCount: expenses.length,
            totalAmount: pendingAmount + paidAmount,
          };
        }, [expenses, isCurrentRealMonth, todayDay, paymentMethods]);

        const cells = [];
        for (let i = 0; i < firstDayOfWeek; i++) {
          cells.push({ isBlank: true, key: `pad-${i}` });
        }
        for (let day = 1; day <= totalDaysInMonth; day++) {
          const { dueList, paidList } = daysMap[day] || { dueList: [], paidList: [] };
          const isToday = isCurrentRealMonth && day === todayDay;
          const isPast = isCurrentRealMonth && day < todayDay;
          cells.push({
            isBlank: false,
            key: `day-${day}`,
            day,
            isToday,
            isPast,
            dueList,
            paidList,
          });
        }

        const selectedDayDetails = selectedDay ? daysMap[selectedDay] : null;

        const upcomingList = useMemo(() => {
          return expenses
            .filter((e) => e.status === 'Pendente')
            .map((e) => ({ ...e, dueDay: getItemDueDay(e) }))
            .sort((a, b) => (a.dueDay || 99) - (b.dueDay || 99));
        }, [expenses, paymentMethods, currentMonthIndex, currentYear]);

        const weekDays = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

        return (
          <div className="space-y-5">
            {/* Cabeçalho do Calendário */}
