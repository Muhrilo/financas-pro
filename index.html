                          className="w-4 h-4 rounded accent-emerald-600"
                        />
                        <span>Marcar este cartão com o selo <strong>🏆 Quitado / Zerado</strong></span>
                      </label>
                    )}

                    {cardFormError && (
                      <p className="text-xs font-semibold text-rose-600 dark:text-rose-400">{cardFormError}</p>
                    )}

                    <div className="flex justify-end pt-1">
                      <button
                        type="submit"
                        className="rounded-xl bg-violet-600 hover:bg-violet-700 text-white px-5 py-2.5 text-xs sm:text-sm font-semibold shadow-sm flex items-center gap-1.5"
                      >
                        <Icons.Check className="w-4 h-4" />
                        {editingCardId ? 'Salvar Cartão' : '+ Cadastrar Cartão'}
                      </button>
                    </div>
                  </form>

                  {/* Deletar Cartão Modal / Aviso */}
                  {deletingCard && (
                    <div className="rounded-2xl border border-rose-500/30 bg-rose-500/5 p-4 space-y-3">
                      <div className="flex items-start gap-2.5">
                        <Icons.Alert className="w-5 h-5 text-rose-600 shrink-0 mt-0.5" />
                        <div className="space-y-1 text-xs">
                          <p className="font-bold text-rose-700 dark:text-rose-300 text-sm">
                            Excluir cartão "{deletingCard.name}"?
                          </p>
                          {deletingCard.linkedCount > 0 ? (
                            <p className="text-slate-600 dark:text-zinc-300">
                              Existem <strong>{deletingCard.linkedCount} lançamento(s)</strong> vinculados a este cartão. Escolha para onde transferi-los:
                            </p>
                          ) : (
                            <p className="text-slate-600 dark:text-zinc-300">
                              Nenhum lançamento está vinculado a este cartão no momento.
                            </p>
                          )}
                        </div>
                      </div>

                      {deletingCard.linkedCount > 0 && (
                        <div>
                          <label className="block text-xs font-medium mb-1">Mover lançamentos para:</label>
                          <select
                            value={migrateCardToId}
                            onChange={(e) => setMigrateCardToId(e.target.value)}
                            className="w-full rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-zinc-900 px-3 py-2 text-sm"
                          >
                            {cards
                              .filter((x) => x.id !== deletingCard.id)
                              .map((x) => (
                                <option key={x.id} value={x.id}>
                                  {x.name}
                                </option>
                              ))}
                          </select>
                        </div>
                      )}

                      <div className="flex justify-end gap-2">
                        <button
                          type="button"
                          onClick={() => setDeletingCard(null)}
                          className="rounded-xl border border-[#E2E8F0] dark:border-[#27272A] px-3.5 py-2 text-xs font-medium"
                        >
                          Cancelar
                        </button>
                        <button
                          type="button"
                          onClick={confirmDeleteCard}
                          className="rounded-xl bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 text-xs font-semibold"
                        >
                          Confirmar Exclusão
                        </button>
                      </div>
                    </div>
                  )}

                  {/* Lista de Cartões */}
                  <div className="space-y-2">
                    <span className="text-xs font-bold uppercase tracking-wider text-slate-500">
                      Cartões de Crédito Cadastrados ({cards.length})
                    </span>
                    <div className="divide-y divide-[#E2E8F0] dark:divide-[#27272A] rounded-2xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-zinc-950 overflow-hidden shadow-xs">
                      {cards.map((card) => {
                        const cls = getPaymentColorClasses(card.color);
                        const linkedAcc = accounts.find((a) => a.id === card.linkedAccountId);
                        const isBeingEdited = editingCardId === card.id;
                        return (
                          <div
                            key={card.id}
                            className={`flex items-center justify-between gap-3 px-4 py-3.5 transition-colors ${
                              isBeingEdited ? 'bg-violet-500/10' : 'hover:bg-slate-50 dark:hover:bg-zinc-900/40'
                            }`}
                          >
                            <div className="flex items-center gap-3 min-w-0">
                              <span className={`w-3.5 h-3.5 rounded-full shrink-0 ${cls.dot}`} />
                              <div className="min-w-0">
                                <div className="flex flex-wrap items-center gap-2">
                                  <p className="text-sm font-bold text-slate-900 dark:text-zinc-100 truncate">
                                    {card.name}
                                  </p>
                                  <span className="text-[10px] px-2 py-0.5 rounded-md font-semibold bg-violet-500/10 text-violet-700 dark:text-violet-300">
                                    💳 Cartão de Crédito
                                  </span>
                                  {card.isSettled && (
                                    <span className="px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 text-[10px] font-bold">
                                      🏆 Quitado
                                    </span>
                                  )}
                                  {card.limit > 0 && (
                                    <span className="text-[11px] text-slate-500 dark:text-zinc-400 tabular-nums">
                                      Limite: {formatBRL(card.limit)}
                                    </span>
                                  )}
                                </div>
                                <div className="flex flex-wrap items-center gap-x-2 gap-y-0.5 mt-0.5 text-[11px] text-slate-500">
                                  {linkedAcc ? (
                                    <span className="font-semibold text-sky-600 dark:text-sky-400">
                                      🏦 Débito vinculado: {linkedAcc.name}
                                    </span>
                                  ) : (
                                    <span className="italic text-slate-400">Sem conta vinculada padrão</span>
                                  )}
                                  {card.dueDay && <span>• Vence dia {card.dueDay}</span>}
                                  {card.closingDay && <span>• Fecha dia {card.closingDay}</span>}
                                </div>
                              </div>
                            </div>

                            <div className="flex items-center gap-1 shrink-0">
                              {onDeleteChannelExpenses && (
                                <button
                                  type="button"
                                  onClick={() => {
                                    onClose();
                                    onDeleteChannelExpenses({ ...card, isCard: true });
                                  }}
                                  title="Excluir/limpar lançamentos deste cartão (com escolha de escopo)"
                                  className="p-2 rounded-lg text-slate-500 hover:text-rose-600 hover:bg-slate-100 dark:hover:bg-zinc-800"
                                >
                                  <Icons.Receipt className="w-4 h-4" />
                                </button>
                              )}
                              <button
                                type="button"
                                onClick={() => startEditCard(card)}
                                title="Editar"
                                className="p-2 rounded-lg text-slate-500 hover:text-sky-600 hover:bg-slate-100 dark:hover:bg-zinc-800"
                              >
                                <Icons.Edit className="w-4 h-4" />
                              </button>
                              <button
                                type="button"
                                onClick={() => requestDeleteCard(card)}
                                title="Excluir Cartão"
                                className="p-2 rounded-lg text-slate-500 hover:text-rose-600 hover:bg-slate-100 dark:hover:bg-zinc-800"
                              >
                                <Icons.Trash className="w-4 h-4" />
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}
            </div>
          </ModalShell>
        );
      }

      /* ------------------------------------------------------------------ */
      /* Modal: Gerenciar Categorias, Subcategorias e Tags                  */
      /* ------------------------------------------------------------------ */
      function CategoryTagModal({
        isOpen,
        onClose,
        categories = [],
        tags = [],
        expenses = [],
        incomes = [],
        onUpdateCategories,
        onUpdateTags,
        onFilterByTag,
      }) {
        const [activeTab, setActiveTab] = useState('categories'); // 'categories' | 'tags'
        
        // Category creation / edit state
        const [isCreatingCategory, setIsCreatingCategory] = useState(false);
        const [catName, setCatName] = useState('');
        const [catEmoji, setCatEmoji] = useState('📁');
        const [catColor, setCatColor] = useState('indigo');
        const [catInitialSubs, setCatInitialSubs] = useState('');
        const [catFormError, setCatFormError] = useState('');
        
        // Inline subcategory input per category: { [catId]: string }
        const [inlineSubInputs, setInlineSubInputs] = useState({});

        // Tag state
        const [newTagInput, setNewTagInput] = useState('');
        const [tagError, setTagError] = useState('');

        const EMOJI_SUGGESTIONS = ['📁', '🏠', '🍽️', '🚗', '💊', '🎓', '🎉', '📺', '🛍️', '🐶', '👶', '💻', '📈', '🧾', '🏖️', '🎮', '⚡', '🎁', '☕', '🛠️', '✈️', '🐾', '💈', '🌿'];

        useEffect(() => {
          if (!isOpen) return;
          setIsCreatingCategory(false);
          setCatName('');
          setCatEmoji('📁');
          setCatColor('indigo');
          setCatInitialSubs('');
          setCatFormError('');
          setNewTagInput('');
          setTagError('');
          setInlineSubInputs({});
        }, [isOpen]);

        // Handlers for Category
        const handleSaveCategory = (e) => {
          if (e && e.preventDefault) e.preventDefault();
          const trimmed = catName.trim();
          if (!trimmed) {
            setCatFormError('Informe um nome para a categoria.');
            return;
          }
          if (categories.some((c) => (c.name || c.label || '').toLowerCase() === trimmed.toLowerCase())) {
            setCatFormError('Já existe uma categoria com este nome.');
            return;
          }

          const parsedSubs = catInitialSubs
            .split(',')
            .map((s) => s.trim())
            .filter(Boolean);

          const newId = generateId('cat');
          const newCategory = {
            id: newId,
            key: trimmed.toLowerCase().replace(/[\s/\\-]+/g, '_'),
            name: trimmed,
            label: trimmed,
            emoji: catEmoji.trim() || '📁',
            color: catColor || 'indigo',
            subcategories: parsedSubs,
            isCustom: true,
          };

          onUpdateCategories([...categories, newCategory]);
          setCatName('');
          setCatInitialSubs('');
          setIsCreatingCategory(false);
          setCatFormError('');
        };

        const handleDeleteCategory = (cat) => {
          const usageCount = expenses.filter(
            (e) => (e.category || '').toLowerCase() === (cat.key || '').toLowerCase() || (e.category || '').toLowerCase() === (cat.name || '').toLowerCase()
          ).length;

          const msg = usageCount > 0
            ? `A categoria "${cat.name || cat.label}" possui ${usageCount} lançamento(s) associado(s). Deseja realmente excluí-la? Os lançamentos terão sua categoria mantida no histórico.`
            : `Deseja realmente excluir a categoria "${cat.name || cat.label}"?`;

          if (window.confirm(msg)) {
            onUpdateCategories(categories.filter((c) => c.id !== cat.id && c.key !== cat.key));
          }
        };

        const handleAddSubcategory = (catIdOrKey) => {
          const subName = (inlineSubInputs[catIdOrKey] || '').trim();
          if (!subName) return;

          const updated = categories.map((c) => {
            if (c.id === catIdOrKey || c.key === catIdOrKey) {
              const currentSubs = c.subcategories || [];
              if (currentSubs.some((s) => s.toLowerCase() === subName.toLowerCase())) {
                return c;
              }
              return {
                ...c,
                subcategories: [...currentSubs, subName],
              };
            }
            return c;
          });

          onUpdateCategories(updated);
          setInlineSubInputs((p) => ({ ...p, [catIdOrKey]: '' }));
        };

        const handleDeleteSubcategory = (catIdOrKey, subName) => {
          const updated = categories.map((c) => {
            if (c.id === catIdOrKey || c.key === catIdOrKey) {
              return {
                ...c,
                subcategories: (c.subcategories || []).filter((s) => s !== subName),
              };
            }
            return c;
          });
          onUpdateCategories(updated);
        };

        // Handlers for Tags
        const handleAddTag = (e) => {
          if (e && e.preventDefault) e.preventDefault();
          const clean = newTagInput.replace(/^[#,]+/, '').trim();
          if (!clean) {
            setTagError('Digite um nome válido para a tag.');
            return;
          }
          if (tags.some((t) => t.toLowerCase() === clean.toLowerCase())) {
            setTagError('Esta tag já existe na sua lista.');
            return;
          }
          onUpdateTags([...tags, clean]);
          setNewTagInput('');
          setTagError('');
        };

        const handleDeleteTag = (tagName) => {
          if (window.confirm(`Deseja remover a tag "#${tagName}" das tags sugeridas?`)) {
            onUpdateTags(tags.filter((t) => t !== tagName));
          }
        };

        // Compute tag usage frequency
        const tagUsageMap = useMemo(() => {
          const map = {};
          tags.forEach((t) => { map[t.toLowerCase()] = 0; });
          expenses.forEach((e) => {
            (e.tags || []).forEach((t) => {
              const k = String(t).trim().toLowerCase();
              map[k] = (map[k] || 0) + 1;
            });
          });
          incomes.forEach((i) => {
            (i.tags || []).forEach((t) => {
              const k = String(t).trim().toLowerCase();
              map[k] = (map[k] || 0) + 1;
            });
          });
          return map;
        }, [tags, expenses, incomes]);

        return (
          <ModalShell
            isOpen={isOpen}
            onClose={onClose}
            maxWidth="max-w-2xl"
            title="Gerenciar Categorias, Subcategorias & Tags"
            subtitle="Estruture sua organização financeira criando categorias personalizadas e tags para filtros ágeis."
          >
            <div className="space-y-4">
              {/* Tab Selector */}
              <div className="flex border-b border-[#E2E8F0] dark:border-[#27272A] -mx-6 px-6">
                <button
                  type="button"
                  onClick={() => setActiveTab('categories')}
                  className={`pb-2.5 px-4 text-xs sm:text-sm font-bold border-b-2 transition-all flex items-center gap-2 ${
                    activeTab === 'categories'
                      ? 'border-indigo-600 text-indigo-600 dark:border-indigo-400 dark:text-indigo-400'
                      : 'border-transparent text-slate-500 hover:text-slate-900 dark:text-zinc-400 dark:hover:text-zinc-200'
                  }`}
                >
                  <Icons.FolderTree className="w-4 h-4" />
                  <span>Categorias & Subcategorias ({categories.length})</span>
                </button>
                <button
                  type="button"
                  onClick={() => setActiveTab('tags')}
                  className={`pb-2.5 px-4 text-xs sm:text-sm font-bold border-b-2 transition-all flex items-center gap-2 ${
                    activeTab === 'tags'
                      ? 'border-indigo-600 text-indigo-600 dark:border-indigo-400 dark:text-indigo-400'
                      : 'border-transparent text-slate-500 hover:text-slate-900 dark:text-zinc-400 dark:hover:text-zinc-200'
                  }`}
                >
                  <Icons.Tags className="w-4 h-4" />
                  <span>Tags & Marcadores ({tags.length})</span>
                </button>
              </div>

              {/* TAB 1: CATEGORIES & SUBCATEGORIES */}
              {activeTab === 'categories' && (
                <div className="space-y-4">
                  <div className="flex items-center justify-between gap-2">
                    <p className="text-xs text-slate-600 dark:text-zinc-300">
                      Personalize categorias mestras e desdobre em subcategorias para maior precisão nos gastos.
                    </p>
                    {!isCreatingCategory && (
                      <button
                        type="button"
                        onClick={() => setIsCreatingCategory(true)}
                        className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition-all shadow-sm shrink-0"
                      >
                        <Icons.Plus className="w-3.5 h-3.5" /> Nova Categoria
                      </button>
                    )}
                  </div>

                  {/* Create New Category Form */}
                  {isCreatingCategory && (
                    <form onSubmit={handleSaveCategory} className="rounded-2xl border-2 border-indigo-500/30 bg-indigo-50/40 dark:bg-indigo-950/20 p-4 space-y-3 animate-fadeIn">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-bold text-indigo-900 dark:text-indigo-200 flex items-center gap-2">
                          <Icons.Plus className="w-4 h-4 text-indigo-600" /> Criar Nova Categoria
                        </span>
                        <button
                          type="button"
                          onClick={() => setIsCreatingCategory(false)}
                          className="text-slate-400 hover:text-slate-600 text-xs"
                        >
                          Cancelar
                        </button>
                      </div>

                      {catFormError && (
                        <div className="p-2 rounded-lg bg-rose-500/10 text-rose-700 dark:text-rose-400 text-xs font-semibold">
                          {catFormError}
                        </div>
                      )}

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div className="sm:col-span-2">
                          <label className="block text-[11px] font-bold text-slate-700 dark:text-zinc-300 mb-1">
                            Nome da Categoria
                          </label>
                          <input
                            type="text"
                            required
                            autoFocus
                            value={catName}
                            onChange={(e) => setCatName(e.target.value)}
                            placeholder="Ex: Pets, Filhos, Viagens, Casamento..."
                            className="w-full rounded-xl border border-slate-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 px-3 py-2 text-xs font-medium"
                          />
                        </div>

                        <div>
                          <label className="block text-[11px] font-bold text-slate-700 dark:text-zinc-300 mb-1">
                            Cor
                          </label>
                          <select
                            value={catColor}
                            onChange={(e) => setCatColor(e.target.value)}
                            className="w-full rounded-xl border border-slate-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 px-3 py-2 text-xs font-medium"
                          >
                            {COLOR_OPTIONS.map((c) => (
                              <option key={c.key} value={c.key}>{c.label}</option>
                            ))}
                          </select>
                        </div>
                      </div>

                      <div>
                        <label className="block text-[11px] font-bold text-slate-700 dark:text-zinc-300 mb-1">
                          Emoji / Ícone
                        </label>
                        <div className="flex items-center gap-2">
                          <input
                            type="text"
                            value={catEmoji}
                            onChange={(e) => setCatEmoji(e.target.value)}
                            className="w-12 text-center rounded-xl border border-slate-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 py-1.5 text-base"
                          />
                          <div className="flex flex-wrap items-center gap-1 overflow-x-auto py-1">
                            {EMOJI_SUGGESTIONS.map((em, i) => (
                              <button
                                key={i}
                                type="button"
                                onClick={() => setCatEmoji(em)}
                                className={`w-7 h-7 rounded-lg text-sm flex items-center justify-center transition-all ${catEmoji === em ? 'bg-indigo-600 text-white scale-110 shadow-xs' : 'hover:bg-slate-200 dark:hover:bg-zinc-800'}`}
                              >
                                {em}
                              </button>
                            ))}
                          </div>
                        </div>
                      </div>

                      <div>
                        <label className="block text-[11px] font-bold text-slate-700 dark:text-zinc-300 mb-1">
                          Subcategorias Iniciais <span className="text-slate-400 font-normal">(separadas por vírgula)</span>
                        </label>
                        <input
                          type="text"
                          value={catInitialSubs}
                          onChange={(e) => setCatInitialSubs(e.target.value)}
                          placeholder="Ex: Ração, Veterinário, Vacinas, Banho & Tosa"
                          className="w-full rounded-xl border border-slate-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 px-3 py-2 text-xs font-medium"
                        />
                      </div>

                      <div className="flex justify-end gap-2 pt-1">
                        <button
                          type="button"
                          onClick={() => setIsCreatingCategory(false)}
                          className="px-3 py-1.5 rounded-xl border border-slate-300 dark:border-zinc-700 text-xs font-semibold"
                        >
                          Cancelar
                        </button>
                        <button
                          type="submit"
                          className="px-4 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-sm"
                        >
                          ✓ Salvar Categoria
                        </button>
                      </div>
                    </form>
                  )}

                  {/* Categories List */}
                  <div className="space-y-3 max-h-[50vh] overflow-y-auto pr-1">
                    {categories.map((cat) => {
                      const catKeyOrId = cat.id || cat.key;
                      const subs = cat.subcategories || [];
                      const usageCount = expenses.filter(
                        (e) => (e.category || '').toLowerCase() === (cat.key || '').toLowerCase() || (e.category || '').toLowerCase() === (cat.name || '').toLowerCase()
                      ).length;

                      return (
                        <div
                          key={catKeyOrId}
                          className="rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/80 p-3.5 space-y-2.5 transition-all hover:border-slate-300 dark:hover:border-zinc-700 shadow-xs"
                        >
                          <div className="flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2.5">
                              <span className="text-xl w-8 h-8 rounded-xl bg-slate-100 dark:bg-zinc-800 flex items-center justify-center shrink-0">
                                {cat.emoji || '📁'}
                              </span>
                              <div>
                                <h4 className="text-sm font-bold text-slate-900 dark:text-zinc-100 flex items-center gap-2">
                                  {cat.name || cat.label}
                                  {cat.isCustom && (
                                    <span className="px-1.5 py-0.2 rounded text-[10px] font-bold bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300">
                                      Personalizada
                                    </span>
                                  )}
                                </h4>
                                <span className="text-[11px] text-slate-500 dark:text-zinc-400">
                                  {subs.length} subcategoria(s) • {usageCount} lançamento(s) neste mês
                                </span>
                              </div>
                            </div>
                            <div className="flex items-center gap-1">
                              {cat.isCustom && (
                                <button
                                  type="button"
                                  onClick={() => handleDeleteCategory(cat)}
                                  className="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg transition-colors"
                                  title="Excluir categoria"
                                >
                                  <Icons.Trash className="w-3.5 h-3.5" />
                                </button>
                              )}
                            </div>
                          </div>

                          {/* Subcategories list */}
                          <div className="pt-1 border-t border-slate-100 dark:border-zinc-800/80 space-y-2">
                            <div className="flex flex-wrap items-center gap-1.5">
                              {subs.map((sub, sIdx) => (
                                <span
                                  key={sIdx}
                                  className="inline-flex items-center gap-1 px-2 py-0.5 rounded-lg text-xs font-medium bg-slate-100 dark:bg-zinc-800 text-slate-700 dark:text-zinc-300 border border-slate-200/60 dark:border-zinc-700/60"
                                >
                                  {sub}
                                  <button
                                    type="button"
                                    onClick={() => handleDeleteSubcategory(catKeyOrId, sub)}
                                    className="w-3.5 h-3.5 rounded-full hover:bg-slate-200 dark:hover:bg-zinc-700 flex items-center justify-center text-[11px] leading-none text-slate-400 hover:text-rose-600"
                                    title={`Remover subcategoria ${sub}`}
                                  >
                                    ×
                                  </button>
                                </span>
                              ))}
                              {subs.length === 0 && (
                                <span className="text-xs text-slate-400 italic">
                                  Nenhuma subcategoria cadastrada ainda.
                                </span>
                              )}
                            </div>

                            {/* Inline Add Subcategory input */}
                            <div className="flex items-center gap-2 pt-0.5">
                              <input
                                type="text"
                                value={inlineSubInputs[catKeyOrId] || ''}
                                onChange={(e) => setInlineSubInputs({ ...inlineSubInputs, [catKeyOrId]: e.target.value })}
                                onKeyDown={(e) => {
                                  if (e.key === 'Enter') {
                                    e.preventDefault();
                                    handleAddSubcategory(catKeyOrId);
                                  }
                                }}
                                placeholder="+ Nova subcategoria (dê Enter)..."
                                className="rounded-lg border border-slate-200 dark:border-zinc-700 bg-slate-50 dark:bg-zinc-900/60 px-2.5 py-1 text-xs font-medium flex-1 focus:outline-none focus:ring-1 focus:ring-indigo-500"
                              />
                              <button
                                type="button"
                                onClick={() => handleAddSubcategory(catKeyOrId)}
                                className="px-2.5 py-1 rounded-lg bg-slate-200 dark:bg-zinc-800 hover:bg-indigo-600 hover:text-white text-xs font-bold transition-colors text-slate-700 dark:text-zinc-300"
                              >
                                Adicionar
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* TAB 2: TAGS */}
              {activeTab === 'tags' && (
                <div className="space-y-4">
                  <p className="text-xs text-slate-600 dark:text-zinc-300 leading-relaxed">
                    Tags são marcadores transversais que ajudam a etiquetar lançamentos de qualquer categoria (ex: <strong>#Essencial</strong>, <strong>#Viagem</strong>, <strong>#Urgente</strong>, <strong>#Reembolsável</strong>).
                  </p>

                  {/* Add Tag Form */}
                  <form onSubmit={handleAddTag} className="flex items-center gap-2">
                    <div className="relative flex-1">
                      <span className="absolute left-3 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400">#</span>
                      <input
                        type="text"
                        required
                        value={newTagInput}
                        onChange={(e) => setNewTagInput(e.target.value)}
                        placeholder="Nome da nova tag (ex: Reforma, Família, Férias)..."
                        className="w-full rounded-xl border border-slate-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 pl-7 pr-3 py-2 text-xs font-medium"
                      />
                    </div>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-sm shrink-0 flex items-center gap-1.5"
                    >
                      <Icons.Plus className="w-3.5 h-3.5" /> Adicionar Tag
                    </button>
                  </form>
                  {tagError && <p className="text-xs text-rose-600 font-semibold">{tagError}</p>}

                  {/* Tags Cloud / List */}
                  <div className="space-y-2 pt-2">
                    <span className="text-xs font-bold text-slate-700 dark:text-zinc-300 block">
                      Tags Cadastradas ({tags.length})
                    </span>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-[50vh] overflow-y-auto pr-1">
                      {tags.map((tag) => {
                        const count = tagUsageMap[tag.toLowerCase()] || 0;
                        return (
                          <div
                            key={tag}
                            className="flex items-center justify-between p-2.5 rounded-xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/80 hover:border-indigo-400 transition-colors shadow-xs"
                          >
                            <div className="flex items-center gap-2 min-w-0">
                              <span className="w-6 h-6 rounded-lg bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 flex items-center justify-center font-mono font-bold text-xs shrink-0">
                                #
                              </span>
                              <div className="min-w-0">
                                <span className="text-xs font-bold text-slate-800 dark:text-zinc-200 block truncate">
                                  {tag}
                                </span>
                                <span className="text-[10px] text-slate-400 block tabular-nums">
                                  {count} lançamento(s) vinculados
                                </span>
                              </div>
                            </div>

                            <div className="flex items-center gap-1.5 shrink-0">
                              <button
                                type="button"
                                onClick={() => {
                                  onFilterByTag(tag);
                                  onClose();
                                }}
                                className="px-2 py-1 rounded-lg bg-slate-100 dark:bg-zinc-800 hover:bg-indigo-600 hover:text-white text-[11px] font-bold text-slate-600 dark:text-zinc-300 transition-colors"
                                title="Filtrar lançamentos por esta tag"
                              >
                                🔍 Filtrar
                              </button>
                              <button
                                type="button"
                                onClick={() => handleDeleteTag(tag)}
                                className="p-1 text-slate-400 hover:text-rose-600 rounded transition-colors"
                                title="Remover tag"
                              >
                                <Icons.X className="w-3.5 h-3.5" />
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}

              <div className="flex justify-end pt-3 border-t border-[#E2E8F0] dark:border-[#27272A]">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl bg-slate-900 dark:bg-zinc-100 text-white dark:text-zinc-900 text-xs font-bold"
                >
                  Concluir
                </button>
              </div>
            </div>
          </ModalShell>
        );
      }

      /* ------------------------------------------------------------------ */
      /* Modal: Bater Fatura com Fatura Física / Conciliação de Cartão       */
      /* ------------------------------------------------------------------ */
      function InvoiceReconcileModal({
        isOpen,
        onClose,
        cards = [],
        accounts = [],
        expenses = [],
        initialCardId,
        currentMonthIndex,
        currentYear,
        onToggleReconciled,
        onBatchReconciled,
        onOpenNewExpenseForCard,
        onEditExpense,
        onPayInvoice,
      }) {
        if (!isOpen) return null;

        const [selectedCardId, setSelectedCardId] = useState(() => {
          if (initialCardId) {
            const found = (cards || []).find((c) => c.id === initialCardId || c.name === initialCardId);
            if (found) return found.id;
          }
          return (cards && cards.length > 0) ? cards[0].id : '';
        });

        useEffect(() => {
          if (initialCardId) {
            const found = (cards || []).find((c) => c.id === initialCardId || c.name === initialCardId);
            if (found) setSelectedCardId(found.id);
          }
        }, [initialCardId, cards]);

        const targetCard = (cards || []).find((c) => c.id === selectedCardId) || cards[0] || null;

        const cardExpenses = useMemo(() => {
          if (!targetCard) return [];
          return (expenses || []).filter((e) => isExpenseForCard(e, targetCard, cards));
        }, [expenses, targetCard, cards]);

        const [physicalTotalInput, setPhysicalTotalInput] = useState('');
        const [searchQuery, setSearchQuery] = useState('');
        const [filterStatus, setFilterStatus] = useState('all'); // 'all' | 'unreconciled' | 'reconciled'
        const [sortOrder, setSortOrder] = useState('dueDateAsc'); // 'dueDateAsc' | 'order' | 'amountDesc' | 'amountAsc'

        // Math totals
        const totalExpenses = useMemo(() => cardExpenses.reduce((a, b) => a + (Number(b.amount) || 0), 0), [cardExpenses]);
        const reconciledItems = useMemo(() => cardExpenses.filter((e) => e.reconciled), [cardExpenses]);
        const unreconciledItems = useMemo(() => cardExpenses.filter((e) => !e.reconciled), [cardExpenses]);
        const totalReconciled = useMemo(() => reconciledItems.reduce((a, b) => a + (Number(b.amount) || 0), 0), [reconciledItems]);
        const totalUnreconciled = useMemo(() => unreconciledItems.reduce((a, b) => a + (Number(b.amount) || 0), 0), [unreconciledItems]);

        const parsedPhysical = parseMoneyInput(physicalTotalInput);
        const hasPhysical = !Number.isNaN(parsedPhysical) && parsedPhysical > 0;
        const diff = hasPhysical ? roundMoney(totalReconciled - parsedPhysical) : 0;
        const isMatched = hasPhysical && Math.abs(diff) < 0.01;

        // Filtered & Sorted items in modal
        const displayedItems = useMemo(() => {
          const q = searchQuery.trim().toLowerCase();
          const cleanQ = q.replace(',', '.');
          const numQ = parseFloat(cleanQ);

          const list = cardExpenses.filter((e) => {
            const mStatus =
              filterStatus === 'all' ||
              (filterStatus === 'reconciled' && e.reconciled) ||
              (filterStatus === 'unreconciled' && !e.reconciled);

            const mAmount = !Number.isNaN(numQ) && (
              String(e.amount).includes(cleanQ) ||
              (e.amount ? e.amount.toFixed(2).includes(cleanQ) : false)
            );

            const mText =
              !q ||
              (e.description || '').toLowerCase().includes(q) ||
              (e.invoiceName && e.invoiceName.toLowerCase().includes(q)) ||
              (e.legend && e.legend.toLowerCase().includes(q)) ||
              (e.notes && e.notes.toLowerCase().includes(q)) ||
              (e.category || '').toLowerCase().includes(q) ||
              (e.subcategory || '').toLowerCase().includes(q) ||
              (e.tags || []).some((t) => t.toLowerCase().includes(q)) ||
              mAmount;

            return mStatus && mText;
          });

          const copy = [...list];
          if (sortOrder === 'dueDateAsc') {
            copy.sort((a, b) => {
              const da = a.dueDate || '9999-99-99';
              const db = b.dueDate || '9999-99-99';
              return da.localeCompare(db);
            });
          } else if (sortOrder === 'amountDesc') {
            copy.sort((a, b) => b.amount - a.amount);
          } else if (sortOrder === 'amountAsc') {
            copy.sort((a, b) => a.amount - b.amount);
          }
          return copy;
        }, [cardExpenses, searchQuery, filterStatus, sortOrder]);

        const handleSelectAll = (val) => {
          const ids = cardExpenses.map((e) => e.id);
          onBatchReconciled(ids, val);
        };

        const progressPct = totalExpenses > 0 ? Math.min(100, Math.round((totalReconciled / totalExpenses) * 100)) : 0;

        return (
          <ModalShell
            isOpen={isOpen}
            onClose={onClose}
            maxWidth="max-w-4xl"
            title="Conferência de Fatura com a Fatura Física"
            subtitle="Compare cada linha impressa na fatura do cartão com seus lançamentos no sistema e garanta que todos os centavos batam."
          >
            <div className="space-y-4 text-xs sm:text-sm">
              {/* Card selector and Month Header */}
              <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 p-3.5 rounded-2xl bg-slate-50 dark:bg-zinc-900 border border-[#E2E8F0] dark:border-[#27272A]">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-violet-500/10 text-violet-600 dark:text-violet-400 flex items-center justify-center shrink-0">
                    <Icons.CreditCard className="w-5 h-5" />
                  </div>
                  <div>
                    <label className="block text-[11px] font-semibold text-slate-500 dark:text-zinc-400">Cartão para Conferir:</label>
                    <select
                      value={selectedCardId}
                      onChange={(e) => setSelectedCardId(e.target.value)}
                      className="mt-0.5 rounded-lg border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-[#18181B] px-3 py-1.5 text-xs font-bold text-slate-900 dark:text-zinc-100 focus:outline-none focus:ring-2 focus:ring-violet-500"
                    >
                      {cards.map((c) => {
                        const count = expenses.filter((e) => isExpenseForCard(e, c, cards)).length;
                        return (
                          <option key={c.id} value={c.id}>
                            💳 {c.name} ({count} itens neste mês)
                          </option>
                        );
                      })}
                    </select>
                  </div>
                </div>

                {targetCard && (
                  <div className="text-right text-xs">
                    <span className="text-slate-500 dark:text-zinc-400">Competência: <strong>{formatMonthYear(currentMonthIndex, currentYear)}</strong></span>
                    {targetCard.dueDay && (
                      <p className="text-[11px] text-slate-400">Vencimento da fatura: dia {targetCard.dueDay}</p>
                    )}
                  </div>
                )}
              </div>

              {/* Physical Invoice Value Input & Reconciliation Header */}
              <div className="rounded-2xl border border-indigo-200 dark:border-indigo-900/50 bg-indigo-50/40 dark:bg-indigo-950/20 p-4 space-y-3">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div className="space-y-1">
                    <label className="block text-xs font-bold text-indigo-950 dark:text-indigo-200">
                      🧾 Valor Total Impresso na Fatura Física (Boleto / PDF):
                    </label>
                    <div className="flex items-center gap-2">
                      <div className="relative">
                        <span className="absolute left-3 top-1/2 -translate-y-1/2 font-bold text-slate-400 text-xs">R$</span>
                        <input
                          type="text"
                          value={physicalTotalInput}
                          onChange={(e) => setPhysicalTotalInput(e.target.value)}
                          placeholder={totalExpenses > 0 ? totalExpenses.toFixed(2).replace('.', ',') : '0,00'}
                          className="w-44 rounded-xl border border-indigo-300 dark:border-indigo-700 bg-white dark:bg-zinc-900 pl-8 pr-3 py-2 text-sm font-bold tabular-nums shadow-sm"
                        />
                      </div>
                      <button
                        type="button"
                        onClick={() => setPhysicalTotalInput(totalExpenses.toFixed(2).replace('.', ','))}
                        className="px-2.5 py-2 rounded-xl bg-indigo-100 dark:bg-indigo-900/60 hover:bg-indigo-200 text-indigo-700 dark:text-indigo-300 text-xs font-semibold transition-colors"
                        title="Copiar o total calculado dos lançamentos do cartão"
                      >
                        Copiar Total do Sistema ({formatBRL(totalExpenses)})
                      </button>
                    </div>
                  </div>

                  {/* Quick Diff Alert Badge */}
                  {hasPhysical ? (
                    <div className={`p-3 rounded-xl border flex items-center gap-2.5 ${
                      isMatched
                        ? 'bg-emerald-500/15 border-emerald-500/30 text-emerald-800 dark:text-emerald-300'
                        : diff < 0
                        ? 'bg-amber-500/15 border-amber-500/30 text-amber-800 dark:text-amber-300'
                        : 'bg-rose-500/15 border-rose-500/30 text-rose-800 dark:text-rose-300'
                    }`}>
                      <div className="text-xl">{isMatched ? '🎯' : diff < 0 ? '⚠️' : '📈'}</div>
                      <div className="text-xs">
                        {isMatched ? (
                          <>
                            <strong className="block font-bold">Fatura 100% Batida!</strong>
                            <span className="opacity-90">Todos os centavos batem com a fatura física.</span>
                          </>
                        ) : diff < 0 ? (
                          <>
                            <strong className="block font-bold">Faltam {formatBRL(Math.abs(diff))}</strong>
                            <span className="opacity-90">Lançamentos conferidos somam menos que a fatura física.</span>
                          </>
                        ) : (
                          <>
                            <strong className="block font-bold">Passou {formatBRL(diff)}</strong>
                            <span className="opacity-90">Lançamentos conferidos somam mais que a fatura física.</span>
                          </>
                        )}
                      </div>
                    </div>
                  ) : (
                    <p className="text-xs text-slate-500 dark:text-zinc-400 max-w-xs">
                      Dica: Digite o valor que consta no seu boleto para que o sistema aponte automaticamente qualquer centavo de diferença.
                    </p>
                  )}
                </div>

                {/* KPI Summary Cards */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 pt-1 tabular-nums">
                  <div className="p-2.5 rounded-xl bg-white dark:bg-zinc-900 border border-[#E2E8F0] dark:border-[#27272A]">
                    <span className="text-[10px] text-slate-500 block uppercase font-semibold">Total no Sistema</span>
                    <strong className="text-sm font-bold text-slate-900 dark:text-zinc-100">{formatBRL(totalExpenses)}</strong>
                    <span className="text-[10px] text-slate-400 block">{cardExpenses.length} item(ns)</span>
                  </div>
                  <div className="p-2.5 rounded-xl bg-white dark:bg-zinc-900 border border-emerald-500/30 bg-emerald-500/5">
                    <span className="text-[10px] text-emerald-600 dark:text-emerald-400 block uppercase font-semibold">Já Conferido (✓)</span>
                    <strong className="text-sm font-bold text-emerald-600 dark:text-emerald-400">{formatBRL(totalReconciled)}</strong>
                    <span className="text-[10px] text-emerald-600/70 block">{reconciledItems.length} de {cardExpenses.length} ({progressPct}%)</span>
                  </div>
                  <div className="p-2.5 rounded-xl bg-white dark:bg-zinc-900 border border-[#E2E8F0] dark:border-[#27272A]">
                    <span className="text-[10px] text-amber-600 dark:text-amber-400 block uppercase font-semibold">A Conferir (⏳)</span>
                    <strong className="text-sm font-bold text-amber-600 dark:text-amber-400">{formatBRL(totalUnreconciled)}</strong>
                    <span className="text-[10px] text-slate-400 block">{unreconciledItems.length} restante(s)</span>
                  </div>
                  <div className="p-2.5 rounded-xl bg-white dark:bg-zinc-900 border border-[#E2E8F0] dark:border-[#27272A]">
                    <span className="text-[10px] text-slate-500 block uppercase font-semibold">Diferença</span>
                    <strong className={`text-sm font-bold ${
                      hasPhysical
                        ? (isMatched ? 'text-emerald-600' : 'text-rose-600')
                        : 'text-slate-400'
                    }`}>
                      {hasPhysical ? (isMatched ? 'R$ 0,00' : formatBRL(diff)) : '—'}
                    </strong>
                    <span className="text-[10px] text-slate-400 block">{hasPhysical ? (isMatched ? 'Exato' : (diff < 0 ? 'Faltando' : 'Sobra')) : 'Sem valor físico'}</span>
                  </div>
                </div>

                {/* Progress bar */}
                <div className="w-full h-2 rounded-full bg-slate-200 dark:bg-zinc-800 overflow-hidden">
                  <div
                    className={`h-full transition-all duration-300 ${isMatched ? 'bg-emerald-500' : 'bg-indigo-600'}`}
                    style={{ width: `${progressPct}%` }}
                  />
                </div>
              </div>

              {/* Action Toolbar & Filters inside Reconcile Modal */}
              <div className="flex flex-wrap items-center justify-between gap-2.5 pt-1">
                <div className="flex flex-wrap items-center gap-1.5">
                  <button
                    type="button"
                    onClick={() => handleSelectAll(true)}
                    className="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl border border-emerald-500/30 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 text-xs font-semibold transition-colors"
                  >
                    <Icons.CheckCheck className="w-3.5 h-3.5" /> Marcar Todos Conferidos
                  </button>
                  <button
                    type="button"
                    onClick={() => handleSelectAll(false)}
                    className="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl border border-slate-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 hover:bg-slate-100 text-slate-600 dark:text-zinc-300 text-xs font-semibold transition-colors"
                  >
                    Desmarcar Todos
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      if (targetCard) onOpenNewExpenseForCard(targetCard);
                    }}
                    className="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold transition-colors shadow-sm"
                  >
                    <Icons.Plus className="w-3.5 h-3.5" /> + Lançar Gasto da Fatura
                  </button>
                </div>

                {/* Search & Sort inside Modal */}
                <div className="flex flex-wrap items-center gap-2">
                  <div className="relative">
                    <Icons.Search className="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2" />
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="Buscar por nome ou valor (ex: 39,90)..."
                      className="rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-zinc-900 pl-8 pr-2.5 py-1.5 text-xs font-medium w-48 sm:w-56"
                    />
                  </div>
                  <select
                    value={filterStatus}
                    onChange={(e) => setFilterStatus(e.target.value)}
                    className="rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-zinc-900 px-2.5 py-1.5 text-xs font-medium"
                  >
                    <option value="all">Todos ({cardExpenses.length})</option>
                    <option value="unreconciled">A Conferir ({unreconciledItems.length})</option>
                    <option value="reconciled">Conferidos ({reconciledItems.length})</option>
                  </select>
                  <select
                    value={sortOrder}
                    onChange={(e) => setSortOrder(e.target.value)}
                    className="rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-zinc-900 px-2.5 py-1.5 text-xs font-medium"
                  >
                    <option value="dueDateAsc">Data de Vencimento</option>
                    <option value="order">Ordem de Lançamento</option>
                    <option value="amountDesc">Maior Valor</option>
                    <option value="amountAsc">Menor Valor</option>
                  </select>
                </div>
              </div>

              {/* Items List */}
              <div className="rounded-2xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-[#18181B] overflow-hidden shadow-sm max-h-[460px] overflow-y-auto">
                {displayedItems.length === 0 ? (
                  <div className="p-8 text-center space-y-2">
                    <p className="font-semibold text-slate-600 dark:text-zinc-400">Nenhum lançamento encontrado nesta fatura</p>
                    <p className="text-xs text-slate-400">Clique em "+ Lançar Gasto da Fatura" para registrar uma despesa que veio no cartão.</p>
                  </div>
                ) : (
                  <div className="divide-y divide-[#E2E8F0] dark:divide-[#27272A]">
                    {displayedItems.map((item) => {
                      const isRec = Boolean(item.reconciled);
                      return (
                        <div
                          key={item.id}
                          className={`p-3 sm:px-4 flex items-center justify-between gap-3 transition-colors ${
                            isRec ? 'bg-emerald-50/20 dark:bg-emerald-950/10' : 'hover:bg-slate-50 dark:hover:bg-zinc-900/40'
                          }`}
                        >
                          <div className="flex items-center gap-3 min-w-0">
                            {/* Checkbox button */}
                            <button
                              type="button"
                              onClick={() => onToggleReconciled(item.id)}
                              className={`w-7 h-7 rounded-xl border flex items-center justify-center shrink-0 transition-all ${
                                isRec
                                  ? 'bg-emerald-600 border-emerald-600 text-white shadow-sm'
                                  : 'border-slate-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 hover:border-emerald-500'
                              }`}
                              title={isRec ? 'Desmarcar conferência' : 'Marcar como bateu na fatura física'}
                            >
                              {isRec && <Icons.Check className="w-4 h-4 stroke-[3]" />}
                            </button>

                            <div className="min-w-0">
                              <div className="flex flex-wrap items-baseline gap-2">
                                <p className={`text-xs sm:text-sm font-semibold truncate ${isRec ? 'text-slate-900 dark:text-zinc-100' : ''}`}>
                                  {item.description}
                                </p>
                                {item.invoiceName && (
                                  <span className="font-mono text-[10px] font-bold text-indigo-700 dark:text-indigo-300 bg-indigo-50 dark:bg-indigo-950/40 px-1.5 py-0.5 rounded border border-indigo-200 dark:border-indigo-800" title="Nome exato que consta na fatura física">
                                    🧾 {item.invoiceName}
                                  </span>
                                )}
                              </div>
                              {(item.legend || item.notes) && (
                                <p className="text-[11px] text-slate-500 dark:text-zinc-400 italic mt-0.5 flex items-center gap-1">
                                  <span className="opacity-75">💬</span>
                                  <span>{item.legend || item.notes}</span>
                                </p>
                              )}
                              <div className="flex flex-wrap items-center gap-1.5 mt-0.5 text-[11px] text-slate-500 dark:text-zinc-400">
                                {item.dueDate && <span>{formatDateBR(item.dueDate)}</span>}
                                {item.type === 'Parcelado' && (
                                  <span className="font-medium px-1.5 py-0.2 rounded bg-slate-100 dark:bg-zinc-800">
                                    {formatInstallmentBadge(item)}
                                  </span>
                                )}
                                {item.category && <span>• {item.category}{item.subcategory ? ` › ${item.subcategory}` : ''}</span>}
                                {(item.tags || []).map((t) => (
                                  <span key={t} className="text-indigo-600 dark:text-indigo-400">#{t}</span>
                                ))}
                              </div>
                            </div>
                          </div>

                          <div className="flex items-center gap-3 shrink-0">
                            <span className={`text-sm font-bold tabular-nums ${isRec ? 'text-emerald-700 dark:text-emerald-400' : 'text-slate-900 dark:text-zinc-100'}`}>
                              {formatBRL(item.amount)}
                            </span>
                            <button
                              type="button"
                              onClick={() => onEditExpense(item)}
