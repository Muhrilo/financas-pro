      function BudgetTab({ state, setState, kpis, channels }) {
        const b = state.budget || { monthlyLimit: 0, categoryLimits: {} };
        const limit = b.monthlyLimit || 0;
        const total = kpis.totalExpenses;
        const diff = total - limit;
        const pct = limit > 0 ? (total / limit) * 100 : 0;
        const over = limit > 0 && diff > 0;
        const warn = limit > 0 && !over && pct >= 80;
        const now = new Date();
        const isNow = now.getMonth() === state.currentMonthIndex && now.getFullYear() === state.currentYear;
        const daysLeft = isNow ? new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() - now.getDate() + 1 : null;
        const setB = (patch) => setState((p) => ({ ...p, budget: { categoryLimits: {}, ...(p.budget || {}), ...patch } }));

        const byCat = {};
        state.expenses.forEach((e) => {
          const k = normalizeCategoryKey(e.category || guessCategory(e.description));
          byCat[k] = (byCat[k] || 0) + e.amount;
        });
        const catRows = CATS.map((c) => ({ ...c, spent: byCat[c.key] || 0, lim: (b.categoryLimits || {})[c.key] || 0 }))
          .filter((c) => c.spent > 0 || c.lim > 0)
          .sort((a, c) => c.spent - a.spent);
        const cards = channels.filter((c) => c.isCard !== false && !c.isSettled);

        const alerts = [];
        if (over) alerts.push({ rose: true, t: `Os gastos passaram ${formatBRL(diff)} do limite mensal.` });
        else if (warn) alerts.push({ t: `Você já usou ${formatPercent(pct, 0)} do limite do mês.` });
        cards.forEach((c) => {
          const used = c.unpaidTotalDebt;
          if (c.limit > 0 && used > c.limit) alerts.push({ rose: true, t: `${c.name}: passou ${formatBRL(used - c.limit)} do limite do cartão.` });
          else if (c.limit > 0 && used / c.limit >= 0.8) alerts.push({ t: `${c.name}: ${formatPercent((used / c.limit) * 100, 0)} do limite já comprometido.` });
          if (isNow && c.dueDay && c.pending > 0) {
            const diff = c.dueDay - now.getDate();
            if (diff < 0) alerts.push({ rose: true, t: `⚠️ Fatura ${c.name} VENCEU há ${Math.abs(diff)} dia(s) (${formatBRL(c.pending)}).` });
            else if (diff === 0) alerts.push({ rose: true, t: `⚡ Fatura ${c.name} VENCE HOJE (${formatBRL(c.pending)})!` });
            else if (diff <= 3) alerts.push({ t: `Fatura ${c.name} vence em ${diff}d (${formatBRL(c.pending)}).` });
          }
          if (isNow && c.closingDay) {
            const diffClose = c.closingDay - now.getDate();
            if (diffClose >= 0 && diffClose <= 3) {
              alerts.push({ t: `Fatura ${c.name} fecha ${diffClose === 0 ? 'hoje' : diffClose === 1 ? 'amanhã' : `em ${diffClose} dias`}.` });
            }
          }
        });
        catRows.forEach((c) => { if (c.lim > 0 && c.spent > c.lim) alerts.push({ rose: true, t: `${c.label}: passou ${formatBRL(c.spent - c.lim)} do limite da categoria.` }); });

        const card = 'rounded-2xl border border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-[#18181B] p-4 sm:p-5';
        return (
          <div className="space-y-5">
            <section className={`rounded-2xl border p-5 ${over ? 'border-rose-500/40 bg-rose-500/5' : warn ? 'border-amber-500/40 bg-amber-500/5' : 'border-emerald-500/30 bg-emerald-500/5'}`}>
              <div className="flex flex-wrap items-start justify-between gap-3">
                <div>
                  <p className="text-xs uppercase tracking-wider opacity-70">Limite de gastos do mês</p>
                  <p className="text-2xl sm:text-3xl font-extrabold tabular-nums mt-1">
                    {limit <= 0 ? 'Defina um limite' : over ? `⚠️ Passou ${formatBRL(diff)}` : warn ? `🟡 Sobram ${formatBRL(-diff)}` : `✅ Sobram ${formatBRL(-diff)}`}
                  </p>
                  <p className="text-sm mt-1 opacity-80 tabular-nums">
                    {limit > 0 ? `Gasto previsto ${formatBRL(total)} de ${formatBRL(limit)} (${formatPercent(pct, 0)})` : 'Digite um valor ao lado para acompanhar.'}
                  </p>
                  {limit > 0 && !over && daysLeft && <p className="text-sm mt-1 font-semibold tabular-nums">Pode gastar até {formatBRL(Math.max(0, -diff) / daysLeft)} por dia até o fim do mês.</p>}
                </div>
                <label className="text-xs font-medium">Meu limite mensal<div className="mt-1"><MoneyInput value={limit} onChange={(v) => setB({ monthlyLimit: v })} placeholder="R$ 0" /></div></label>
              </div>
              {limit > 0 && <div className="mt-4"><Bar pct={pct} over={over} warn={warn} /></div>}
            </section>

            {alerts.length > 0 && (
              <section className={card}>
                <h2 className="text-sm font-bold mb-2">Atenção agora</h2>
                <ul className="space-y-1.5">
                  {alerts.slice(0, 4).map((a, i) => (
                    <li key={i} className={`text-sm rounded-lg px-3 py-2 ${a.rose ? 'bg-rose-500/10 text-rose-700 dark:text-rose-300' : 'bg-amber-500/10 text-amber-800 dark:text-amber-300'}`}>{a.rose ? '🔴' : '🟡'} {a.t}</li>
                  ))}
                </ul>
                {alerts.length > 4 && <p className="text-xs opacity-60 mt-2">+{alerts.length - 4} avisos menos urgentes.</p>}
              </section>
            )}

            <section className={card}>
              <h2 className="text-sm font-bold mb-3">Cartões: limite, fechamento e vencimento</h2>
              {cards.length === 0 && <p className="text-sm opacity-70">Nenhum cartão ativo.</p>}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {cards.map((c) => {
                  const used = c.unpaidTotalDebt, av = c.limit - used, p = c.limit > 0 ? (used / c.limit) * 100 : 0;
                  const best = c.closingDay ? (c.closingDay % 31) + 1 : null;
                  return (
                    <div key={c.id} className="rounded-xl border border-[#E2E8F0] dark:border-[#27272A] p-3.5 space-y-2">
                      <div className="flex justify-between items-baseline"><strong className="text-sm">{c.name}</strong><span className="text-xs tabular-nums opacity-70">Fatura {formatBRL(c.pending)}</span></div>
                      {c.limit > 0 ? (
                        <>
                          <Bar pct={p} over={p > 100} warn={p >= 80} />
                          <p className="text-xs tabular-nums">{av >= 0 ? `Disponível ${formatBRL(av)}` : `🔴 Estourou ${formatBRL(-av)}`} · comprometido {formatBRL(used)} de {formatBRL(c.limit)}</p>
                        </>
                      ) : <p className="text-xs opacity-60">Sem limite cadastrado. Defina em Gerenciar cartões.</p>}
                      <p className="text-xs opacity-80">
                        {c.closingDay ? `Fecha dia ${c.closingDay}${isNow ? ` (${(() => {
                          const diff = c.closingDay - now.getDate();
                          return diff < 0 ? `fechou há ${Math.abs(diff)}d` : diff === 0 ? 'fecha hoje' : diff === 1 ? 'fecha amanhã' : `em ${diff} dias`;
                        })()})` : ''}` : 'Fechamento não definido'}
                        {c.dueDay ? ` · Vence dia ${c.dueDay}${isNow ? ` (${(() => {
                          const diff = c.dueDay - now.getDate();
                          return diff < 0 ? `venceu há ${Math.abs(diff)}d ⚠️` : diff === 0 ? 'vence hoje ⚡' : diff === 1 ? 'vence amanhã' : `em ${diff} dias`;
                        })()})` : ''}` : ''}
                      </p>
                      {best && <p className="text-[11px] opacity-60">Melhor dia para comprar: dia {best} (a fatura demora mais para vencer).</p>}
                    </div>
                  );
                })}
              </div>
              <p className="text-[11px] opacity-60 mt-3">Comprometido = fatura em aberto + parcelas futuras ainda não pagas.</p>
            </section>

            <section className={card}>
              <h2 className="text-sm font-bold mb-3">Gastos por categoria</h2>
              {catRows.length === 0 ? (
                <p className="text-xs opacity-70">Nenhum gasto cadastrado ainda neste mês.</p>
              ) : (
                <div className="space-y-3">
                  {catRows.map((c) => {
                    const o = c.lim > 0 && c.spent > c.lim, w = c.lim > 0 && !o && c.spent / c.lim >= 0.8;
                    return (
                      <div key={c.key} className="space-y-1.5">
                        <div className="flex items-center justify-between gap-2">
                          <span className="text-sm font-medium">{c.emoji} {c.label}</span>
                          <span className="flex items-center gap-2 text-xs tabular-nums">
                            <strong>{formatBRL(c.spent)}</strong>
                            <span className="opacity-60">{total > 0 ? formatPercent((c.spent / total) * 100, 0) : ''}</span>
                            <MoneyInput value={c.lim} onChange={(v) => setB({ categoryLimits: { ...(b.categoryLimits || {}), [c.key]: v } })} />
                          </span>
                        </div>
                        {c.lim > 0 && <><Bar pct={(c.spent / c.lim) * 100} over={o} warn={w} /><p className={`text-[11px] tabular-nums ${o ? 'text-rose-600 dark:text-rose-400 font-semibold' : 'opacity-60'}`}>{o ? `🔴 Passou ${formatBRL(c.spent - c.lim)}` : `Restam ${formatBRL(c.lim - c.spent)}`}</p></>}
                      </div>
                    );
                  })}
                </div>
              )}
              <p className="text-[11px] opacity-60 mt-3">A categoria é sugerida automaticamente pela descrição; você pode trocar ao editar o gasto.</p>
            </section>
          </div>
        );
      }

      /* ------------------------------------------------------------------ */
      /* Aplicação Principal                                                */
      /* ------------------------------------------------------------------ */
      const backupCorruptState = (raw) => {
        try {
          if (raw) localStorage.setItem('financaspro_corrupt_backup_' + Date.now(), raw);
        } catch {}
      };

      function App() {
        const [rawState, setRawState] = useState(() => {
          try {
            let raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) {
              for (const key of LEGACY_KEYS) {
                raw = localStorage.getItem(key);
                if (raw) break;
              }
            }
            if (!raw) return createSeedState();
            const parsed = JSON.parse(raw);
            if (!parsed || !Array.isArray(parsed.incomes) || !Array.isArray(parsed.expenses)) {
              backupCorruptState(raw);
              return createSeedState();
            }
            const { accounts, cards, paymentMethods } = normalizeFinancialEntities(parsed);
            const rawCats = Array.isArray(parsed.categories) && parsed.categories.length > 0
              ? parsed.categories
              : DEFAULT_CATEGORIES.map((c) => ({ ...c, subcategories: [...c.subcategories] }));
            const rawTags = Array.isArray(parsed.tags) && parsed.tags.length > 0
              ? parsed.tags
              : [...DEFAULT_TAGS];
            return {
              ...createSeedState(),
              ...parsed,
              accounts,
              cards,
              paymentMethods,
              categories: rawCats,
              tags: rawTags,
              invoiceSettlements: Array.isArray(parsed.invoiceSettlements) ? parsed.invoiceSettlements : [],
              expenses: parsed.expenses.map((e) => normalizeExpenseEntity(e, accounts, cards)),
            };
          } catch {
            try { backupCorruptState(localStorage.getItem(STORAGE_KEY)); } catch {}
            return createSeedState();
          }
        });

        const [theme, setTheme] = useState(() => {
          try {
            return localStorage.getItem(THEME_KEY) || 'light';
          } catch {
            return 'light';
          }
        });

        const [activeTab, setActiveTab] = useState('dashboard');
        const [toasts, setToasts] = useState([]);
        const [searchQuery, setSearchQuery] = useState('');
        const [filterMethod, setFilterMethod] = useState('Todos');
        const [filterType, setFilterType] = useState('Todos');
        const [filterStatus, setFilterStatus] = useState('Todos');
        const [filterCategory, setFilterCategory] = useState('Todos');
        const [filterSubcategory, setFilterSubcategory] = useState('Todos');
        const [filterTag, setFilterTag] = useState('Todos');
        const [filterReconciled, setFilterReconciled] = useState('Todos'); // 'Todos' | 'reconciled' | 'unreconciled'
        const [hidePaid, setHidePaid] = useState(false);
        const [sortBy, setSortBy] = useState('order'); // Default: 'order' (Ordem de lançamento)
        const [reconcileModal, setReconcileModal] = useState({ open: false, cardId: null });
        const [inlineIncomeId, setInlineIncomeId] = useState(null);
        const [inlineIncomeVal, setInlineIncomeVal] = useState('');
        const [dataMenuOpen, setDataMenuOpen] = useState(false);

        const [payConfirmModal, setPayConfirmModal] = useState({ open: false, item: null });
        const [payInvoiceModal, setPayInvoiceModal] = useState({ open: false, channel: null });
        const [expenseModal, setExpenseModal] = useState({ open: false, item: null, initialDueDate: null });
        const [incomeModal, setIncomeModal] = useState({ open: false, item: null });
        const [investModal, setInvestModal] = useState({ open: false, item: null });
        const [pmModalOpen, setPmModalOpen] = useState(false);
        const [categoryTagModalOpen, setCategoryTagModalOpen] = useState(false);
        const [settleCardTarget, setSettleCardTarget] = useState(null);
        const [turnMonthOpen, setTurnMonthOpen] = useState(false);
        const [resetOpen, setResetOpen] = useState(false);
        const [clearAllOpen, setClearAllOpen] = useState(false);
        const [historyOpen, setHistoryOpen] = useState(false);
        const [sheetsModalOpen, setSheetsModalOpen] = useState(false);
        const [isSyncingSheets, setIsSyncingSheets] = useState(false);
        const [sheetsConfig, setSheetsConfig] = useState(() => {
          try {
            const raw = localStorage.getItem(SHEETS_CONFIG_KEY);
            return raw ? JSON.parse(raw) : { url: '', autoSync: false, lastSync: null };
          } catch {
            return { url: '', autoSync: false, lastSync: null };
          }
        });

        useEffect(() => {
          try {
            localStorage.setItem(SHEETS_CONFIG_KEY, JSON.stringify(sheetsConfig));
          } catch {}
        }, [sheetsConfig]);

        const [shortcutsHelpOpen, setShortcutsHelpOpen] = useState(false);
        const [monthSyncDismissed, setMonthSyncDismissed] = useState(false);
        const [pwaInstallModalOpen, setPwaInstallModalOpen] = useState(false);
        const [deferredPrompt, setDeferredPrompt] = useState(null);
        const [isInstalledApp, setIsInstalledApp] = useState(() => {
          if (typeof window === 'undefined') return false;
          return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
        });

        const isIos = useMemo(() => {
          if (typeof window === 'undefined') return false;
          const ua = window.navigator.userAgent || '';
          return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        }, []);

        useEffect(() => {
          const handleBeforeInstall = (e) => {
            e.preventDefault();
            setDeferredPrompt(e);
          };
          const handleAppInstalled = () => {
            setIsInstalledApp(true);
            setDeferredPrompt(null);
            addToast('FinançasPro instalado na tela de início com sucesso!');
          };
          window.addEventListener('beforeinstallprompt', handleBeforeInstall);
          window.addEventListener('appinstalled', handleAppInstalled);
          return () => {
            window.removeEventListener('beforeinstallprompt', handleBeforeInstall);
            window.removeEventListener('appinstalled', handleAppInstalled);
          };
        }, []);

        const handleNativeInstall = () => {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choice) => {
              if (choice && choice.outcome === 'accepted') {
                setIsInstalledApp(true);
                setDeferredPrompt(null);
                setPwaInstallModalOpen(false);
                addToast('Instalando FinançasPro...');
              }
            });
          } else {
            setPwaInstallModalOpen(true);
          }
        };

        const fileRef = useRef(null);
        const csvFileRef = useRef(null);
        const dataMenuRef = useRef(null);

        const calendarDeltaMonths = useMemo(() => {
          const now = new Date();
          const nowAbs = now.getFullYear() * 12 + now.getMonth();
          const curAbs = rawState.currentYear * 12 + rawState.currentMonthIndex;
          return Math.max(0, nowAbs - curAbs);
        }, [rawState.currentMonthIndex, rawState.currentYear]);

        const calendarSyncInfo = useMemo(() => {
          if (monthSyncDismissed || calendarDeltaMonths <= 0) return null;
          const now = new Date();
          return {
            deltaMonths: calendarDeltaMonths,
            fromLabel: formatMonthYear(rawState.currentMonthIndex, rawState.currentYear),
            toLabel: formatMonthYear(now.getMonth(), now.getFullYear()),
          };
        }, [rawState.currentMonthIndex, rawState.currentYear, monthSyncDismissed, calendarDeltaMonths]);

        const handleBatchSyncToToday = () => {
          if (calendarDeltaMonths <= 0) return;
          const now = new Date();
          const toLabel = formatMonthYear(now.getMonth(), now.getFullYear());
          const count = calendarDeltaMonths;
          try { localStorage.setItem('financaspro_backup_pre_batch_turn', JSON.stringify(rawState)); } catch {}
          setRawState((p) => batchAdvanceMonthsState(p, count));
          setViewOffset(0);
          setMonthSyncDismissed(true);
          addToast(
            'Sincronização concluída com sucesso! 🚀',
            `Avançado ${count} mês(es) até ${toLabel}. Despesas fixas e parcelas pendentes foram acumuladas no histórico e passivo.`
          );
        };

        const handleDismissSync = () => {
          setMonthSyncDismissed(true);
        };

        const availableCategories = rawState.categories && rawState.categories.length > 0 ? rawState.categories : DEFAULT_CATEGORIES;
        const availableTags = Array.isArray(rawState.tags) && rawState.tags.length > 0 ? rawState.tags : DEFAULT_TAGS;

        const handleUpdateCategories = (newCats) => {
          setRawState((p) => ({ ...p, categories: newCats }));
          addToast('Categorias e subcategorias salvas com sucesso!');
        };

        const handleUpdateTags = (newTags) => {
          setRawState((p) => ({ ...p, tags: newTags }));
          addToast('Tags salvas com sucesso!');
        };

        const handleFilterByTag = (tag) => {
          setActiveTab('expenses');
          setFilterTag(tag);
          addToast(`Filtrando por #${tag}`);
        };

        const handleToggleExpenseReconciled = (id) => {
          setRawState((p) => {
            let nextVal = false;
            const updated = (p.expenses || []).map((e) => {
              if (e.id === id || e.originalId === id) {
                nextVal = !e.reconciled;
                return { ...e, reconciled: nextVal };
              }
              return e;
            });
            return { ...p, expenses: updated };
          });
        };

        const handleBatchExpenseReconciled = (ids, value) => {
          const idSet = new Set(ids);
          setRawState((p) => ({
            ...p,
            expenses: (p.expenses || []).map((e) => {
              if (idSet.has(e.id) || idSet.has(e.originalId)) {
                return { ...e, reconciled: Boolean(value) };
              }
              return e;
            }),
          }));
        };

        useEffect(() => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(rawState));
          } catch (err) {
            console.error('Falha ao persistir no localStorage:', err);
            if (err && (err.name === 'QuotaExceededError' || err.name === 'NS_ERROR_DOM_QUOTA_REACHED')) {
              addToast('Atenção: Limite do armazenamento local atingido!', 'Exporte um backup (.JSON) para proteger seus lançamentos.');
            }
          }
        }, [rawState]);

        // Sincronização multi-aba automática e instantânea
        useEffect(() => {
          const handleStorageChange = (e) => {
            if (e.key === STORAGE_KEY && e.newValue) {
              try {
                const parsed = JSON.parse(e.newValue);
                if (parsed && Array.isArray(parsed.expenses)) {
                  const normAccounts = parsed.accounts || DEFAULT_ACCOUNTS;
                  const normCards = parsed.cards || DEFAULT_CARDS;
                  setRawState({
                    ...parsed,
                    accounts: normAccounts,
                    cards: normCards,
                    expenses: parsed.expenses.map((exp) => normalizeExpenseEntity(exp, normAccounts, normCards)),
                  });
                  addToast('Dados sincronizados com outra aba! 🔄');
                }
              } catch (err) {
                console.error('Falha ao sincronizar dados entre abas:', err);
              }
            }
          };

          window.addEventListener('storage', handleStorageChange);
          return () => window.removeEventListener('storage', handleStorageChange);
        }, []);

        // Atalhos de Teclado Globais de Acessibilidade, Produtividade e Navegação
        useEffect(() => {
          const handleKeyDown = (e) => {
            const active = document.activeElement;
            const isInput = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT' || active.isContentEditable);

            if (e.key === 'Escape') {
              setDataMenuOpen(false);
              setShortcutsHelpOpen(false);
              setExpenseModal({ open: false, item: null });
              setIncomeModal({ open: false, item: null });
              setInvestModal({ open: false, item: null });
              setAccountModalOpen(false);
              setCardModalOpen(false);
              setPayInvoiceModalOpen(false);
              setTurnMonthOpen(false);
              setResetOpen(false);
              setClearAllOpen(false);
              setHistoryOpen(false);
              setSheetsModalOpen(false);
              setDelTarget(null);
              return;
            }

            if (isInput) return;

            // Suporte completo à rolagem com setas do teclado (ArrowUp / ArrowDown / PageUp / PageDown)
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'PageDown' || e.key === 'PageUp' || e.key === 'Home' || e.key === 'End') {
              const openModalBody = document.querySelector('[role="dialog"] .overflow-y-auto');
              const targetContainer = openModalBody || window;

              const isDown = e.key === 'ArrowDown' || e.key === 'PageDown';
              const isPage = e.key === 'PageDown' || e.key === 'PageUp';
              const scrollStep = isPage ? (openModalBody ? openModalBody.clientHeight * 0.75 : window.innerHeight * 0.75) : 120;
              const delta = isDown ? scrollStep : -scrollStep;

              e.preventDefault();
              if (e.key === 'Home') {
                targetContainer.scrollTo({ top: 0, behavior: 'smooth' });
              } else if (e.key === 'End') {
                targetContainer.scrollTo({ top: openModalBody ? openModalBody.scrollHeight : document.body.scrollHeight, behavior: 'smooth' });
              } else {
                targetContainer.scrollBy({ top: delta, behavior: 'smooth' });
              }
              return;
            }

            // Setas Esquerda/Direita para navegar competência de mês
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
              const hasOpenModal = !!document.querySelector('[role="dialog"]');
              const scrollableX = active && active.closest && active.closest('.overflow-x-auto');
              if (!hasOpenModal && (!scrollableX || scrollableX.scrollWidth <= scrollableX.clientWidth)) {
                e.preventDefault();
                if (e.key === 'ArrowLeft') {
                  setViewOffset((v) => Math.max(-24, v - 1));
                } else {
                  setViewOffset((v) => Math.min(24, v + 1));
                }
                return;
              }
            }

            if (e.key === 'n' || e.key === 'N' || e.key === 'd' || e.key === 'D') {
              e.preventDefault();
              setExpenseModal({ open: true, item: null });
            } else if (e.key === 'r' || e.key === 'R') {
              e.preventDefault();
              setIncomeModal({ open: true, item: null });
            } else if (e.key === 'v' || e.key === 'V') {
              e.preventDefault();
              setTurnMonthOpen(true);
            } else if (e.key === '1') {
              e.preventDefault();
              setActiveTab('dashboard');
            } else if (e.key === '2') {
              e.preventDefault();
              setActiveTab('expenses');
            } else if (e.key === '3') {
              e.preventDefault();
              setActiveTab('incomes');
            } else if (e.key === '4') {
              e.preventDefault();
              setActiveTab('budget');
            } else if (e.key === '?' || (e.shiftKey && e.key === '/')) {
              e.preventDefault();
              setShortcutsHelpOpen((prev) => !prev);
            }
          };

          window.addEventListener('keydown', handleKeyDown, { passive: false });
          return () => window.removeEventListener('keydown', handleKeyDown);
        }, []);

        const [viewOffset, setViewOffset] = useState(0);
        const [delTarget, setDelTarget] = useState(null);
        const [batchDelTarget, setBatchDelTarget] = useState(null);
        const [channelDelTarget, setChannelDelTarget] = useState(null);
        const [selectedExpenseIds, setSelectedExpenseIds] = useState([]);
        const blockedRef = useRef(false);

        useEffect(() => {
          setSelectedExpenseIds([]);
        }, [viewOffset, activeTab]);
        const curAbs = rawState.currentYear * 12 + rawState.currentMonthIndex;
        const viewAbs = curAbs + viewOffset;

        const state = useMemo(() => {
          const m = getNextMonthYear(rawState.currentMonthIndex, rawState.currentYear, viewOffset);
          const accounts = rawState.accounts || [];
          const cards = rawState.cards || [];
          const expenses = [];

          for (const rawE of rawState.expenses) {
            const e = normalizeExpenseEntity(rawE, accounts, cards);
            if (!activeIn(e, viewAbs)) continue;

            const baseAbs = getExpenseBaseAbs(e, rawState.currentMonthIndex, rawState.currentYear);

            if (e.type === 'Esporádico') {
              if (viewAbs === baseAbs) {
                expenses.push({ ...e });
              } else if (viewAbs > baseAbs && e.status === 'Pendente') {
                const overdueMonths = viewAbs - baseAbs;
                const originLabel = formatMonthYear(baseAbs % 12, Math.floor(baseAbs / 12));
                expenses.push({
                  ...e,
                  isOverdueCarryover: true,
                  overdueMonths,
                  originMonthLabel: originLabel,
                });
              }
            } else if (e.type === 'Parcelado') {
              const currentInst = Number(e.currentInstallment) || 1;
              const totalInst = Number(e.totalInstallments) || 1;

              if (viewAbs < baseAbs) {
                continue;
              }

              const delta = viewAbs - baseAbs;
              const instInView = currentInst + delta;

              if (instInView <= totalInst) {
                const currentDueDay = e.dueDate ? e.dueDate.split('-')[2] : '10';
                const ym = `${m.year}-${String(m.monthIndex + 1).padStart(2, '0')}`;
                const thisDueDate = `${ym}-${String(currentDueDay).padStart(2, '0')}`;

                let st = 'Pendente';
                if (viewAbs === baseAbs) {
                  st = e.status;
                }

                if (viewAbs > baseAbs && e.status === 'Pendente') {
                  const originLabel = formatMonthYear(baseAbs % 12, Math.floor(baseAbs / 12));
                  expenses.push({
                    ...e,
                    id: `${e.id}-carry-${baseAbs}`,
                    originalId: e.id,
                    description: `${e.description} (Parc. ${currentInst}/${totalInst} em Atraso)`,
                    isOverdueCarryover: true,
                    originMonthLabel: originLabel,
                    status: 'Pendente',
                  });
                }

                expenses.push({
                  ...e,
                  currentInstallment: instInView,
                  status: st,
                  dueDate: thisDueDate,
                });
              } else if (e.status === 'Pendente' && viewAbs > baseAbs) {
                const originLabel = formatMonthYear(baseAbs % 12, Math.floor(baseAbs / 12));
                expenses.push({
                  ...e,
                  id: `${e.id}-carry-${baseAbs}`,
                  originalId: e.id,
                  description: `${e.description} (Vencido)`,
                  isOverdueCarryover: true,
                  originMonthLabel: originLabel,
                  status: 'Pendente',
                });
              }
            } else if (e.type === 'Fixo') {
              if (viewAbs >= baseAbs) {
                const currentDueDay = e.dueDate ? e.dueDate.split('-')[2] : '10';
                const ym = `${m.year}-${String(m.monthIndex + 1).padStart(2, '0')}`;
                const thisDueDate = `${ym}-${String(currentDueDay).padStart(2, '0')}`;

                let st = 'Pendente';
                if (viewAbs === baseAbs) st = e.status;
                else if (viewAbs < baseAbs) st = 'Pago';

                if (viewAbs > baseAbs && e.status === 'Pendente') {
                  const originLabel = formatMonthYear(baseAbs % 12, Math.floor(baseAbs / 12));
                  expenses.push({
                    ...e,
                    id: `${e.id}-carry-${baseAbs}`,
                    originalId: e.id,
                    description: `${e.description} (Vencido)`,
                    isOverdueCarryover: true,
                    originMonthLabel: originLabel,
                    status: 'Pendente',
                  });
                }

                expenses.push({
                  ...e,
                  status: st,
                  dueDate: thisDueDate,
                });
              }
            }
          }

          const incomes = rawState.incomes
            .filter((i) => activeIn(i, viewAbs))
            .map((i) => (viewOffset === 0 ? i : { ...i, realizedAmount: i.expectedAmount }));

          const paymentMethods = buildPaymentMethodsView(accounts, cards);

          return {
            ...rawState,
            currentMonthIndex: m.monthIndex,
            currentYear: m.year,
            accounts,
            cards,
            paymentMethods,
            expenses,
            incomes,
            investments: rawState.investments.map((i) => ({ ...i, contributedThisMonth: false })),
          };
        }, [rawState, viewOffset]);

        const setState = (fn) => {
          setRawState(fn);
        };

        const applyDelete = (kind, item, scope) => {
          const key = kind === 'expense' ? 'expenses' : 'incomes';
          const targetId = item.originalId || item.id;
          const snap = { expenses: rawState.expenses, incomes: rawState.incomes };
          setRawState((p) => ({
            ...p,
            [key]:
              scope === 'one'
                ? p[key].map((x) => (x.id === targetId ? { ...x, skip: [...(x.skip || []).filter((s) => s !== viewAbs), viewAbs] } : x))
                : scope === 'from'
                ? p[key].map((x) => (x.id === targetId ? { ...x, endAbs: viewAbs - 1 } : x))
                : p[key].filter((x) => x.id !== targetId),
          }));
          setDelTarget(null);
          setSelectedExpenseIds((prev) => prev.filter((id) => id !== item.id && id !== targetId));
          addToast(
            kind === 'expense' ? 'Gasto excluído' : 'Renda excluída',
            `${item.description || item.name} (${scope === 'one' ? 'só este mês' : scope === 'from' ? 'deste mês em diante' : 'todos os meses'})`,
            () => setRawState((p) => ({ ...p, ...snap }))
          );
        };

        const askDelete = (kind, item) => {
          const targetItem = item.originalId ? { ...item, id: item.originalId } : item;
          setDelTarget({ kind, item: targetItem });
        };

        const applyBatchDelete = (targetItems, scope) => {
          if (!targetItems || targetItems.length === 0) return;
          const targetIds = new Set(targetItems.map((item) => item.originalId || item.id));
          const snap = { expenses: rawState.expenses };

          setRawState((p) => {
            let updated;
            if (scope === 'one') {
              updated = p.expenses.map((x) => {
                if (targetIds.has(x.id)) {
                  return { ...x, skip: [...(x.skip || []).filter((s) => s !== viewAbs), viewAbs] };
                }
                return x;
              });
            } else if (scope === 'from') {
              updated = p.expenses.map((x) => {
                if (targetIds.has(x.id)) {
                  return { ...x, endAbs: viewAbs - 1 };
                }
                return x;
              });
            } else {
              updated = p.expenses.filter((x) => !targetIds.has(x.id));
            }
            return { ...p, expenses: updated };
          });

          const count = targetItems.length;
          setBatchDelTarget(null);
          setSelectedExpenseIds([]);
          addToast(
            `${count} despesa(s) excluída(s)`,
            scope === 'one'
              ? 'Removidas somente na competência deste mês'
              : scope === 'from'
              ? 'Encerradas a partir deste mês'
              : 'Excluídas definitivamente de todo o histórico',
            () => setRawState((p) => ({ ...p, ...snap }))
          );
        };

        const applyChannelDelete = (channel, scope) => {
          if (!channel) return;
          const isMatch = (e) => {
            if (channel.isCard !== false) {
              return isExpenseForCard(e, channel, rawState.cards || []);
            } else {
              return isExpenseForAccount(e, channel, rawState.accounts || []);
            }
          };

          const snap = { expenses: rawState.expenses };
          setRawState((p) => {
            let updated;
            if (scope === 'one') {
              updated = p.expenses.map((x) => {
                if (isMatch(x) && activeIn(x, viewAbs)) {
                  return { ...x, skip: [...(x.skip || []).filter((s) => s !== viewAbs), viewAbs] };
                }
                return x;
              });
            } else if (scope === 'from') {
              updated = p.expenses.map((x) => {
                if (isMatch(x)) {
                  return { ...x, endAbs: viewAbs - 1 };
                }
                return x;
              });
            } else {
              updated = p.expenses.filter((x) => !isMatch(x));
            }
            return { ...p, expenses: updated };
          });

          setChannelDelTarget(null);
          setSelectedExpenseIds([]);
          addToast(
            'Lançamentos excluídos',
            `Lançamentos de "${channel.name}" processados (${
              scope === 'one' ? 'só este mês' : scope === 'from' ? 'deste mês em diante' : 'todos os meses'
            })`,
            () => setRawState((p) => ({ ...p, ...snap }))
          );
        };

        useEffect(() => {
          let raf = 0;
          let uid = 0;
          const linkLabels = () => {
            document.querySelectorAll('label:not([for])').forEach((lb) => {
              if (lb.querySelector('input,select,textarea')) return;
              let sib = lb.nextElementSibling;
              while (sib) {
                if (sib.tagName === 'LABEL' || (!sib.matches('input,select,textarea') && sib.querySelector('label'))) break;
                const ctl = sib.matches('input,select,textarea') ? sib : sib.querySelector('input:not([type=hidden]),select,textarea');
                if (ctl) {
                  if (!ctl.id) ctl.id = 'fp-ctl-' + Date.now().toString(36) + '-' + (uid++);
                  lb.setAttribute('for', ctl.id);
                  break;
                }
                if (sib.tagName === 'LABEL') break;
                sib = sib.nextElementSibling;
              }
            });
          };
          const obs = new MutationObserver(() => {
            cancelAnimationFrame(raf);
            raf = requestAnimationFrame(linkLabels);
          });
          obs.observe(document.body, { childList: true, subtree: true });
          linkLabels();
          return () => { obs.disconnect(); cancelAnimationFrame(raf); };
        }, []);

        useEffect(() => {
          document.documentElement.classList.toggle('dark', theme === 'dark');
          try {
            localStorage.setItem(THEME_KEY, theme);
          } catch {}
        }, [theme]);

        useEffect(() => {
          if (!dataMenuOpen) return;
          const handleOutside = (e) => {
            if (dataMenuRef.current && !dataMenuRef.current.contains(e.target)) {
              setDataMenuOpen(false);
            }
          };
          document.addEventListener('mousedown', handleOutside);
          return () => document.removeEventListener('mousedown', handleOutside);
        }, [dataMenuOpen]);

        const dismissToast = (id) => {
          setToasts((p) => p.filter((x) => x.id !== id));
        };

        const addToast = (title, description = '', onUndo = null) => {
          if (blockedRef.current) return;
          const id = generateId('t');
          setToasts((p) => [...p.slice(-2), { id, title, description, onUndo }]);
          setTimeout(() => dismissToast(id), onUndo ? 6500 : 3500);
        };

        // Real-time calculation of balances per account
        const accountBalances = useMemo(() => {
          return calculateAccountBalances(
            rawState.accounts || [],
            state.expenses,
            rawState.invoiceSettlements || [],
            state.currentMonthIndex,
            state.currentYear
          );
        }, [rawState.accounts, state.expenses, rawState.invoiceSettlements, state.currentMonthIndex, state.currentYear]);

        const kpis = useMemo(() => {
          const realizedIncome = state.incomes.reduce((a, i) => a + i.realizedAmount, 0);
          const expectedIncome = state.incomes.reduce((a, i) => a + i.expectedAmount, 0);
          
          // Accrual / Competência: each expense incurred in this month
          const totalExpenses = state.expenses.reduce((a, e) => a + e.amount, 0);
          const paidExpenses = state.expenses.filter((e) => e.status === 'Pago').reduce((a, e) => a + e.amount, 0);
          const pendingItems = state.expenses.filter((e) => e.status === 'Pendente');
          const pendingCount = pendingItems.length;
          const pendingExpenses = Math.max(0, totalExpenses - paidExpenses);
          const paidPercent = totalExpenses > 0 ? (paidExpenses / totalExpenses) * 100 : 0;
          const freeBalance = realizedIncome - totalExpenses;
          const freeMargin = realizedIncome > 0 ? (freeBalance / realizedIncome) * 100 : 0;
          
          // Effective Cash Outflows: direct expenses paid + invoice settlements paid
          const totalDirectCashOutflow = state.expenses
            .filter((e) => e.status === 'Pago' && e.paidSource !== 'cartao')
            .reduce((a, e) => a + e.amount, 0);
          const totalInvoiceSettlements = (rawState.invoiceSettlements || [])
            .filter((s) => s.monthIndex === state.currentMonthIndex && s.year === state.currentYear)
            .reduce((a, s) => a + s.amount, 0);
          const totalCashOutflow = totalDirectCashOutflow + totalInvoiceSettlements;
          
          // Total open card invoice debt
          const openCardInvoicesDebt = state.expenses
            .filter((e) => e.paymentMode === 'card' && !e.isInvoicePaid)
            .reduce((a, e) => a + e.amount, 0);

          // Total available balance in accounts
          const totalAccountsBalance = Object.values(accountBalances).reduce((a, b) => a + b.currentBalance, 0);

          const totalInvested = state.investments.reduce((a, i) => a + i.currentBalance, 0);
          const totalPlanned = state.investments.reduce((a, i) => a + i.plannedContribution, 0);
          const totalRemainingDebt = state.expenses.reduce((a, e) => a + (calculateRemainingDebt(e) ?? 0), 0);

          const paidBreakdown = {};
          state.expenses.filter((e) => e.status === 'Pago').forEach((e) => {
            let origin = 'Outros';
            let isCash = false;
            if (e.paidSource === 'cartao' || e.paymentMode === 'card') {
              const card = (rawState.cards || []).find((c) => isExpenseForCard(e, c, rawState.cards || []));
              origin = card ? `Cartão ${card.name}` : (e.paymentMethod || 'Cartão');
            } else if (e.paidSource === 'dinheiro_fisico' || e.paymentMethod?.toLowerCase().includes('dinheiro')) {
              origin = 'Dinheiro Físico';
              isCash = true;
            } else {
              const acc = (rawState.accounts || []).find((a) => isExpenseForAccount(e, a, rawState.accounts || []));
              origin = acc ? acc.name : (e.paidAccount || 'Conta Bancária');
            }
            if (!paidBreakdown[origin]) {
              paidBreakdown[origin] = { name: origin, total: 0, count: 0, isCash };
            }
            paidBreakdown[origin].total += e.amount;
            paidBreakdown[origin].count += 1;
          });
          const paidOriginsList = Object.values(paidBreakdown).sort((a, b) => b.total - a.total);

          return {
            realizedIncome, expectedIncome, totalExpenses, paidExpenses, pendingExpenses,
            pendingCount, paidPercent, freeBalance, freeMargin, totalCashOutflow,
            openCardInvoicesDebt, totalAccountsBalance, totalInvested, totalPlanned, totalRemainingDebt,
            paidOriginsList,
          };
        }, [state, rawState.invoiceSettlements, rawState.cards, rawState.accounts, accountBalances]);

        const paymentChannels = useMemo(() => {
          const channels = [];

          // 1. Cards
          (rawState.cards || []).forEach((card) => {
            const items = state.expenses.filter((e) => isExpenseForCard(e, card, rawState.cards || []));
            const total = items.reduce((a, e) => a + e.amount, 0);
            const isSettlementFound = (rawState.invoiceSettlements || []).some(
              (s) => s.cardId === card.id && s.monthIndex === state.currentMonthIndex && s.year === state.currentYear
            );
            const isInvoicePaid = isSettlementFound || (items.length > 0 && items.every((e) => e.isInvoicePaid));
            const paid = isInvoicePaid ? total : items.filter((e) => e.isInvoicePaid).reduce((a, e) => a + e.amount, 0);
            const pending = Math.max(0, total - paid);
            const pendingCount = items.filter((e) => !e.isInvoicePaid).length;
            const share = kpis.realizedIncome > 0 ? (total / kpis.realizedIncome) * 100 : 0;
            const invoicePaidPercent = total > 0 ? (paid / total) * 100 : 0;
            const futureInstallmentCount = items.filter(
              (e) => e.type === 'Parcelado' && e.currentInstallment < e.totalInstallments
            ).length;
            const unpaidTotalDebt = items.reduce((acc, e) => {
              if (e.type === 'Parcelado') return acc + (calculateRemainingDebt(e) ?? 0);
              return acc + (!e.isInvoicePaid ? e.amount : 0);
            }, 0);
            const linkedAcc = (rawState.accounts || []).find((a) => a.id === card.linkedAccountId);

            channels.push({
              id: card.id,
              name: card.name,
              color: card.color || 'sky',
              isCard: true,
              dueDay: card.dueDay,
              closingDay: card.closingDay,
              limit: card.limit || 0,
              isSettled: Boolean(card.isSettled),
              linkedAccountId: card.linkedAccountId,
              linkedAccount: linkedAcc ? linkedAcc.name : null,
              count: items.length,
              total,
              paid,
              pending,
              pendingCount,
              share,
              invoicePaidPercent,
              isInvoicePaid,
              futureInstallmentCount,
              unpaidTotalDebt,
            });
          });

          // 2. Accounts
          (rawState.accounts || []).forEach((acc) => {
            const items = state.expenses.filter((e) => isExpenseForAccount(e, acc, rawState.accounts || []));
            const total = items.reduce((a, e) => a + e.amount, 0);
            const paid = items.filter((e) => e.status === 'Pago').reduce((a, e) => a + e.amount, 0);
            const pending = Math.max(0, total - paid);
            const pendingCount = items.filter((e) => e.status === 'Pendente').length;
            const share = kpis.realizedIncome > 0 ? (total / kpis.realizedIncome) * 100 : 0;
            const invoicePaidPercent = total > 0 ? (paid / total) * 100 : 0;
            const isInvoicePaid = items.length > 0 && pendingCount === 0;
            const futureInstallmentCount = items.filter(
              (e) => e.type === 'Parcelado' && e.currentInstallment < e.totalInstallments
            ).length;
            const unpaidTotalDebt = items.reduce((acc, e) => {
              if (e.type === 'Parcelado') return acc + (calculateRemainingDebt(e) ?? 0);
              return acc + (e.status === 'Pendente' ? e.amount : 0);
            }, 0);

            channels.push({
              id: acc.id,
              name: acc.name,
              color: acc.color || 'emerald',
              isCard: false,
              dueDay: null,
              closingDay: null,
              limit: 0,
              isSettled: false,
              linkedAccountId: null,
              linkedAccount: null,
              count: items.length,
              total,
              paid,
              pending,
              pendingCount,
              share,
              invoicePaidPercent,
              isInvoicePaid,
              futureInstallmentCount,
              unpaidTotalDebt,
              currentBalance: accountBalances[acc.id]?.currentBalance || 0,
            });
          });

          // Snowball winner
          const snowballCandidates = channels.filter(
            (ch) => ch.isCard !== false && !ch.isSettled && ch.unpaidTotalDebt > 0
          );
          let snowballWinnerName = null;
          if (snowballCandidates.length > 1) {
            snowballCandidates.sort((a, b) => a.unpaidTotalDebt - b.unpaidTotalDebt);
            snowballWinnerName = snowballCandidates[0].name;
          }

          return channels.map((ch) => ({
            ...ch,
            isSnowballTarget: ch.name === snowballWinnerName,
          }));
        }, [rawState.cards, rawState.accounts, state.expenses, rawState.invoiceSettlements, kpis.realizedIncome, state.currentMonthIndex, state.currentYear, accountBalances]);

        const activeSelectedChannel = useMemo(
          () => (filterMethod !== 'Todos' ? paymentChannels.find((c) => c.name === filterMethod || c.id === filterMethod) || null : null),
          [filterMethod, paymentChannels]
        );

        const projectionData = useMemo(
          () => generate12MonthProjection(rawState.expenses, state.currentMonthIndex, state.currentYear),
          [rawState.expenses, state.currentMonthIndex, state.currentYear]
        );

        const filteredExpenses = useMemo(() => {
          const q = searchQuery.trim().toLowerCase();
          const cleanQ = q.replace(',', '.');
          const numQ = parseFloat(cleanQ);

          const list = (state.expenses || []).filter((e) => {
            const mAmount = !Number.isNaN(numQ) && (
              String(e.amount).includes(cleanQ) ||
              (e.amount ? e.amount.toFixed(2).includes(cleanQ) : false) ||
              formatBRL(e.amount || 0).toLowerCase().includes(q)
            );

            const mText =
              !q ||
              (e.description || '').toLowerCase().includes(q) ||
              (e.invoiceName && e.invoiceName.toLowerCase().includes(q)) ||
              (e.legend && e.legend.toLowerCase().includes(q)) ||
              (e.notes && e.notes.toLowerCase().includes(q)) ||
              (e.paymentMethod && e.paymentMethod.toLowerCase().includes(q)) ||
              (e.category && e.category.toLowerCase().includes(q)) ||
              (e.subcategory && e.subcategory.toLowerCase().includes(q)) ||
              (e.tags || []).some((t) => t.toLowerCase().includes(q)) ||
              mAmount;

            let mMethod = true;
            if (filterMethod === 'Todos') {
              mMethod = true;
            } else if (filterMethod === 'unspecified' || filterMethod === 'A definir') {
              mMethod = e.paymentMode === 'unspecified' || e.paymentMethod === 'A definir';
            } else {
              const matchedCard = (rawState.cards || []).find((c) => c.id === filterMethod || c.name === filterMethod);
              const matchedAcc = (rawState.accounts || []).find((a) => a.id === filterMethod || a.name === filterMethod);
              if (matchedCard) {
                mMethod = isExpenseForCard(e, matchedCard, rawState.cards || []);
              } else if (matchedAcc) {
                mMethod = isExpenseForAccount(e, matchedAcc, rawState.accounts || []);
              } else {
                mMethod =
                  e.cardId === filterMethod ||
                  e.accountId === filterMethod ||
                  e.paymentMethod === filterMethod;
              }
            }
            const mType = filterType === 'Todos' || e.type === filterType;
            const mStatus =
              filterStatus === 'Todos' ||
              (filterStatus === 'Pendente' && e.status === 'Pendente') ||
              (filterStatus === 'Pago' && e.status === 'Pago') ||
              (filterStatus === 'PagoConta' && e.status === 'Pago' && e.paidSource !== 'dinheiro_fisico') ||
              (filterStatus === 'PagoFisico' && e.status === 'Pago' && e.paidSource === 'dinheiro_fisico');
            const mHidePaid = !hidePaid || e.status !== 'Pago';
            const mCat =
              filterCategory === 'Todos' ||
              (e.category || '').toLowerCase() === filterCategory.toLowerCase();
            const mSubcat =
              filterSubcategory === 'Todos' ||
              (e.subcategory || '').toLowerCase() === filterSubcategory.toLowerCase();
            const mTag =
              filterTag === 'Todos' ||
              (e.tags || []).some((t) => t.toLowerCase() === filterTag.toLowerCase());

            const mReconciled =
              filterReconciled === 'Todos' ||
              (filterReconciled === 'reconciled' && e.reconciled) ||
              (filterReconciled === 'unreconciled' && !e.reconciled);

            return mText && mMethod && mType && mStatus && mHidePaid && mCat && mSubcat && mTag && mReconciled;
          });

          const copy = [...list];
          if (sortBy === 'order') {
            // Ordem de Lançamento original: preserva exatamente como cadastrado
            return copy;
          } else if (sortBy === 'recent') {
            copy.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          } else if (sortBy === 'oldest') {
            copy.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
          } else if (sortBy === 'pendingFirst') {
            copy.sort((a, b) => {
              if (a.status !== b.status) return a.status === 'Pendente' ? -1 : 1;
              return b.amount - a.amount;
            });
          } else if (sortBy === 'dueDateAsc') {
            copy.sort((a, b) => {
              const getSortDate = (x) => {
                if (x.dueDate) return x.dueDate;
                const card = (rawState.cards || []).find((c) => c.id === x.cardId || c.name === x.paymentMethod);
                if (card?.dueDay) return `8888-88-${String(card.dueDay).padStart(2, '0')}`;
                return x.status === 'Pago' ? '9999-99-99' : '9998-99-99';
              };
              return getSortDate(a).localeCompare(getSortDate(b));
            });
          } else if (sortBy === 'amountDesc') {
            copy.sort((a, b) => b.amount - a.amount);
          } else if (sortBy === 'amountAsc') {
            copy.sort((a, b) => a.amount - b.amount);
          } else if (sortBy === 'unreconciledFirst') {
            copy.sort((a, b) => {
              const aRec = Boolean(a.reconciled);
              const bRec = Boolean(b.reconciled);
              if (aRec !== bRec) return aRec ? 1 : -1;
              return 0;
            });
          }
          return copy;
        }, [state.expenses, searchQuery, filterMethod, filterType, filterStatus, hidePaid, filterCategory, filterSubcategory, filterTag, filterReconciled, sortBy, rawState.cards]);

        const filteredTotal = useMemo(
          () => filteredExpenses.reduce((acc, item) => acc + item.amount, 0),
          [filteredExpenses]
        );

        const activeTagsInMonth = useMemo(() => {
          const counts = {};
          (state.expenses || []).forEach((e) => {
            (e.tags || []).forEach((t) => {
              const clean = String(t).trim();
              if (clean) counts[clean] = (counts[clean] || 0) + 1;
            });
          });
          return Object.entries(counts).map(([tag, count]) => ({ tag, count }));
        }, [state.expenses]);

        const selectedExpenses = useMemo(() => {
          const idsSet = new Set(selectedExpenseIds);
          return (filteredExpenses || []).filter((e) => idsSet.has(e.id));
        }, [filteredExpenses, selectedExpenseIds]);

        const selectedExpensesTotal = useMemo(() => {
          return selectedExpenses.reduce((acc, e) => acc + (Number(e.amount) || 0), 0);
        }, [selectedExpenses]);

        const isAllSelected = useMemo(() => {
          return filteredExpenses.length > 0 && filteredExpenses.every((e) => selectedExpenseIds.includes(e.id));
        }, [filteredExpenses, selectedExpenseIds]);

        const isSomeSelected = useMemo(() => {
          return filteredExpenses.some((e) => selectedExpenseIds.includes(e.id)) && !isAllSelected;
        }, [filteredExpenses, selectedExpenseIds, isAllSelected]);

        const toggleSelectExpense = (id) => {
          setSelectedExpenseIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
        };

        const toggleSelectAll = () => {
          if (isAllSelected) {
            setSelectedExpenseIds([]);
          } else {
            setSelectedExpenseIds(filteredExpenses.map((e) => e.id));
          }
        };

        const clearSelection = () => {
          setSelectedExpenseIds([]);
        };

              if (!Array.isArray(d.incomes) || !Array.isArray(d.expenses)) throw new Error();
              const { accounts, cards, paymentMethods } = normalizeFinancialEntities(d);
              snapshotBeforeReplace();
              setRawState({
                ...createEmptyState(),
                ...d,
                incomes: d.incomes,
                investments: Array.isArray(d.investments) ? d.investments : [],
                history: Array.isArray(d.history) ? d.history : [],
                archive: Array.isArray(d.archive) ? d.archive : [],
                invoiceSettlements: Array.isArray(d.invoiceSettlements) ? d.invoiceSettlements : [],
                budget: d.budget && typeof d.budget === 'object' ? d.budget : { monthlyLimit: 0, categoryLimits: {} },
                accounts,
                cards,
                paymentMethods,
                expenses: d.expenses.map((e) => normalizeExpenseEntity(e, accounts, cards)),
              });
              setViewOffset(0);
              addToast('Backup restaurado!', f.name);
            } catch {
              addToast('Arquivo inválido', 'Use um JSON exportado pelo FinançasPro.');
            }
          };
          reader.readAsText(f);
          e.target.value = '';
          setDataMenuOpen(false);
        };

        const handleImportCSV = (e) => {
          const f = e.target.files?.[0];
          if (!f) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const text = String(reader.result || '');
              const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
              if (lines.length < 2) throw new Error('Arquivo vazio ou sem registros');

              const firstLine = lines[0];
              const sep = (firstLine.match(/;/g) || []).length >= (firstLine.match(/,/g) || []).length ? ';' : ',';

              const parseCells = (line) => {
                const cells = [];
                let cell = '';
                let inQuote = false;
                for (let i = 0; i < line.length; i++) {
                  const ch = line[i];
                  if (ch === '"') {
                    if (inQuote && line[i + 1] === '"') {
                      cell += '"';
                      i++;
                    } else {
                      inQuote = !inQuote;
                    }
                  } else if (ch === sep && !inQuote) {
                    cells.push(cell.trim());
                    cell = '';
                  } else {
                    cell += ch;
                  }
                }
                cells.push(cell.trim());
                return cells;
              };

              const header = parseCells(firstLine).map((h) => h.toLowerCase());
              const isFinancasPro = header.includes('seção') || header.includes('secao');

              let addedExpenses = 0;
              let addedIncomes = 0;
              const newExpenses = [...rawState.expenses];
              const newIncomes = [...rawState.incomes];
              const curAbs = rawState.currentYear * 12 + rawState.currentMonthIndex;

              if (isFinancasPro) {
                const secIdx = header.findIndex((h) => h.includes('seção') || h.includes('secao'));
                const descIdx = header.findIndex((h) => h.includes('descrição') || h.includes('descricao'));
                const valIdx = header.findIndex((h) => h.includes('valor'));
                const statusIdx = header.findIndex((h) => h.includes('status'));
                const typeIdx = header.findIndex((h) => h.includes('tipo'));

                for (let i = 1; i < lines.length; i++) {
                  const row = parseCells(lines[i]);
                  if (row.length < 2) continue;
                  const sec = (row[secIdx >= 0 ? secIdx : 0] || '').trim();
                  const desc = (row[descIdx >= 0 ? descIdx : 1] || 'Lançamento').trim();
                  const valRaw = (row[valIdx >= 0 ? valIdx : 5] || '0').replace('R$', '').trim().replace(/\./g, '').replace(',', '.');
                  const val = Math.abs(parseMoneyInput(row[valIdx >= 0 ? valIdx : 5] || '0'));
                  if (val <= 0) continue;

                  if (sec === 'Saída' || sec === 'Despesa') {
                    const st = (row[statusIdx] || 'Pendente').includes('Pago') ? 'Pago' : 'Pendente';
                    const tp = (row[typeIdx] || 'Esporádico').trim();
                    newExpenses.push({
                      id: generateId('exp'),
                      description: desc,
                      amount: val,
                      type: tp === 'Fixo' || tp === 'Parcelado' ? tp : 'Esporádico',
                      status: st,
                      paymentMode: 'unspecified',
                      paymentMethod: 'A definir',
                      category: guessCategory(desc),
                      dueDate: `${rawState.currentYear}-${String(rawState.currentMonthIndex + 1).padStart(2, '0')}-10`,
                      baseAbs: curAbs,
                    });
                    addedExpenses++;
                  } else if (sec === 'Renda' || sec === 'Entrada') {
                    newIncomes.push({
                      id: generateId('inc'),
                      name: desc,
                      category: 'extra',
                      expectedAmount: val,
                      realizedAmount: val,
                      baseAbs: curAbs,
                    });
                    addedIncomes++;
                  }
                }
              } else {
                const dateIdx = header.findIndex((h) => h.includes('data') || h.includes('date'));
                const descIdx = header.findIndex((h) => h.includes('descri') || h.includes('hist') || h.includes('memo') || h.includes('título') || h.includes('titulo'));
                const valIdx = header.findIndex((h) => h.includes('valor') || h.includes('amount') || h.includes('quantia'));

                for (let i = 1; i < lines.length; i++) {
                  const row = parseCells(lines[i]);
                  if (row.length < 2) continue;
                  const desc = (row[descIdx >= 0 ? descIdx : 1] || 'Lançamento extrato').trim();
                  const rawVal = (row[valIdx >= 0 ? valIdx : row.length - 1] || '0').replace('R$', '').trim();
                  const isNeg = rawVal.startsWith('-') || rawVal.endsWith('-') || (row.some((c) => c.toLowerCase() === 'd' || c.toLowerCase() === 'débito' || c.toLowerCase() === 'debito'));
                  const numVal = Math.abs(parseMoneyInput(rawVal));
                  if (numVal <= 0) continue;

                  let dueDateStr = `${rawState.currentYear}-${String(rawState.currentMonthIndex + 1).padStart(2, '0')}-10`;
                  if (dateIdx >= 0 && row[dateIdx]) {
                    const dp = row[dateIdx].split(/[\/\-]/);
                    if (dp.length === 3) {
                      if (dp[0].length === 4) {
                        dueDateStr = `${dp[0]}-${dp[1].padStart(2, '0')}-${dp[2].padStart(2, '0')}`;
                      } else {
                        dueDateStr = `${dp[2].length === 2 ? '20' + dp[2] : dp[2]}-${dp[1].padStart(2, '0')}-${dp[0].padStart(2, '0')}`;
                      }
                    }
                  }

                  if (Number.isNaN(Date.parse(dueDateStr))) {
                    dueDateStr = `${rawState.currentYear}-${String(rawState.currentMonthIndex + 1).padStart(2, '0')}-10`;
                  }
                  if (isNeg || rawVal.startsWith('-')) {
                    newExpenses.push({
                      id: generateId('exp'),
                      description: desc,
                      amount: numVal,
                      type: 'Esporádico',
                      status: 'Pago',
                      paidDate: dueDateStr,
                      paymentMode: 'unspecified',
                      paymentMethod: 'A definir',
                      category: guessCategory(desc),
                      dueDate: dueDateStr,
                      baseAbs: curAbs,
                    });
                    addedExpenses++;
                  } else {
                    newIncomes.push({
                      id: generateId('inc'),
                      name: desc,
                      category: 'extra',
                      expectedAmount: numVal,
                      realizedAmount: numVal,
                      baseAbs: curAbs,
                    });
                    addedIncomes++;
                  }
                }
              }

              const seenE = new Set(rawState.expenses.map((x) => `${x.description}|${roundMoney(x.amount)}|${x.dueDate || ''}`));
              const seenI = new Set(rawState.incomes.map((x) => `${x.name}|${roundMoney(x.expectedAmount)}`));
              const addedExpArr = newExpenses.slice(rawState.expenses.length).filter((x) => !seenE.has(`${x.description}|${roundMoney(x.amount)}|${x.dueDate || ''}`));
              const addedIncArr = newIncomes.slice(rawState.incomes.length).filter((x) => !seenI.has(`${x.name}|${roundMoney(x.expectedAmount)}`));
              const skippedDup = addedExpenses + addedIncomes - addedExpArr.length - addedIncArr.length;
              if (addedExpenses === 0 && addedIncomes === 0) {
                addToast('Nenhum registro reconhecido', 'Verifique as colunas do CSV.');
              } else if (addedExpArr.length === 0 && addedIncArr.length === 0) {
                addToast('Nada novo para importar', `${skippedDup} registro(s) já existiam e foram ignorados.`);
              } else {
                setRawState((p) => ({
                  ...p,
                  expenses: [...p.expenses, ...addedExpArr],
                  incomes: [...p.incomes, ...addedIncArr],
                }));
                addToast('Extrato importado com sucesso! 📄', `${addedExpArr.length} despesa(s) e ${addedIncArr.length} renda(s) adicionadas${skippedDup ? `; ${skippedDup} duplicada(s) ignorada(s)` : ''}.`);
              }
            } catch (err) {
              console.error(err);
              addToast('Erro ao processar CSV', 'Certifique-se de que o arquivo é um CSV válido.');
            }
          };
          reader.readAsText(f);
          e.target.value = '';
          setDataMenuOpen(false);
        };

        const handleSyncGoogleSheets = async (stateToSend = rawState, silent = false) => {
          if (!sheetsConfig.url) {
            if (!silent) {
              setSheetsModalOpen(true);
              addToast('Configuração necessária', 'Cole a URL da sua planilha Google.');
            }
            return;
          }
          setIsSyncingSheets(true);
          try {
            const res = await fetch(sheetsConfig.url, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'sync', data: stateToSend }),
            });
            const resJson = await res.json();
            if (res.ok && resJson.status === 'success') {
              const nowStr = new Date().toLocaleString('pt-BR');
              setSheetsConfig((p) => ({ ...p, lastSync: nowStr }));
              if (!silent) addToast('Google Sheets atualizado! 📊', 'Todas as abas e o backup foram sincronizados.');
            } else {
              throw new Error(resJson.message || 'Falha na resposta do Sheets');
            }
          } catch (err) {
            console.error(err);
            if (!silent) addToast('Falha na sincronização', 'Verifique a URL e se a implantação está acessível a "Qualquer pessoa".');
          } finally {
            setIsSyncingSheets(false);
          }
        };

        const handlePullGoogleSheets = async () => {
          if (!sheetsConfig.url) {
            addToast('Configuração necessária', 'Cole a URL da sua planilha Google.');
            return;
          }
          setIsSyncingSheets(true);
          try {
            const res = await fetch(`${sheetsConfig.url}?t=${Date.now()}`);
            const resJson = await res.json();
            if (resJson.status === 'success' && resJson.data) {
              const d = resJson.data;
              if (!Array.isArray(d.incomes) || !Array.isArray(d.expenses)) {
                throw new Error('Formato incompatível na planilha');
              }
              const { accounts, cards, paymentMethods } = normalizeFinancialEntities(d);
              snapshotBeforeReplace();
              setRawState({
                ...createEmptyState(),
                ...d,
                incomes: d.incomes,
                investments: Array.isArray(d.investments) ? d.investments : [],
                history: Array.isArray(d.history) ? d.history : [],
                archive: Array.isArray(d.archive) ? d.archive : [],
                invoiceSettlements: Array.isArray(d.invoiceSettlements) ? d.invoiceSettlements : [],
                budget: d.budget && typeof d.budget === 'object' ? d.budget : { monthlyLimit: 0, categoryLimits: {} },
                accounts,
                cards,
                paymentMethods,
                expenses: d.expenses.map((e) => normalizeExpenseEntity(e, accounts, cards)),
              });
              setViewOffset(0);
              const nowStr = new Date().toLocaleString('pt-BR');
              setSheetsConfig((p) => ({ ...p, lastSync: nowStr }));
              addToast('Dados restaurados do Google Sheets! 📥', 'Seus lançamentos foram sincronizados.');
              setSheetsModalOpen(false);
            } else {
              throw new Error(resJson.message || 'Nenhum backup encontrado na planilha');
            }
          } catch (err) {
            console.error(err);
            addToast('Erro ao carregar do Sheets', err.message || 'Verifique a conexão ou sincronize primeiro.');
          } finally {
            setIsSyncingSheets(false);
          }
        };

        useEffect(() => {
          if (!sheetsConfig.autoSync || !sheetsConfig.url) return;
          // Nunca sobrescreve o backup na nuvem com um estado vazio (ex.: após "zerar tudo" ou falha de carga)
          if (!rawState.expenses.length && !rawState.incomes.length && !(rawState.investments || []).length) return;
          const timer = setTimeout(() => {
            handleSyncGoogleSheets(rawState, true);
          }, 3500);
          return () => clearTimeout(timer);
        }, [rawState, sheetsConfig.autoSync, sheetsConfig.url]);

        const navItems = [
          { id: 'dashboard', label: 'Visão Geral', short: 'Início', Icon: Icons.Dashboard },
          { id: 'expenses', label: 'Lançamentos e Parcelas', short: 'Gastos', Icon: Icons.Receipt },
          { id: 'calendar', label: 'Calendário de Vencimentos', short: 'Calendário', Icon: Icons.Calendar },
          { id: 'incomes', label: 'Fontes de Renda', short: 'Rendas', Icon: Icons.Wallet },
          { id: 'budget', label: 'Orçamento e Limites', short: 'Limites', Icon: Icons.Target },
          { id: 'investments', label: 'Dinheiro Guardado', short: 'Guardado', Icon: Icons.TrendingUp },
        ];

        const getMethodColor = (name, item = null) => {
          if (!name || name === 'A definir' || item?.paymentMode === 'unspecified') return 'amber';
          if (item) {
            const c = (rawState.cards || []).find((x) => isExpenseForCard(item, x, rawState.cards || []));
            if (c?.color) return c.color;
            const a = (rawState.accounts || []).find((x) => isExpenseForAccount(item, x, rawState.accounts || []));
            if (a?.color) return a.color;
          }
          const foundCard = (rawState.cards || []).find((c) => c.name === name || c.id === name);
          if (foundCard?.color) return foundCard.color;
          const foundAcc = (rawState.accounts || []).find((a) => a.name === name || a.id === name);
          if (foundAcc?.color) return foundAcc.color;
          return state.paymentMethods?.find((pm) => pm.name === name)?.color || 'slate';
        };
        const hasFilters =
          searchQuery ||
          filterMethod !== 'Todos' ||
          filterType !== 'Todos' ||
          filterStatus !== 'Todos' ||
          filterReconciled !== 'Todos' ||
          hidePaid ||
          filterCategory !== 'Todos' ||
          filterSubcategory !== 'Todos' ||
          filterTag !== 'Todos' ||
          sortBy !== 'order';

        return (
          <div className="min-h-screen bg-[#F8FAFC] dark:bg-[#09090B] text-slate-900 dark:text-zinc-100">
            <input ref={fileRef} type="file" accept=".json" className="hidden" onChange={handleImport} />
            <input ref={csvFileRef} type="file" accept=".csv,text/csv" className="hidden" onChange={handleImportCSV} />

            {/* Sidebar Desktop */}
            <aside className="hidden lg:flex lg:fixed lg:inset-y-0 lg:left-0 lg:w-64 lg:flex-col border-r border-[#E2E8F0] dark:border-[#27272A] bg-white dark:bg-[#18181B]">
              <div className="flex items-center gap-3 px-5 h-16 border-b border-[#E2E8F0] dark:border-[#27272A]">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white">
                  <Icons.Sparkles className="w-5 h-5" />
                </div>
                <div>
                  <span className="font-bold text-base block leading-none">FinançasPro</span>
                  <span className="text-[11px] text-slate-500 dark:text-zinc-400">Gestão Pessoal</span>
                </div>
              </div>

              <div className="px-4 pt-4">
                <div className="rounded-xl border border-[#E2E8F0] dark:border-[#27272A] bg-slate-50 dark:bg-zinc-900/70 p-3">
                  <p className="text-[11px] uppercase tracking-wider text-slate-500 dark:text-zinc-400">Competência</p>
                  <p className="text-sm font-bold mt-0.5">{formatMonthYear(rawState.currentMonthIndex, rawState.currentYear)}</p>
                  <button type="button" onClick={() => setTurnMonthOpen(true)} className="mt-2.5 w-full inline-flex items-center justify-center gap-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 text-xs font-semibold">
                    <Icons.Calendar className="w-3.5 h-3.5" /> Virar Mês
                  </button>
                </div>
              </div>

              <nav className="flex-1 px-3 py-4 space-y-1">
                {navItems.map((n) => (
                  <button key={n.id} type="button" onClick={() => setActiveTab(n.id)} className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all ${activeTab === n.id ? 'bg-emerald-500/10 text-emerald-700 dark:text-emerald-300 font-semibold border border-emerald-500/20' : 'text-slate-600 dark:text-zinc-400 hover:bg-slate-100 dark:hover:bg-zinc-800/70 border border-transparent'}`}>
                    <span className="flex items-center gap-3">
                      <n.Icon className="w-5 h-5" />
                      <span>{n.label}</span>
                    </span>
                    {(n.id === 'expenses' || n.id === 'calendar') && kpis.pendingCount > 0 && (
                      <span className="px-1.5 py-0.5 text-[10px] font-bold rounded-full bg-amber-500/15 text-amber-700 dark:text-amber-300 tabular-nums">
                        {kpis.pendingCount}
                      </span>
                    )}
                  </button>
                ))}

                <div className="pt-3 mt-3 border-t border-[#E2E8F0] dark:border-[#27272A] space-y-1">
                  <button
                    type="button"
                    onClick={() => setPmModalOpen(true)}
                    className="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-zinc-400 hover:bg-slate-100 dark:hover:bg-zinc-800/70"
                  >
                    <Icons.CreditCard className="w-5 h-5 text-violet-500" />
                    <span>Contas e Cartões</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => setCategoryTagModalOpen(true)}
                    className="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-zinc-400 hover:bg-slate-100 dark:hover:bg-zinc-800/70"
                  >
                    <Icons.Tag className="w-5 h-5 text-indigo-500" />
                    <span>Categorias & Tags</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => setSheetsModalOpen(true)}
                    className="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-zinc-400 hover:bg-slate-100 dark:hover:bg-zinc-800/70"
                  >
                    <span className="flex items-center gap-3">
                      <Icons.Sheet className="w-5 h-5 text-emerald-500" />

                    {sheetsConfig.url ? (

                  </button>
                  <button

                      {isInstalledApp ? '✓ Instalado' : 'Instalar'}

              <div className="p-4 border-t border-[#E2E8F0] dark:border-[#27272A] space-y-2 text-xs">

                    <Icons.Plus className="w-3.5 h-3.5" /> Renda

                    <Icons.Tag className="w-4 h-4 text-indigo-500" />

                  <button type="button" onClick={() => setTurnMonthOpen(true)} className="lg:hidden inline-flex items-center justify-center rounded-xl border border-[#E2E8F0] dark:border-[#27272A] p-2 text-xs font-semibold" title="Virar Mês">

                  <button
                    type="button"
                    onClick={() => setSheetsModalOpen(true)}

                    title="Google Sheets"

                  </button>

                  <button
                    type="button"
                    onClick={() => {
                      if (deferredPrompt) {
                        handleNativeInstall();

                        setPwaInstallModalOpen(true);
                      }
                    }}
                    className="inline-flex items-center gap-1.5 rounded-xl border border-sky-500/30 bg-sky-500/10 hover:bg-sky-500/20 text-sky-700 dark:text-sky-300 px-2.5 sm:px-3 py-2 text-xs font-semibold transition-colors"
                    title="Instalar FinançasPro no iPhone / Celular / PC"
                  >
